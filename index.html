   simulé. La note juge les DÉCISIONS (sur 100), prises au moment du
   lancement. Le résultat en dollars est montré à part : il y a du hasard. */
const PROFILES = [
  { id: 'prudent', name: 'Prudent', maxLoss: 2, goal: 1, story: 'Tu viens de déposer 100 $ et tu ne veux surtout pas les entamer. Trouve un trade propre : pas plus de 2 $ de perte, pour viser un petit +1 $.' },
  { id: 'equi', name: 'Équilibré', maxLoss: 8, goal: 5, story: 'Tu acceptes un risque mesuré : jusqu\'à 8 $ de perte pour aller chercher +5 $. Ni trop timide, ni tête brûlée.' },
  { id: 'agressif', name: 'Agressif', maxLoss: 20, goal: 15, story: 'Tu vises gros : +15 $. Tu acceptes de perdre jusqu\'à 20 $, mais pas de tout laisser sur un piège.' }
];
const CONG = [
  { name: 'calme', txt: 'Le réseau Solana est calme en ce moment.', median: 0.0002 },
  { name: 'normal', txt: 'Le réseau Solana tourne normalement.', median: 0.001 },
  { name: 'chargé', txt: 'Le réseau Solana est saturé : tout le monde se bat pour entrer dans les blocs.', median: 0.004 }
];
const DAY = 86400e3;
// quand les 10 plus gros portefeuilles détiennent 45 % ou plus, une grosse vente (et donc une chute) est bien plus probable
const dumpP = (T, top10) => (T.dump || 0)*(top10 >= 45 ? 2.5 : 1);
const TTYPES = {
  major: { label: 'Gros token', liq: [2e7, 6e7], vol: 0.0035, slip: [1, 3], price: [0.4, 12], pool: 0.001, plat: 0, dump: 0, dex: 'orca', age: [400*DAY, 1400*DAY] },
  estab: { label: 'Memecoin établi', liq: [1.5e5, 5e5], vol: 0.014, slip: [3, 8], price: [0.002, 0.2], pool: 0.0025, plat: PLAT_FEE, dump: 0.08, dumpF: [0.6, 0.8], dex: 'raydium', age: [40*DAY, 300*DAY] },
  fresh: { label: 'Memecoin récent', liq: [6e3, 2.5e4], vol: 0.035, slip: [8, 20], price: [0.000004, 0.0004], pool: 0.0125, plat: PLAT_FEE, dump: 0.15, dumpF: [0.25, 0.6], dex: 'pumpfun', age: [12*60e3, 100*60e3] }
};
const TNAMES = {
  major: [['ORBIT', 'Orbit Network'], ['NOVA', 'Nova Protocol'], ['ATLAS', 'Atlas Finance'], ['VEGA', 'Vega Chain']],
  estab: [['FROGE', 'Froge'], ['KITTY', 'Kitty Inu'], ['BLOB', 'Blob'], ['HONK', 'Honk the Goose']],
  fresh: [['ZORP', 'Zorp'], ['GIGAPUG', 'Giga Pug'], ['PLOP', 'Plop'], ['YEET', 'Yeet Coin'], ['MOONBOY', 'Moon Boy'], ['SNOOT', 'Snoot']]
};
const CAPITAL = 100, CANDLES = 60, TICK_MS = 260;
let M = null, msChart = null, msSeries = null;
const gauss = () => { let u = 0, w = 0; while (!u) u = Math.random(); while (!w) w = Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*w); };
function gbm(n, p0, vol, drift){
  const out = []; let p = p0;
  for (let i = 0; i < n; i++){
    const o = p, fat = Math.random() < 0.06 ? 3 : 1;
    p = Math.max(o*0.2, o*Math.exp(drift + vol*fat*gauss()));
    const h = Math.max(o, p)*(1 + Math.abs(gauss())*vol*0.45), l = Math.min(o, p)*(1 - Math.abs(gauss())*vol*0.45);
    out.push({ o, h, l, c: p });
  }
  return out;
}
const B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
// Indicateurs « Activité » d'un token fictif, et leur effet sur la suite du marché :
// - part du créateur élevée, peu de détenteurs, top 10 concentré : chute brutale plus probable ;
// - volume peu organique (bots) : le prix tend à baisser quand les bots partent ;
// - plus d'achats que de ventes sur les 5 dernières minutes : un peu d'élan à la hausse (et l'inverse).
function mkActivity(type, hist, T){
  const last = hist[hist.length - 1].c, r5 = last/hist[hist.length - 6].o - 1, r60 = last/hist[0].o - 1;
  const dev = type === 'major' ? +rnd(0, 1.5).toFixed(1) : type === 'estab' ? +rnd(0, 6).toFixed(1) : Math.random() < 0.5 ? +rnd(0, 3).toFixed(1) : +rnd(3, 25).toFixed(1);
  const holders = Math.round(type === 'major' ? rnd(8e4, 6e5) : type === 'estab' ? rnd(2e3, 4e4) : rnd(30, 1500));
  const organic = Math.round(type === 'major' ? rnd(75, 98) : type === 'estab' ? rnd(35, 90) : rnd(5, 85));
  const n5 = Math.round(type === 'major' ? rnd(300, 900) : type === 'estab' ? rnd(40, 200) : rnd(20, 250));
  const share = x => Math.min(0.85, Math.max(0.15, 0.5 + x*3));
  const sh5 = share(r5/(T.vol*Math.sqrt(5))*0.08), sh60 = share(r60/(T.vol*Math.sqrt(60))*0.08), n60 = Math.round(n5*rnd(8, 14));
  const dumpMul = (dev >= 10 ? 2 : dev >= 4 ? 1.4 : 1)*(type === 'fresh' && holders < 150 ? 1.3 : 1);
  const driftAdj = (organic < 30 ? -0.08 : organic < 50 ? -0.03 : 0)*T.vol + (sh5 - 0.5)*2*0.08*T.vol;
  return { dev, holders, organic, b5: Math.round(n5*sh5), s5: n5 - Math.round(n5*sh5), b60: Math.round(n60*sh60), s60: n60 - Math.round(n60*sh60), dumpMul, driftAdj };
}
function mkToken(type, flagged, used){
  const T = TTYPES[type];
  const [name, full] = pickOne(TNAMES[type].filter(n => !used.has(n[0]))); used.add(name);
  const R = rnd(T.liq[0], T.liq[1]), onCurve = T.dex === 'pumpfun' && !flagged, sol = solPx();
  // market cap cohérente avec la liquidité : sur la courbe pump.fun elle découle des réserves virtuelles,
  // ailleurs la liquidité vaut quelques pour cent de la market cap
  let mc, price;
  if (type === 'major'){ mc = R*rnd(25, 60); price = Math.exp(rnd(Math.log(T.price[0]), Math.log(T.price[1]))); }
  else {
    mc = onCurve ? (R/sol)**2/32.19*sol : 2*R/(type === 'estab' ? rnd(0.03, 0.15) : rnd(0.08, 0.3));
    price = mc/1e9;
  }
  const vol = T.vol*rnd(0.8, 1.3);
  const h0 = gbm(CANDLES, 1, vol, (Math.random() - 0.5)*T.vol*0.3), k = price/h0[h0.length - 1].c;
  const hist = h0.map(c => ({ o: c.o*k, h: c.h*k, l: c.l*k, c: c.c*k }));
  const act = mkActivity(type, hist, T);
  const fut = gbm(CANDLES, price, vol, (Math.random() - 0.5)*T.vol*0.3 + act.driftAdj);
  const checks = { mint: true, freeze: true, lp: true };
  let rug = -1, rugKind = null;
  if (flagged){
    rugKind = pickOne(['mint', 'freeze', 'lp']); checks[rugKind] = false;
    if (Math.random() < 0.75){
      rug = Math.floor(rnd(8, 50));
      if (rugKind !== 'freeze') for (let i = rug; i < CANDLES; i++){ const c = fut[i], m = 0.07; fut[i] = { o: c.o*m, h: c.h*m, l: c.l*m, c: c.c*m }; }
    }
  }
  // un memecoin peut aussi s'effondrer sans croix rouge : gros vendeur, créateur ou snipers qui sortent
  const top10 = type === 'major' ? Math.round(rnd(8, 18)) : Math.round(rnd(type === 'fresh' ? 22 : 14, type === 'fresh' ? 55 : 35));
  if (T.dump && Math.random() < Math.min(0.85, dumpP(T, top10)*act.dumpMul)){
    const d = Math.floor(rnd(3, 57)), m = rnd(T.dumpF[0], T.dumpF[1]);
    for (let i = d; i < CANDLES; i++){ const c = fut[i]; fut[i] = { o: c.o*m, h: c.h*m, l: c.l*m, c: c.c*m }; }   // trou : le stop part au prix d'après la chute
  }
  return { name, full, type, dex: onCurve ? 'pumpfun' : T.dex === 'pumpfun' ? 'raydium' : T.dex, pool: onCurve ? 0.0125 : T.dex === 'pumpfun' ? 0.0025 : T.pool, label: T.label, price, R, vol, slip: T.slip, hist, fut, checks, rug, rugKind,
    hue: Math.floor(rnd(0, 360)), created: Date.now() - rnd(T.age[0], T.age[1]),
    addr: Array.from({ length: 44 }, () => B58[Math.floor(Math.random()*58)]).join(''),
    vol1h: R*rnd(0.15, 0.9), lpPct: checks.lp ? 100 : Math.floor(rnd(0, 30)), top10, act, mc,
    liqShown: onCurve ? 2*Math.max(0, R - 30*sol) : 2*R };
}
function newMission(){
  const used = new Set(), profile = pickOne(PROFILES), cong = pickOne(CONG);
  const flagEstab = Math.random() < 0.25, flagFresh = !flagEstab && Math.random() < 0.6;
  const tokens = shuffle([mkToken('major', false, used), mkToken('estab', flagEstab, used), mkToken('fresh', flagFresh, used)]);
  M = { profile, cong, tokens, seed: Math.floor(Math.random()*1e9),
    fees: Array.from({ length: 150 }, () => cong.median*Math.exp(gauss()*0.8)),
    sol: Math.round(solPx()), cash: CAPITAL,
    set: { prio: Math.max(PRIO_MIN, +S.settings.prio || PRIO_MIN), slip: Math.min(100, Math.max(1, +S.settings.slip || 10)), presets: JSON.parse(JSON.stringify(S.settings.presets)), preset: S.settings.preset },

    frozen: false, lpGone: false, busy: false,

}
const mPrice = t => M.i < 0 ? t.price : t.fut[M.i].c;
const mLand = prio => Math.min(0.95, Math.max(0.01, M.fees.filter(f => prio >= f).length/M.fees.length));
const mFees = (t, prio) => ({ pct: t.pool + TTYPES[t.type].plat, net: (prio + SOL_BASE_FEE)*M.sol });
function mQuote(t, A, prio){
  const f = mFees(t, prio), dx = A*(1 - f.pct) - f.net;
  if (!(dx > 0)) return null;
  const imp = dx/(t.R + dx), qty = dx/mPrice(t)*(1 - imp);
  return { f, imp, qty, avg: A/qty, fee: A*f.pct + f.net };
}
function mSellOut(t, qty, price, prio){
  const V = qty*price; if (!(V > 0)) return 0;
  const f = mFees(t, prio), gross = t.R*V/(t.R + V);
  return Math.max(0, gross*(1 - f.pct) - f.net);
}

/* --- achat, vente, SL / TP --- */
async function mBuy(){
  if (M.busy) return toast('Transaction déjà en cours');
  if (M.pos) return toast('Une seule position par mission. Gère celle que tu as.');
  const my = M, t = M.tokens[M.open], idx = M.open, A = +$('#mamt').value;
  if (!(A > 0)) return toast('Montant invalide');
  if (A > M.cash + 1e-9) return toast('Solde insuffisant');
  const q0 = mQuote(t, A, M.set.prio);
  if (!q0) return toast('Montant trop faible pour couvrir les frais');
  const set = { ...M.set }, f = q0.f;
  M.busy = true; toast('Transaction envoyée, en attente de confirmation…');
  let slot = 0; const q = mLand(set.prio);
  while (++slot <= MAX_SLOTS && Math.random() >= q){}
  if (slot > MAX_SLOTS){
    await sleep(3000); if (M !== my) return;
    M.busy = false; M.expired++;
    return toast('Transaction expirée : priority fee trop basse. Aucun frais payé.');
  }
  const sec = slot*SLOT_MS/1000 + 0.3;
  await sleep(Math.min(4000, 200 + sec*1000)); if (M !== my) return;
  M.busy = false;
  // pendant la confirmation, d'autres acheteurs passent avant toi
  const sd = t.vol*Math.sqrt(sec/60), move = gauss()*sd + (t.type === 'fresh' ? Math.abs(gauss())*sd*0.6 : 0);
  const short = move > 0 ? move/(1 + move)*100 : 0;
  if (short > set.slip){
    M.cash -= f.net; M.fails++; M.failFees += f.net; mTick();
    return toast(`Échec : le prix a pris ${pct1(move*100)} pendant la confirmation, plus que ton slippage de ${nf2(set.slip, 1)} %. Frais réseau payés.`);
  }
  const pFill = t.price*(1 + move), dx = A*(1 - f.pct) - f.net, qty = dx/pFill*t.R/(t.R + dx);
  M.cash -= A;
  M.pos = { idx, qty, cost: A, entry: A/qty, fill: pFill, sl: null, tp: null, out: 0, closed: false, set, slot };
  const lv = presetLevels(M.set, A/qty, t.price);
  if (lv){ M.pos.sl = lv.sl; M.pos.tp = lv.tp; }
  toast('Acheté ' + fp(qty) + ' ' + t.name + (lv ? (lv.note || ' · SL / TP posés') : ''));
  if (M.view === 'tok') { const a = $('#mamt'); if (a) a.value = ''; }
  mTick(); mLines();
}
function mPosBox(){

function mSaveTrig(){
  const P = M.pos, t = M.tokens[P.idx], pr = mPrice(t);

  if (sl && sl >= pr){ toast('Le stop loss doit être sous le prix actuel (' + fp(pr) + ')'); return false; }
  if (tp && tp <= pr){ toast('Le take profit doit être au-dessus du prix actuel (' + fp(pr) + ')'); return false; }
  P.sl = sl; P.tp = tp; mLines();
  return true;

function mSnapshot(){
  const P = M.pos;
  return { sel: P.idx, A: P.cost, slip: P.set.slip, prio: P.set.prio,
    slRel: P.sl ? P.sl/P.fill : 0, tpRel: P.tp ? P.tp/P.fill : 0 };
}
function mClose(price, why){
  const P = M.pos, t = M.tokens[P.idx];
  const out = M.lpGone || !(price > 0) ? 0 : mSellOut(t, P.qty, price, P.set.prio);
  M.cash += out; P.out += out; P.qty = 0; P.closed = true; M.why = why; M.exitIdx = M.i;
}
function mSell(frac){
  const P = M.pos; if (!P || P.closed || M.phase === 'done') return;
  if (M.frozen) return toast('Vente impossible : le créateur a gelé les portefeuilles.');
  if (!M.plan) M.plan = mSnapshot();
  const t = M.tokens[P.idx];
  if (frac >= 1){
    if (M.lpGone) toast('La liquidité a été retirée : la vente ne rapporte rien.');
    mClose(mPrice(t), M.lpGone ? 'lp' : 'manual');
    if (M.phase === 'prep') return mFinish();
    return mTick();
  }
  const q = P.qty*frac, out = M.lpGone ? 0 : mSellOut(t, q, mPrice(t), P.set.prio);
  M.cash += out; P.out += out; P.qty -= q;
  toast(`Vendu ${Math.round(frac*100)} % : ${money(out)}`);
  mTick();
}
async function mRun(){
  if (M.phase !== 'prep' || !M.pos || M.pos.closed) return;
  const my = M, P = M.pos, t = M.tokens[P.idx];
  M.plan = mSnapshot(); M.phase = 'run';
  if (M.view === 'tok') $('#mposbox').dataset.k = '';
  mTick();
  let warned = false;
  for (let i = 0; i < CANDLES; i++){
    await sleep(i ? TICK_MS : 500);
    if (M !== my) return;
    if (P.closed) break;
    M.i = i;
    const c = t.fut[i];
    if (t.rug === i && t.rugKind === 'freeze') M.frozen = true;
    if (t.rug === i && t.rugKind === 'lp'){ M.lpGone = true; if (P.sl) mClose(0, 'lp'); }
    if (!P.closed){
      const hitSl = P.sl && c.l <= P.sl, hitTp = P.tp && c.h >= P.tp;
      if (M.frozen && (hitSl || hitTp) && !warned){ warned = true; toast(`Ton ${hitSl ? 'stop loss' : 'take profit'} s'est déclenché mais la vente a échoué : le token est gelé.`); }
      else if (!M.frozen && !M.lpGone){
        if (hitSl) mClose(Math.min(P.sl, c.o), 'stop');
        else if (hitTp) mClose(Math.max(P.tp, Math.min(c.o, c.h)), 'tp');
      }
    }
    if (msSeries && M.view === 'tok'){
      const o = M.tokens[M.open].fut[i];
      try { msSeries.update({ time: M.t0 + (CANDLES + i)*60, open: o.o, high: o.h, low: o.l, close: o.c }); } catch(e){}
    }
    mTick();
    if (P.closed) break;
  }
  if (M !== my) return;
  if (!P.closed) mClose(M.frozen || M.lpGone ? 0 : t.fut[M.i].c, M.frozen ? 'freeze' : M.lpGone ? 'lp' : 'end');
  mTick();
  await sleep(900); if (M !== my) return;
  mFinish();
}

/* --- notation par simulation ---
   Le plan (token, montant, stop, take profit, priority fee) est rejoué sur
   400 marchés simulés avec la volatilité du token et les mêmes règles que la
   mission : frais, impact, stop qui glisse sur un trou, rug possible si le
   token a une croix rouge. On cherche aussi le meilleur plan possible pour
   l'énoncé : celui qui atteint l'objectif le plus souvent sans dépasser la
   perte max dans plus de 5 % des cas. La note compare ton plan à celui-là :
   connaître des seuils par cœur ne suffit pas. */
const NSIM = 400, RISK_OK = 0.03;   // marge sous les 5 % tolérés : le plan conseillé reste bon une fois arrondi
const SLG = [0.99, 0.985, 0.98, 0.97, 0.96, 0.95, 0.94, 0.92, 0.9, 0.87, 0.84, 0.8, 0.75, 0.7, 0.6];
const TPG = [1.015, 1.02, 1.03, 1.04, 1.05, 1.06, 1.08, 1.1, 1.13, 1.16, 1.2, 1.25, 1.3, 1.4, 1.5, 1.7, 2];
const AG = [5, 10, 15, 20, 25, 30, 35, 40, 50, 60, 70, 80, 90, 100];
function seeded(a){ return () => { a = a + 0x6D2B79F5 | 0; let x = Math.imul(a ^ a >>> 15, 1 | a); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0)/4294967296; }; }
const isFlagged = t => !t.checks.mint || !t.checks.freeze || !t.checks.lp;
// 400 futurs possibles du token, prix de départ = 1 (prix d'exécution)
function simPaths(t, seed){
  const R = seeded(seed), g = () => { let u = 0, w = 0; while (!u) u = R(); while (!w) w = R(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*w); };
  const kind = !t.checks.mint ? 'mint' : !t.checks.freeze ? 'freeze' : !t.checks.lp ? 'lp' : null, out = [];
  for (let n = 0; n < NSIM; n++){
    const T = TTYPES[t.type], drift = (R() - 0.5)*T.vol*0.3 + (t.act ? t.act.driftAdj : 0), rug = kind && R() < 0.75 ? Math.floor(8 + R()*42) : -1;
    const dmp = T.dump && R() < Math.min(0.85, dumpP(T, t.top10)*(t.act ? t.act.dumpMul : 1)) ? Math.floor(3 + R()*54) : -1, dm = dmp >= 0 ? T.dumpF[0] + R()*(T.dumpF[1] - T.dumpF[0]) : 1;
    const o = new Float64Array(CANDLES), h = new Float64Array(CANDLES), l = new Float64Array(CANDLES), c = new Float64Array(CANDLES);
    let p = 1;
    for (let i = 0; i < CANDLES; i++){
      const op = p, fat = R() < 0.06 ? 3 : 1;
      p = Math.max(op*0.2, op*Math.exp(drift + t.vol*fat*g()));
      let hi = Math.max(op, p)*(1 + Math.abs(g())*t.vol*0.45), lo = Math.min(op, p)*(1 - Math.abs(g())*t.vol*0.45), oo = op, cc = p;
      if (dmp >= 0 && i >= dmp){ oo *= dm; hi *= dm; lo *= dm; cc *= dm; }
      if (rug >= 0 && kind !== 'freeze' && i >= rug){ const m = 0.07; oo *= m; hi *= m; lo *= m; cc *= m; }
      o[i] = oo; h[i] = hi; l[i] = lo; c[i] = cc;
    }
    out.push({ o, h, l, c, rug, kind: rug >= 0 ? kind : null });
  }
  return out;
}
// prix de sortie (relatif au prix d'exécution) d'un chemin pour un stop et un take profit donnés (0 = aucun)
function exitOf(P, sl, tp){
  const frz = P.kind === 'freeze' ? P.rug : 1e9, gone = P.kind === 'lp' ? P.rug : 1e9;
  for (let i = 0; i < CANDLES; i++){
    if (i >= gone) return { x: 0, w: 'lp' };
    if (i >= frz) continue;
    if (sl && P.l[i] <= sl) return { x: Math.min(sl, P.o[i]), w: 'sl' };
    if (tp && P.h[i] >= tp) return { x: Math.max(tp, Math.min(P.o[i], P.h[i])), w: 'tp' };
  }
  return { x: frz < 1e9 ? 0 : P.c[CANDLES - 1], w: 'end' };
}
// résultat d'un montant donné sur une liste de sorties
function scoreExits(t, exits, A, prio){
  const P = M.profile, f = mFees(t, prio), dx = A*(1 - f.pct) - f.net;
  if (!(dx > 0)) return null;
  const q = dx*(1 - dx/(t.R + dx));          // valeur des tokens reçus, au prix d'exécution
  let goal = 0, over = 0, sum = 0;
  for (const e of exits){
    const V = q*e.x, out = V > 0 ? Math.max(0, t.R*V/(t.R + V)*(1 - f.pct) - f.net) : 0, pnl = out - A;
    if (pnl >= P.goal) goal++;
    if (-pnl > P.maxLoss) over++;
    sum += pnl;
  }
  const n = exits.length;
  return { goal: goal/n, over: over/n, mean: sum/n, entryRel: A/q };

// meilleur plan possible sur un token (recherche sur une grille de montants, stops et take profits)

    <div class="ideal"><b>Le meilleur plan possible</b><span>${g.ideal}</span></div>
    <div class="briefbtns"><button class="btn btn-ghost" id="mhome">Retour</button><button class="btn btn-buy" id="magain">Nouvelle mission</button></div></div>`;
  $('#mhome').onclick = () => closeMission(true);
  $('#magain').onclick = () => closeMission(false);
  $('#mhead').hidden = false; mTick();
  mChart('#mrchart', true);
}

/* ---------- Live Trading ----------
   Une session de 3 heures de marché en accéléré (1 minute = 2,5 s), avec un
   flux de tokens, plusieurs positions, préréglages SL / TP, ralenti
   automatique quand on tape, et quelques pauses.
   Modèle des tokens : les indicateurs VISIBLES (volume organique, achats /
   ventes sur 5 min, évolution des détenteurs, créateur qui vend, sécurité)
   orientent la suite ; s'y ajoutent une part cachée propre au token et du
   hasard. Les chutes (gros vendeur, créateur, rug) suivent des probabilités
   qui dépendent elles aussi de ce qui est visible.
   Notation : chaque décision est rejugée depuis l'instant où elle a été prise,
   avec uniquement l'information visible à ce moment-là : on simule des
   centaines de suites possibles avec le même modèle, et on compare ton choix
   aux autres choix possibles au même instant. La suite réelle n'est jamais
   utilisée pour noter : la chance est montrée à part. */
const LV = { len: 180, secPerMin: 2.5, slowSecPerMin: 10, sub: 10, pauses: 3, pauseSec: 20, H: 60, N: 220, lambda: 4 };
let L = null, lvTimer = null, lvChart = null, lvSeries = null;
const LV_SYL1 = ['ZO', 'PI', 'MO', 'KA', 'BU', 'FLO', 'GRU', 'SNO', 'WI', 'PE', 'DO', 'TA', 'LU', 'BRO', 'CHI', 'NE', 'FU', 'BA', 'RI', 'QUA', 'JI', 'TOO', 'MEE', 'YA'];
const LV_SYL2 = ['RP', 'NK', 'MBO', 'TO', 'ZZ', 'PPY', 'RK', 'BI', 'GO', 'NUT', 'LLY', 'SH', 'MP', 'X', 'DOG', 'CAT', 'PUG', 'FROG', 'BEAR', 'BULL', 'MOON', 'PEPE'];
const lvP = x => nf2(x, Math.round(x*100) % 100 === 0 ? 0 : Math.round(x*100) % 10 === 0 ? 1 : 2);
const lvClamp = (x, a, b) => Math.max(a, Math.min(b, x));
// pour être noté : quelques achats ET une vraie présence sur le marché (part moyenne du capital investie sur toute la session)
const LV_MIN = { trades: 2, expo: 0.08 };

/* --- le modèle commun au marché et à la notation --- */
// tendance par minute, à partir des seuls indicateurs visibles
// tendance par minute, décomposée par indicateur (sert aussi à expliquer la correction)
const LVW = { org: 0.08, mom: 0.07, momMajor: 0.02, hold: 0.09, dev: 0.15 };
function lvDriftParts(s){
  return { org: s.organic < 40 ? (s.organic - 40)/40*LVW.org*s.vol : 0,        // volume peu organique : les bots finissent par partir
    mom: (s.sh5 - 0.5)*2*(s.type === 'major' ? LVW.momMajor : LVW.mom)*s.vol,   // plus d'achats que de ventes : élan
    hold: lvClamp(s.hg*15, -1, 1)*(s.type === 'major' ? 0.02 : LVW.hold)*s.vol,                                // détenteurs qui arrivent ou partent
    dev: s.devSelling ? -LVW.dev*s.vol : 0 };                                    // créateur qui vend
}
function lvDriftBase(s){ const p = lvDriftParts(s); return p.org + p.mom + p.hold + p.dev; }
// probabilité par minute d'une chute brutale (gros vendeur, créateur) et d'un rug, vue depuis les indicateurs visibles
function lvHazards(s){
  const T = TTYPES[s.type];
  const whale = (T.dump || 0)/60*(s.top10 >= 45 ? 2.5 : 1)*(s.dev >= 10 ? 1.5 : 1);
  const dev = s.devDumped ? 0 : s.devSelling ? 0.25 : s.dev >= 4 ? (s.dev >= 10 ? 0.35 : 0.2)/110 : 0;
  const rug = s.flagged && !s.rugDone && s.age < 90 ? 0.7/85 : 0;
  return { whale, dev, rug };
}
const lvShare = x => lvClamp(0.5 + x*3, 0.15, 0.85);

/* --- création d'un token --- */
function lvNewToken(type, g, rnd01 = Math.random){
  const T = TTYPES[type];
  let name; do { name = pickOne(LV_SYL1) + pickOne(LV_SYL2); } while (L.names.has(name)); L.names.add(name);
  const flagged = type === 'fresh' ? Math.random() < 0.3 : type === 'estab' ? Math.random() < 0.1 : false;
  const onCurve = T.dex === 'pumpfun' && !flagged, sol = solPx();
  const R = rnd(T.liq[0], T.liq[1]);
  let mc, price;
  if (type === 'major'){ mc = R*rnd(25, 60); price = Math.exp(rnd(Math.log(T.price[0]), Math.log(T.price[1]))); }
  else { mc = onCurve ? (R/sol)**2/32.19*sol : 2*R/(type === 'estab' ? rnd(0.03, 0.15) : rnd(0.08, 0.3)); price = mc/1e9; }
  const checks = { mint: true, freeze: true, lp: true };
  let rugKind = null;
  if (flagged){ rugKind = pickOne(onCurve ? ['mint', 'freeze'] : ['mint', 'freeze', 'lp']); checks[rugKind] = false; }
  const vol = T.vol*rnd(0.8, 1.3), q = gauss();
  const dev = type === 'major' ? +rnd(0, 1.5).toFixed(1) : type === 'estab' ? +rnd(0, 6).toFixed(1) : Math.random() < 0.5 ? +rnd(0, 3).toFixed(1) : +rnd(3, 25).toFixed(1);
  const tk = { id: L.tokens.length, name, full: name.charAt(0) + name.slice(1).toLowerCase(), type, label: T.label, hue: Math.floor(rnd(0, 360)),
    addr: Array.from({ length: 44 }, () => B58[Math.floor(Math.random()*58)]).join(''),
    dex: onCurve ? 'pumpfun' : T.dex === 'pumpfun' ? 'raydium' : T.dex, pool: onCurve ? 0.0125 : T.dex === 'pumpfun' ? 0.0025 : T.pool,
    R, vol, slip: T.slip, flagged, checks, lpPct: checks.lp ? 100 : Math.floor(rnd(0, 30)),
    top10: type === 'major' ? Math.round(rnd(8, 18)) : Math.round(rnd(type === 'fresh' ? 22 : 14, type === 'fresh' ? 55 : 35)),
    appear: g, ageMs0: type === 'fresh' ? rnd(1, 6)*60e3 : rnd(T.age[0], T.age[1]),
    q, eps: q*0.04*vol, organic: Math.round(type === 'major' ? rnd(75, 98) : type === 'estab' ? rnd(35, 90) : rnd(5, 85)),
    dev0: dev, dev, holders: Math.round(type === 'major' ? rnd(8e4, 6e5) : type === 'estab' ? rnd(2e3, 4e4) : rnd(20, 300)), hHist: [],
    price, p0: price, candles: [], cur: null, sh5: 0.5, sh60: 0.5, b5: 0, s5: 0, b60: 0, s60: 0, mc0: mc, liqShown: onCurve ? 2*Math.max(0, R - 30*sol) : 2*R,
    devSellAt: null, devDumpAt: null, devDumped: false, rugAt: null, rugDone: false, frozen: false, lpGone: false };
  // évènements cachés : créateur qui vend (visible quelques minutes avant la chute), rug si croix rouge
  const pDev = dev >= 10 ? 0.35 : dev >= 4 ? 0.2 : 0;
  if (pDev && Math.random() < pDev){ tk.devDumpAt = g + rnd(10, 120); tk.devSellAt = tk.devDumpAt - rnd(4, 8); }
  if (flagged && Math.random() < 0.7) tk.rugAt = g + rnd(5, 90);
  // historique : 60 minutes pour un token déjà établi, quelques minutes pour un nouveau
  const back = type === 'fresh' ? Math.max(3, Math.round(tk.ageMs0/60e3)) : 60, h0 = gbm(back, 1, vol, (Math.random() - 0.5)*T.vol*0.3), k = price/h0[h0.length - 1].c;
  tk.candles = h0.map((c, i) => ({ t: g - back + i, o: c.o*k, h: c.h*k, l: c.l*k, c: c.c*k }));
  for (let i = 0; i < back; i++) tk.hHist.push(tk.holders);
  lvSignals(tk);
  tk.cur = { t: Math.floor(g), o: price, h: price, l: price, c: price };
  return tk;
}
// indicateurs visibles, recalculés chaque minute à partir de ce qui s'est passé
function lvSignals(tk){
  const cs = tk.candles, n = cs.length, last = cs[n - 1].c;
  const r5 = last/cs[Math.max(0, n - 5)].o - 1, r60 = last/cs[Math.max(0, n - 60)].o - 1;
  tk.sh5 = lvShare(r5/(tk.vol*Math.sqrt(5))*0.08); tk.sh60 = lvShare(r60/(tk.vol*Math.sqrt(60))*0.08);
  const base = tk.type === 'major' ? 600 : tk.type === 'estab' ? 120 : 40 + Math.min(200, tk.holders/4);
  const n5 = Math.round(base*rnd(0.7, 1.3)), n60 = Math.round(n5*rnd(8, 14));
  tk.b5 = Math.round(n5*tk.sh5); tk.s5 = n5 - tk.b5; tk.b60 = Math.round(n60*tk.sh60); tk.s60 = n60 - tk.b60;
}
function lvVisible(tk, g){
  const hh = tk.hHist, h15 = hh[Math.max(0, hh.length - 15)] || tk.holders;
  return { type: tk.type, vol: tk.vol, organic: tk.organic, sh5: tk.sh5, hg: tk.holders/h15 - 1, devSelling: tk.devSellAt != null && g >= tk.devSellAt && !tk.devDumped,
    dev: tk.dev, devDumped: tk.devDumped, top10: tk.top10, flagged: tk.flagged, rugDone: tk.rugDone, age: g - tk.appear, kind: tk.flagged ? (!tk.checks.mint ? 'mint' : !tk.checks.freeze ? 'freeze' : 'lp') : null };
}

/* --- le moteur de la session --- */
function lvNewSession(){
  // mêmes règles pour toutes les sessions : les bilans sont comparables d'une session à l'autre
  // l'objectif varie un peu, la limite de perte suit toujours le même rapport (1,25 fois l'objectif) : difficulté équivalente
  const target = pickOne([6, 7, 8, 9, 10]), maxDD = target*1.25, maxTrades = 6;
  L = { g: 0, last: 0, phase: 'brief', target, maxDD, maxTrades, cash: CAPITAL, minEq: CAPITAL, trades: 0, tokens: [], names: new Set(), pos: {}, log: [], decisions: [],
    pausesLeft: LV.pauses, pausedUntil: 0, slow: false, fast: false, view: 'list', open: -1, busy: new Set(), sol: Math.round(solPx()),
    cong: pickOne(CONG), spikeAt: rnd(40, 140), spikeLen: rnd(8, 15), fees: null, nextArr: rnd(4, 9), lastSeen: {},
    set: { prio: Math.max(PRIO_MIN, +S.settings.prio || PRIO_MIN), slip: Math.min(100, Math.max(1, +S.settings.slip || 10)), presets: JSON.parse(JSON.stringify(S.settings.presets)), preset: S.settings.preset } };
  L.feesBase = Array.from({ length: 150 }, () => L.cong.median*Math.exp(gauss()*0.8));
  L.tokens.push(lvNewToken('major', 0)); L.tokens.push(lvNewToken('estab', 0)); L.tokens.push(lvNewToken('estab', 0)); L.tokens.push(lvNewToken('fresh', 0));
  shuffle(L.tokens).forEach((t, i) => t.id = i);
}
// pas de temps : un dixième de minute en accéléré, une seconde en temps réel
const lvSub = () => L.fast || L.ff ? LV.sub : 60;
const lvSpike = () => L.g >= L.spikeAt && L.g < L.spikeAt + L.spikeLen;
const lvFees = () => lvSpike() ? L.feesBase.map(f => f*6) : L.feesBase;
const lvLand = prio => { const fs = lvFees(); return Math.min(0.95, Math.max(0.01, fs.filter(f => prio >= f).length/fs.length)); };
const lvFeeOf = (t, prio) => ({ pct: t.pool + TTYPES[t.type].plat, net: (prio + SOL_BASE_FEE)*L.sol });
const lvPosValue = (p, t) => t.lpGone || t.frozen ? 0 : p.qty*t.price;
function lvSellOut(t, qty, price, prio){
  if (t.lpGone) return 0;
  const V = qty*price; if (!(V > 0)) return 0;
  const f = lvFeeOf(t, prio), gross = t.R*V/(t.R + V);
  return Math.max(0, gross*(1 - f.pct) - f.net);
}
function lvEquity(){ let e = L.cash; for (const k in L.pos) e += lvPosValue(L.pos[k], L.tokens[k]); return e; }
// avance le temps d'une petite étape (un dixième de minute)
function lvStep(){
  const dt = 1/lvSub(), g0 = L.g, g1 = L.g + dt;
  for (const t of L.tokens){
    if (t.appear > g0) continue;
    // évènements cachés
    if (t.rugAt != null && !t.rugDone && g1 >= t.rugAt){
      t.rugDone = true;
      if (t.checks.freeze === false) t.frozen = true;
      else { t.price *= 0.07; if (t.checks.lp === false) t.lpGone = true; }
    }
    if (t.devDumpAt != null && !t.devDumped && g1 >= t.devDumpAt){
      t.devDumped = true; t.price *= rnd(TTYPES[t.type].dumpF ? TTYPES[t.type].dumpF[0] : 0.5, TTYPES[t.type].dumpF ? TTYPES[t.type].dumpF[1] : 0.8); t.dev = +(t.dev*0.1).toFixed(1);
    }
    const hz = lvHazards(lvVisible(t, g0));
    if (Math.random() < hz.whale*dt && TTYPES[t.type].dumpF) t.price *= rnd(TTYPES[t.type].dumpF[0], TTYPES[t.type].dumpF[1]);
    // créateur qui vend : sa part baisse, visible
    if (t.devSellAt != null && g1 >= t.devSellAt && !t.devDumped) t.dev = Math.max(0.1, +(t.dev - t.dev0*0.5*dt/Math.max(1, t.devDumpAt - t.devSellAt)).toFixed(2));
    const drift = lvDriftBase(lvVisible(t, g0)) + t.eps, fat = Math.random() < 0.06 ? 3 : 1;
    t.price = Math.max(t.price*0.2, t.price*Math.exp(drift*dt + t.vol*fat*Math.sqrt(dt)*gauss()));
    const c = t.cur; c.h = Math.max(c.h, t.price); c.l = Math.min(c.l, t.price); c.c = t.price;
    lvTriggers(t);
  }
  L.g = g1;
  // nouvelle minute
  if (Math.floor(g1 + 1e-9) > Math.floor(g0 + 1e-9)){
    const m = Math.floor(g1 + 1e-9);
    for (const t of L.tokens){
      if (t.appear > g0) continue;
      t.candles.push(t.cur); if (t.candles.length > 400) t.candles.shift();
      const r1 = t.cur.c/t.cur.o - 1;
      t.holders = Math.max(5, Math.round(t.holders*(1 + lvClamp((t.type === 'major' ? 0.0003 : t.type === 'estab' ? 0.002 : 0.004)*t.q + (t.type === 'major' ? 0.05 : 0.6)*r1 + 0.002*gauss(), -0.02, 0.04))));
      t.hHist.push(t.holders); if (t.hHist.length > 120) t.hHist.shift();
      lvSignals(t);
      t.cur = { t: m, o: t.price, h: t.price, l: t.price, c: t.price };
      if (t.devSellAt != null && Math.abs(m - Math.ceil(t.devSellAt)) < 1e-9) lvKeyMoment(t);
    }
    // point de contrôle toutes les 10 minutes : les tokens dont la tendance visible dépasse les frais sont de vraies occasions possibles
    if (m % 10 === 0) for (const tk of L.tokens){
      if (tk.appear > m - 1 || L.pos[tk.id] || tk.flagged) continue;
      const s = lvVisible(tk, m), tr = lvDriftBase(s)*60, fees = 2*(tk.pool + TTYPES[tk.type].plat);
      if (tr > fees) lvLogDecision({ kind: 'check', tok: tk.id, g: m, snap: lvSnap(tk), tr: tr - fees });
    }
    // arrivée de nouveaux tokens
    if (m >= L.nextArr && m < LV.len - 20){
      L.tokens.push(lvNewToken(Math.random() < 0.85 ? 'fresh' : 'estab', m));
      L.nextArr = m + rnd(5, 12);
      const nt = L.tokens[L.tokens.length - 1];
      lvLogDecision({ kind: 'appear', tok: nt.id, g: m, snap: lvSnap(nt) });
    }
    if (Math.abs(m - Math.ceil(L.spikeAt)) < 1e-9 && !L.ff) toast('Le réseau Solana sature : les transactions passent mal');
    // décisions « garder » non suivies d'effet après un signal de vente du créateur
    for (const d of L.decisions) if (d.kind === 'devsignal' && !d.done && m >= d.g + 3){ d.done = true; d.chosen = L.pos[d.tok] ? 'hold' : 'sold'; }
  }
  const eq = lvEquity(); L.minEq = Math.min(L.minEq, eq);
  // exposition : part du capital réellement investie, cumulée dans le temps (des mini-trades éclair n'y pèsent presque rien)
  L.expo = (L.expo || 0) + Math.max(0, eq - L.cash)/CAPITAL*dt;
}
function lvTriggers(t){
  const p = L.pos[t.id]; if (!p || t.frozen) { if (p && t.frozen && (p.sl && t.price <= p.sl || p.tp && t.price >= p.tp) && !p.warned){ p.warned = true; toast(`${t.name} : vente impossible, le token est gelé.`); } return; }
  if (p.sl && t.price <= p.sl) lvClose(t, 1, 'Stop loss');
  else if (p.tp && t.price >= p.tp) lvClose(t, 1, 'Take profit');
}

/* --- ordres --- */
async function lvBuy(){
  const t = L.tokens[L.open], A = +$('#lamt').value, my = L;
  if (L.phase !== 'run') return;
  if (L.busy.has(t.id)) return toast('Transaction déjà en cours sur ce token');
  if (!(A > 0)) return toast('Montant invalide');
  if (A > L.cash + 1e-9) return toast('Solde insuffisant');
  if (L.trades >= L.maxTrades) return toast(`Limite de ${L.maxTrades} achats atteinte pour cette session`);
  const set = { ...L.set }, f = lvFeeOf(t, set.prio), dx = A*(1 - f.pct) - f.net;
  if (!(dx > 0)) return toast('Montant trop faible pour couvrir les frais');
  const snap = lvSnap(t);
  L.busy.add(t.id); toast('Transaction envoyée…');
  const q = lvLand(set.prio); let slot = 0; while (++slot <= 150 && Math.random() >= q){}
  if (slot > 150){
    await lvWaitGame(1); if (L !== my) return; L.busy.delete(t.id);
    lvLogDecision({ kind: 'exec', g: snap.g, tok: t.id, what: 'expired', prio: set.prio, med: median(lvFees()) });
    return toast('Transaction expirée : priority fee trop basse. Aucun frais payé.');
  }
  const sec = slot*0.4 + 0.3;
  await sleep(Math.min(1200, 150 + sec*60)); if (L !== my) return; L.busy.delete(t.id);
  const sd = t.vol*Math.sqrt(sec/60), move = gauss()*sd + (t.type === 'fresh' ? Math.abs(gauss())*sd*0.6 : 0), short = move > 0 ? move/(1 + move)*100 : 0;
  if (short > set.slip){
    L.cash -= f.net; L.log.push({ g: L.g, tok: t.id, side: 'Échec achat', usd: 0, fee: f.net });
    lvLogDecision({ kind: 'exec', g: snap.g, tok: t.id, what: 'slip', slip: set.slip, range: t.slip });
    return toast(`Échec : le prix a pris ${pct1(move*100)} pendant la confirmation, plus que ton slippage. Frais réseau payés.`);
  }
  if (L.trades >= L.maxTrades || A > L.cash + 1e-9) return toast('Achat annulé');
  const fill = t.price*(1 + move), qty = dx/fill*t.R/(t.R + dx);
  L.cash -= A; L.trades++;
  const old = L.pos[t.id], p = old || (L.pos[t.id] = { qty: 0, cost: 0, sl: null, tp: null, entryG: L.g });
  p.qty += qty; p.cost += A;
  const lv = presetLevels(set, p.cost/p.qty, t.price);
  if (lv){ p.sl = lv.sl; p.tp = lv.tp; }
  L.log.push({ g: L.g, tok: t.id, side: 'Achat', usd: A, fee: A*f.pct + f.net, price: A/qty });
  const d = lvLogDecision({ kind: 'buy', tok: t.id, g: snap.g, snap, A, set, fill, entryRel: A/(dx*(1 - dx/(t.R + dx))) });
  d.pending = true; d.finalAt = L.g + 1;     // le plan est figé une minute après l'achat (le temps de poser stop et objectif)
  toast('Acheté ' + fp(qty) + ' ' + t.name + (lv ? ' · SL / TP posés' : ''));
  lvTick();
}
function lvClose(t, frac, reason, manual){
  const p = L.pos[t.id]; if (!p) return;
  if (t.frozen){ if (manual) toast('Vente impossible : le créateur a gelé les portefeuilles.'); return; }
  const snap = manual ? lvSnap(t) : null, qty = frac >= 1 ? p.qty : p.qty*frac;
  const out = lvSellOut(t, qty, t.price, L.set.prio), costPart = p.cost*(qty/p.qty);
  L.cash += out; L.log.push({ g: L.g, tok: t.id, side: reason, usd: out, pnl: out - costPart });
  if (manual) lvLogDecision({ kind: 'sell', tok: t.id, g: snap.g, snap, frac });
  if (frac >= 1 || p.qty - qty < 1e-12) delete L.pos[t.id]; else { p.qty -= qty; p.cost -= costPart; }
  toast(`${reason} ${t.name} : ${money(out)} (${out - costPart >= 0 ? '+' : ''}${money(out - costPart)})`);
  lvTick();
}
function lvSaveTrig(t){
  const p = L.pos[t.id]; if (!p) return;
  const sl = +$('#lsl').value || null, tp = +$('#ltp').value || null;
  if (sl && sl >= t.price) return toast('Le stop loss doit être sous le prix actuel');
  if (tp && tp <= t.price) return toast('Le take profit doit être au-dessus du prix actuel');
  const snap = lvSnap(t), old = { sl: p.sl, tp: p.tp };
  p.sl = sl; p.tp = tp;
  const buy = L.decisions.find(d => d.kind === 'buy' && d.tok === t.id && d.pending);

        stats: kind === 'sell' && regret >= 0.15 ? `En gardant, tu espérais ${best.u >= 0 ? '+' : ''}${money(best.u)} de plus que la vente.` : '' });
    } else if (d.kind === 'exec'){
      cat.exec += d.what === 'expired' ? 0.4 : 0.5;
      moments.push({ g: d.g, tok: t.name, who, regret: 0.5, kind: d.what === 'expired' ? 'prio' : 'slip', did: d.what === 'expired' ? 'Transaction expirée' : 'Achat échoué sur le slippage',
        best: d.what === 'expired' ? `une priority fee au-dessus de la médiane (${fp(d.med)} SOL)` : `un slippage de ${d.range[0]} à ${d.range[1]} %`, ex: { txt: '' }, stats: '' });
    }
  }
  // occasions manquées : la meilleure par token, et seulement autant que d'achats que tu n'as pas utilisés
  const perTok = new Map(); for (const m of missed) if (!perTok.has(m.tokId) || perTok.get(m.tokId).regret < m.regret) perTok.set(m.tokId, m);
  const keep = [...perTok.values()].sort((a, b) => b.regret - a.regret).slice(0, Math.max(0, L.maxTrades - L.trades));
  // une occasion manquée coûte au plus 4 $ : passer son tour reste une erreur prudente, moins grave qu'un mauvais achat
  for (const m of keep){ m.regret = Math.min(4, m.regret); cat.tri += m.regret; moments.push(m); }
  const total = cat.tri + cat.taille + cat.gestion + cat.exec;
  const ddBreach = (CAPITAL - L.minEq) > CAPITAL*L.maxDD/100;
  const pnl = L.cash - CAPITAL, goalOk = pnl >= CAPITAL*L.target/100;

  const over = Math.max(0, (CAPITAL - L.minEq)/CAPITAL*100 - L.maxDD), score = lvClamp(Math.round(100*Math.exp(-total/20) - Math.min(15, 3*Math.ceil(over))), 0, 100);
  const bad = moments.filter(m => !m.good && m.regret >= 0.15).sort((a, b) => b.regret - a.regret).slice(0, 6), good = moments.filter(m => m.good).slice(0, 2);
  const expoAvg = (L.expo || 0)/LV.len;
  return { noGrade: L.trades < LV_MIN.trades || expoAvg < LV_MIN.expo, expoAvg, score, total, cat, moments: [...bad, ...good].sort((a, b) => a.g - b.g), expected, pnl, goalOk, ddBreach, lessons: lvLessons(moments.filter(m => !m.good && m.regret >= 0.15), ddBreach) };
}
// Leçons précises, tirées de TES erreurs : quels indices tu as ignorés, sur quels tokens, avec les chiffres
function lvLessons(bad, ddBreach){
  const groups = {}, add = (k, m, extra) => { (groups[k] || (groups[k] = { cost: 0, items: [] })); groups[k].cost += m.regret; groups[k].items.push({ m, extra }); };
  for (const m of bad){
    const s = m.snap, v = s && s.vis;
    if (m.kind === 'badbuy' || m.kind === 'plan' || m.kind === 'size'){
      if (v.flagged) add('flag', m);
      else {
        const neg = m.ex.parts.filter(p => p[2] < 0).sort((a, b) => a[2] - b[2]);
        if (neg.length) add(neg[0][0], m, neg[0]);
        if (m.ex.ev.some(e => e[0] === 'dev')) add('dev', m);
        if (m.ex.net > 1.5) add('fees', m);
      }
      if (m.kind === 'size') add('size', m);
    } else if (m.kind === 'missed') add('opp', m);
    else if (m.kind === 'devlate') add('devlate', m);
    else if (m.kind === 'sell') add('early', m);
    else if (m.kind === 'slip' || m.kind === 'prio') add(m.kind, m);
  }
  const names = (g, f) => [...new Map(g.items.map(x => [x.m.tok, f(x)])).values()].slice(0, 3).join(', ');
  const avg = (g, f) => g.items.reduce((a, x) => a + f(x), 0)/g.items.length;
  const T = {
    flag: g => `Croix rouge ignorée : ${names(g, x => x.m.tok)}. Mint actif, gel actif ou LP non brûlée : le créateur peut tout reprendre (rug probable à ${pcTxt(avg(g, x => { const e = x.m.ex.ev.find(e => e[0] === 'flag'); return e ? e[2] : 0; }))} dans l'heure ici). Un stop ne protège pas d'un rug : le prix saute directement en dessous. Règle : une croix rouge, on ne touche pas.`,
    org: g => `Volume organique faible : ${names(g, x => `${x.m.tok} (${x.m.snap.vis.organic} / 100)`)}. Sous 40, une bonne partie des échanges vient de bots ; quand ils s'arrêtent, le prix glisse (${pct1(avg(g, x => x.extra[2]))}/h en moyenne sur tes achats). Règle : sous 40, on passe.`,
    'mom-': g => `Vendeurs majoritaires : ${names(g, x => `${x.m.tok} (${x.m.snap.s5} ventes / ${x.m.snap.b5} achats)`)}. Quand les ventes dépassent nettement les achats sur 5 minutes, la pente est à la baisse (${pct1(avg(g, x => x.extra[2]))}/h ici). Attends que les achats reprennent le dessus avant d'entrer.`,
    'hold-': g => `Détenteurs en baisse : ${names(g, x => `${x.m.tok} (${pct1(x.m.snap.vis.hg*100)} en 15 min)`)}. Des portefeuilles qui sortent annoncent la suite (${pct1(avg(g, x => x.extra[2]))}/h ici). Achète plutôt un token dont le nombre de détenteurs monte.`,
    devsell: g => `Créateur en train de vendre : ${names(g, x => `${x.m.tok} (part ${nf2(x.m.snap.vis.dev, 1)} %)`)}. Une part du créateur qui baisse, c'est lui qui vend : la grosse vente arrive en général dans les minutes qui suivent.`,
    dev: g => `Part du créateur élevée : ${names(g, x => `${x.m.tok} (${nf2(x.m.snap.vis.dev, 1)} %)`)}. Au-delà de 4 %, et surtout de 10 %, une vente massive du créateur devient probable. Si tu entres quand même, surveille sa part : si elle baisse, sors.`,
    fees: g => `Priority fee trop lourde pour la mise : ${names(g, x => `${x.m.tok} (${money(x.m.A)}, dont ${pct1(x.m.ex.net)} de frais réseau aller-retour)`)}. La priority fee est fixe : sur un petit achat, elle mange une grosse part du gain possible. Achète plus gros, ou baisse la fee quand le réseau est calme.`,
    size: g => `Mise trop grosse pour ta marge : ${names(g, x => `${x.m.tok} (${money(x.m.A)} avec ${money(x.m.snap.budget)} de marge restante)`)}. Une chute brutale de 40 à 75 % aurait suffi à franchir ton plancher. Dimensionne chaque achat pour qu'une chute ne dépasse pas ta marge.`,
    opp: g => `Occasions manquées : ${names(g, x => `${x.m.tok} minute ${Math.floor(x.m.g)} (${x.m.ex.parts.filter(p => p[2] > 0).map(p => p[1].split(' : ')[0]).join(', ') || 'signaux positifs'})`)}. Quand les détenteurs arrivent et que les achats dominent, sans croix rouge ni gros créateur, la tendance attendue est positive (${pct1(avg(g, x => x.m.ex.trend))}/h ici) : c'est là qu'il faut entrer.`,
    devlate: g => `Sortie trop tardive : ${names(g, x => `${x.m.tok} minute ${Math.floor(x.m.g)}`)}. La part du créateur s'est mise à baisser pendant que tu étais en position : c'était le moment de tout vendre, avant la chute.`,
    early: g => `Ventes trop tôt : ${names(g, x => `${x.m.tok} minute ${Math.floor(x.m.g)}`)}. Les signaux restaient bons au moment de vendre : laisse ton stop et ton objectif travailler plutôt que de couper sur une simple baisse.`,
    slip: g => `Slippage mal réglé (${names(g, x => x.m.tok)}) : 1 à 3 % pour un gros token, 3 à 8 % pour un memecoin établi, 8 à 20 % pour un memecoin récent.`,
    prio: g => `Priority fee mal réglée (${names(g, x => x.m.tok)}) : regarde la médiane dans Portefeuille avant d'acheter, surtout quand le réseau sature, et reste entre 1 et 5 fois cette médiane.`
  };
  const out = Object.entries(groups).sort((a, b) => b[1].cost - a[1].cost).slice(0, 3).map(([k, g]) => T[k](g));
  if (ddBreach) out.push(`Tu es descendu de plus de ${lvP(L.maxDD)} % sous ton capital pendant la session : c'était la limite à ne jamais franchir.`);
  return out;
}

// Amplitude de la dernière heure (plus haut / plus bas), lue sur les données du graphique. Comme dans les cas pratiques.
function ampReal(key){
  const {kind,id} = parse(key), c = kind === 'sol' ? CD[id] : CH[key];
  const arr = c ? (c.bars || c.pts) : null; if (!arr || arr.length < 2) return null;
  const end = arr[arr.length - 1].time, from = end - 3600;
  if (arr[0].time > from + 600) return null;          // moins de 50 minutes de données : on ne sait pas
  let hi = 0, lo = Infinity;
  for (const b of arr){ if (b.time < from) continue; hi = Math.max(hi, b.high ?? b.value); lo = Math.min(lo, b.low ?? b.value); }
  return lo > 0 && hi > 0 ? (hi/lo - 1)*100 : null;
}

        const g = Math.round((Date.now()-sn.got)/1000), mv = Math.round((Date.now()-sn.moved)/1000);
        $('#fresh').innerHTML = (pfPrice(id) ? '<span class="up">Live à chaque trade</span> · ' : `Mis à jour il y a ${g} s · `)
          + `dernier trade il y a <span class="${mv > 30 ? 'down' : ''}">${mv} s</span>`;
      }
      $('#stats').innerHTML = `
        <div class="kv"><span>5 min / 24h</span><span><span class="${cls(pc.m5 || 0)}">${pct(pc.m5)}</span> · <span class="${cls(pc.h24 || 0)}">${pct(pc.h24)}</span></span></div>
        ${ampRow(sheetKey)}
        <div class="kv"><span>Liquidité</span><span>${liq(p) > 0 ? big(liq(p)) : (p.dexId === 'pumpfun' ? 'Bonding curve' : 'Inconnue')}</span></div>
        <div class="kv"><span>Market cap</span><span>${pfPrice(id) ? big(pfPrice(id)*1e9) : big(p.marketCap || p.fdv)}</span></div>
        <div class="kv"><span>Volume 24h</span><span>${big(p.volume && p.volume.h24)}</span></div>
        <div class="kv"><span>DEX</span><span>${esc(p.dexId)} · ${age(p.pairCreatedAt)}</span></div>`;
    }
  }
  buildPos();
  const pos = S.pos[sheetKey], pi = $('#pinfo');
  if (pos && pi){
    const mv = marketValue(pos, sheetKey), sv = sellValue(pos, sheetKey);
    const res = v => v == null ? '<span class="mut">-</span>' : `<span class="${cls(v - pos.cost)}">${v - pos.cost >= 0 ? '+' : ''}${money(v - pos.cost)} (${pct((v - pos.cost)/pos.cost*100)})</span>`;
    pi.innerHTML = `<div class="kv"><span>Quantité</span><span>${fp(pos.qty)}</span></div>
      <div class="kv"><span>Coût total (frais d'achat inclus)</span><span>${money(pos.cost)}</span></div>
      <div class="kv"><span>Valeur au prix actuel</span><span>${money(mv)}</span></div>
      <div class="kv"><span>Résultat</span>${res(mv)}</div>
      <div class="kv"><span>Si je vends tout maintenant</span><span>${money(sv)}</span></div>
      <div class="kv"><span>Résultat après revente</span>${res(sv)}</div>`;
  }
  if (document.activeElement !== $('#amt')) updQuote();
}
function refresh(){ renderHeader(); if (sheetKey) refreshSheet(); else renderList(); }

/* ---------- plein écran ---------- */
(function(){
  const b = $('#fsbtn'), d = document, el = d.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen, exit = d.exitFullscreen || d.webkitExitFullscreen;
  if (!req || !exit) return;               // non disponible (iPhone notamment) : pas de bouton
  const IN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  const OUT = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
  const isFs = () => !!(d.fullscreenElement || d.webkitFullscreenElement);
  const draw = () => { b.innerHTML = isFs() ? OUT : IN; b.setAttribute('aria-label', isFs() ? 'Quitter le plein écran' : 'Plein écran'); b.title = b.getAttribute('aria-label'); };
  b.hidden = false; draw();
  b.onclick = () => { try { const r = isFs() ? exit.call(d) : req.call(el); if (r && r.catch) r.catch(() => {}); } catch(e){} };
  d.addEventListener('fullscreenchange', draw); d.addEventListener('webkitfullscreenchange', draw);
})();
/* ---------- démarrage ---------- */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  tab = b.dataset.t;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  if (sheetKey) closeSheet(); else renderView();
  if (tab === 'meme') memeLoad();
});
renderHeader(); renderView(); connectBN(); connectRPC(); loadLogos();
setInterval(() => {
  try { renderHeader(); recordEq(); } catch(e){ console.error(e); }
  try {
    if (sheetKey) refreshSheet();
    else if (!(tab === 'porte' && document.activeElement && document.activeElement.tagName === 'INPUT')) renderList();
  } catch(e){ console.error(e); }
}, 1000);
setInterval(pollBN, 1000);
setInterval(pollDex, 1000);
setInterval(syncCurves, 1000);
setInterval(() => { if (tab === 'meme') memeLoad(true); }, 30000);
</script>
</body>
</html>
