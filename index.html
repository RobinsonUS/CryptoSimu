        g += hline(yE, TXT, false) + txt(X1 + 6, yE + 4, 'achat', { c: TXT });
        g += hline(yS, RED, true) + txt(X1 + 6, yS + 4, `-${sl} %`, { c: RED, w: 700, s: 12 }) + txt(X1 + 6, yS + 18, 'stop loss', { s: 10 });
        g += line(pre.map((v, i) => `${i ? 'L' : 'M'}${(X0 + (xe - X0)*i/(pre.length - 1)).toFixed(1)},${(yE - 26 + v).toFixed(1)}`).join('') + `L${xe},${yE}`, MUT, 1.6) + dot(xe, yE, ACC);
        g += txt((xe + X1)/2, (yE + yS)/2 + 4, `perte max ${money(L)}`, { a: 'middle', c: RED, w: 600, s: 12 });
        g += tag(xe + 6, yE - 12, done ? `mise ${money(size)}` : 'mise ?', 'var(--surface2)', done ? TXT : ACC);
        return svg(g);
      } };
  },
  fees(){
    const A = pickOne([10, 25, 50, 100, 200]), pump = Math.random() < 0.5, pool = pump ? 0.01 : 0.0025;
    const P = pickOne([0.0005, 0.001, 0.002, 0.005, 0.01]), sp = Math.round(solPx()), N = (P + SOL_BASE_FEE)*sp, tot = A*(pool + PLAT_FEE) + N;
    return { tag: 'Frais', ...makeChoices(tot, [A*(pool + PLAT_FEE), A*pool + N, tot + N, A*PLAT_FEE + N], money),
      q: `Achat de <b>${money(A)}</b> sur ${pump ? 'pump.fun (pool 1 %)' : 'PumpSwap (pool 0,25 %)'}, plateforme 1 %, priority fee <b>${solTxt(P)} SOL</b>, SOL à ${sp} $.<span class="mut">Combien paies-tu de frais au total sur cet achat ?</span>`,
      steps: [`Pool : ${money(A)} × ${nf2(pool*100, 2)} % = ${money(A*pool)}`, `Plateforme : ${money(A)} × 1 % = ${money(A*PLAT_FEE)}`, `Réseau : (${solTxt(P)} + 0,000005) SOL × ${sp} $ = ${money(N)}`, `Total : <b>${money(tot)}</b>, soit ${pct1(tot/A*100)} de la mise`],
      tip: N > A*(pool + PLAT_FEE) ? `La priority fee coûte ici plus que le reste. Elle est fixe : sur un petit achat, elle pèse lourd.` : `Les frais en pourcentage grossissent avec la mise, la priority fee reste fixe.`,
      viz(done){
        const parts = [['Pool', A*pool, ACC], ['Plateforme', A*PLAT_FEE, 'var(--mut)'], ['Réseau', N, TXT]], W = X1 + 60 - X0;
        let g = txt(X0, 32, `Mise : ${money(A)}`, { c: TXT, w: 600 }) + box(X0, 42, W, 14, 'var(--surface2)', 4) + (done ? box(X0, 42, Math.max(3, W*tot/A), 14, RED, 4) : '');
        g += txt(X0, 80, done ? `Frais : ${money(tot)}, ${pct1(tot/A*100)} de la mise` : 'Répartition des frais :', { s: 12, c: done ? TXT : MUT, w: done ? 600 : 500 });
        let x = X0; const sum = parts.reduce((t, q) => t + q[1], 0);
        parts.forEach(([n, v, c], i) => {
          const w = Math.max(4, W*v/sum - 4);
          g += box(x, 92, w, 30, c, 6);
          g += txt(X0 + i*(W/3), 146, n, { c: TXT, w: 600 }) + box(X0 + i*(W/3), 152, 10, 4, c, 2);
          if (done) g += txt(X0 + i*(W/3), 172, money(v), { s: 12 });
          x += w + 4;
        });
        return svg(g);
      } };
  },
  rr(){
    const sl = pickOne([5, 10, 15, 20, 25]), tp = sl * pickOne([1, 1.5, 2, 3, 4]), R = tp/sl, seed = Math.floor(Math.random()*9999);
    const win = Math.random() < 0.5, wr = 100/(1 + R), fmt = x => '1 : ' + nf2(x, 1);
    const base = win
      ? { ...makeChoices(wr, [100*R/(1 + R), 50, 100/R], pct1),
          q: `Tu trades toujours avec un stop loss à <b>-${sl} %</b> et un take profit à <b>+${nf2(tp, 1)} %</b>.<span class="mut">Quel taux de trades gagnants te faut-il au minimum pour ne pas perdre d'argent ? Frais ignorés.</span>`,
          steps: [`Ratio : ${nf2(tp, 1)} ÷ ${sl} = ${nf2(R, 1)}`, `Équilibre : gains × ${nf2(R, 1)} = pertes`, `Taux minimum = 1 ÷ (1 + ${nf2(R, 1)}) = <b>${pct1(wr)}</b>`],
          tip: `Avec un bon ratio, tu peux avoir tort plus souvent que raison et rester gagnant.` }
      : { ...makeChoices(R, [sl/tp, R + 1, (tp + sl)/sl], fmt),
          q: `Stop loss à <b>-${sl} %</b>, take profit à <b>+${nf2(tp, 1)} %</b>.<span class="mut">Quel est le ratio risque / gain ?</span>`,
          steps: [`Risque : ${sl} %, gain visé : ${nf2(tp, 1)} %`, `Ratio = ${nf2(tp, 1)} ÷ ${sl} = <b>1 : ${nf2(R, 1)}</b>`],
          tip: `Chaque dollar risqué peut en rapporter ${nf2(R, 1)}. En dessous de 1 : 1, il faut gagner plus d'un trade sur deux.` };
    return { tag: 'Risque / gain', ...base,
      viz(done){
        const yE = 98, k = 66/Math.max(tp, sl*1.2), yT = yE - tp*k, yS = yE + sl*k, xe = 104, pre = walk(10, 22, 0, 16, seed);
        let g = box(xe, yT, X1 - xe, yE - yT, GREEN_BG, 0) + box(xe, yE, X1 - xe, yS - yE, RED_BG, 0);
        g += hline(yT, GREEN, true, xe) + txt(X1 + 6, yT + 4, `+${nf2(tp, 1)} %`, { c: GREEN, w: 700, s: 12 }) + txt(X1 + 6, yT + 18, 'take profit', { s: 10 });
        g += hline(yE, TXT, false, xe) + txt(X1 + 6, yE + 4, 'achat', { c: TXT });
        g += hline(yS, RED, true, xe) + txt(X1 + 6, yS + 4, `-${sl} %`, { c: RED, w: 700, s: 12 }) + txt(X1 + 6, yS + 18, 'stop loss', { s: 10 });
        g += line(pre.map((v, i) => `${i ? 'L' : 'M'}${(X0 + (xe - X0)*i/(pre.length - 1)).toFixed(1)},${(yE + v).toFixed(1)}`).join(''), MUT, 1.6) + dot(xe, yE, ACC);
        if (done) g += txt((xe + X1)/2, (yT + yE)/2 + 5, win ? `gagner ${pct1(wr)} du temps suffit` : `ratio 1 : ${nf2(R, 1)}`, { a: 'middle', c: TXT, w: 700, s: 13 });
        return svg(g);
      } };
  },
  logo(){
    const pool = MAJORS.filter(m => LOGO[m] && BN[m]);
    if (pool.length < 4) return null;
    const good = pickOne(pool), others = shuffle(pool.filter(m => m !== good)).slice(0, 3);
    return { tag: 'Logos', choices: shuffle([good, ...others]), answer: good,
      q: `De quelle crypto s'agit-il ?`, steps: null, tip: `C'est <b>${good}</b>.`,
      viz(){ return `<img class="logo" src="${esc(LOGO[good])}" alt="">`; } };
  }
};
function nextEx(){
  const cats = trainCat === 'all' ? Object.keys(EX) : [trainCat];
  for (let i = 0; i < 10; i++){ const ex = EX[pickOne(cats)](); if (ex){ curEx = ex; return; } }
  curEx = null;
}
const FLAME = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3 4 4.5 4 8.5a4 4 0 0 1-8 0c0-1.6.7-2.8 1.5-3.7.2 1.4 1 2.2 2 2.2 0-2.5-1-4.5.5-7z"/><path d="M8 20h8"/></svg>`;
function trainStats(){
  const el = $('#streak'); if (!el) return;
  el.innerHTML = `${FLAME}<div><b>${S.train.streak}</b>série</div><span class="sep"></span><div><b>${S.train.best}</b>record</div>`;
}
const ICON_OK = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
const ICON_KO = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
function showEx(done = false, picked = null){
  const box = $('#ex'); if (!box) return;
  if (!curEx){ box.innerHTML = `<div class="exbody"><div class="empty">Les logos se chargent. Choisis une autre catégorie en attendant.</div></div>`; return; }
  const ok = picked === curEx.answer;
  box.innerHTML = `<div class="exviz">${curEx.viz(done)}</div>
    <div class="exbody">
      <div class="extag">${curEx.tag}</div>
      <div class="exq">${curEx.q}</div>
      <div class="exopts">${curEx.choices.map((c, i) => {
        const st = !done ? '' : c === curEx.answer ? 'ok' : c === picked ? 'ko' : 'dim';
        return `<button class="opt ${st}" ${done ? 'disabled' : ''} data-v="${esc(c)}"><span class="key">${'ABCD'[i]}</span><span class="lab">${esc(c)}</span></button>`;
      }).join('')}</div>
      ${done ? `<div class="exfb">
        <div class="verdict ${ok ? 'up' : 'down'}">${ok ? ICON_OK + 'Bonne réponse' : ICON_KO + 'Raté, la bonne réponse est ' + esc(curEx.answer)}</div>
        ${curEx.steps ? `<div class="steps">${curEx.steps.join('<br>')}</div>` : ''}
        <div class="tip">${curEx.tip}</div>
        <button class="btn btn-buy" id="exnext">Exercice suivant</button></div>` : ''}
    </div>`;
  if (!done) box.querySelectorAll('.opt').forEach(b => b.onclick = () => answerEx(b.dataset.v));
  else $('#exnext').onclick = () => { nextEx(); showEx(); $('#ex').scrollIntoView({ block: 'nearest' }); };
}
function answerEx(v){
  const t = S.train;
  if (v === curEx.answer){ t.streak++; t.best = Math.max(t.best, t.streak); } else t.streak = 0;
  save(); trainStats(); showEx(true, v);
}
function renderTrain(v){
  v.innerHTML = `<div class="train">
    <div class="trtop"><div><div class="trtitle">Entraînement</div><div class="trsub">Des situations courtes, calculées avec les règles exactes de la simulation.</div></div><div class="streak" id="streak"></div></div>
    <div class="pills">${TRAIN_CATS.map(([k, l]) => `<button data-c="${k}" class="${k === trainCat ? 'on' : ''}">${l}</button>`).join('')}</div>
    <article class="ex" id="ex"></article></div>`;
  v.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
    trainCat = b.dataset.c;
    v.querySelectorAll('[data-c]').forEach(x => x.classList.toggle('on', x === b));
    nextEx(); showEx();
  });
  trainStats();
  if (!curEx) nextEx();
  showEx();
}

/* ---------- fiche token ---------- */
function openSheet(key){
  sheetKey = key; curTf = DEFAULT_TF;
  const {kind,id} = parse(key), m = meta(key), sh = $('#sheet');
  const links = kind === 'sol' ? `<button id="copyca" class="chip">${esc(id.slice(0,4))}…${esc(id.slice(-4))}  Copier</button>` : '';
  sh.innerHTML = `<div class="sheetin">
    <div class="topbar"><button id="back" class="iconbtn" aria-label="Retour"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>${links}</div>
    <div class="sheetgrid"><div class="maincol">
    <div class="tokhead">${icon(m.img, m.sym)}<div class="grow"><div class="tokname">${esc(m.sym)}</div><div class="mut sm">${esc(m.name)}</div></div></div>
    <div id="sp">-</div><div id="sc"></div>
    <div class="chartbar"><div id="fresh"></div><button id="chartreset" class="chartreset" aria-label="Recentrer le graphique"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg></button></div>
    <div id="chartwrap"><div id="chart"></div><div id="legend"></div></div><div id="chartnote"></div>
    </div><div class="sidecol">
    <div class="card"><h3>Acheter</h3>
      <input id="amt" class="amount" type="number" inputmode="decimal" placeholder="0,00 $">
      <div class="chips"><button data-p=".1">10 %</button><button data-p=".25">25 %</button><button data-p=".5">50 %</button><button data-p="1">Max</button></div>
      <div id="quote"></div>
      <button class="btn btn-buy" id="bbuy">Acheter</button>
    </div>
    <div id="posbox"></div>
    <div class="card" id="stats"></div>
    </div></div></div>`;
  sh.classList.add('open'); window.scrollTo(0,0); sh.scrollTop = 0;
  $('#back').onclick = closeSheet;
  if ($('#copyca')) $('#copyca').onclick = () => {
    const done = () => toast('Adresse copiée');
    if (navigator.clipboard) navigator.clipboard.writeText(id).then(done, () => prompt('Adresse du token', id));
    else prompt('Adresse du token', id);
  };
  sh.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { $('#amt').value = (Math.floor(S.cash*b.dataset.p*100)/100).toFixed(2); updQuote(); });
  $('#amt').oninput = updQuote;
  $('#bbuy').onclick = () => buy(key, $('#amt').value);
  buildPos();
  refreshSheet();
  $('#chartreset').onclick = resetChart;
  chartMode = null;
  loadChart(key);
}
function closeSheet(){ if (chartObj){ chartObj.remove(); chartObj = null; series = null; volSeries = null; chartMode = null; } sheetKey = null; $('#sheet').classList.remove('open'); renderView(); }
function buildPos(){
  const box = $('#posbox'); if (!box || !sheetKey) return;
  const p = S.pos[sheetKey];
  if (!p){ box.innerHTML = ''; box.dataset.has = ''; return; }
  if (box.dataset.has === '1') return;
  box.dataset.has = '1';
  box.innerHTML = `<div class="card"><h3>Ma position</h3><div id="pinfo"></div>
    <div class="field">Vendre</div>
    <div class="chips three sell" style="margin-top:0"><button data-s=".25">25 %</button><button data-s=".5">50 %</button><button data-s="1">Tout</button></div>
    <div class="field">Stop loss (prix)</div><input id="sl" type="number" inputmode="decimal" value="${p.sl ?? ''}">
    <div class="field">Take profit (prix)</div><input id="tp" type="number" inputmode="decimal" value="${p.tp ?? ''}">
    <button id="savetrig" class="btn btn-ghost" style="margin-top:12px">Enregistrer SL / TP</button></div>`;
  box.querySelectorAll('[data-s]').forEach(b => b.onclick = () => sell(sheetKey, +b.dataset.s));
  $('#savetrig').onclick = () => {
    const q = S.pos[sheetKey]; if (!q) return;
    q.sl = +$('#sl').value || null; q.tp = +$('#tp').value || null;
    save(); toast('SL / TP enregistrés');
  };
}
function updQuote(){
  if (!sheetKey) return;
  const amt = +$('#amt').value, el = $('#quote'), {kind,id} = parse(sheetKey);
  if (!(amt > 0)){ el.textContent = 'Cash disponible : '+money(S.cash); return; }
  if (kind === 'bn'){
    const t = BN[id]; if (!t){ el.textContent = ''; return; }
    el.innerHTML = `Prix d'achat (ask) : ${fp(t.ask)}<br>Frais : ${money(amt*BN_FEE)}<br>Tu reçois : ${fp(amt*(1-BN_FEE)/t.ask)} ${id}`;
  } else {
    const p = DEX[id]; if (!p){ el.textContent = ''; return; }
    const q = buyQuote(p, amt);
    if (q.error){ el.textContent = q.error; return; }
    const fc = feeCache[poolAcct(p)];
    if (!fc || Date.now() - fc.t > 10000) recentFees(poolAcct(p)).catch(() => {});
    const fPool = amt*poolFee(p), fPlat = amt*PLAT_FEE, fNet = q.fee - fPool - fPlat;
    el.innerHTML = `Prix moyen estimé : ${fp(q.avg)}<br>Frais : ${money(q.fee)} (pool ${money(fPool)} · plateforme ${money(fPlat)} · réseau ${money(fNet)})<br>Confirmation estimée : ${fc ? etaText(landChance(fc.fees)) : '…'}<br>Impact sur le prix : <span class="${q.impact > .05 ? 'down' : ''}">${nf2(q.impact*100, 2)} %</span><br>Tu reçois environ : ${fp(q.tokens)} ${esc(p.baseToken.symbol)}`;
  }
}
function refreshSheet(){
  if (!sheetKey) return;
  const {kind,id} = parse(sheetKey);
  const pr = priceOf(sheetKey);
  $('#sp').textContent = fp(pr);
  if (kind === 'bn'){
    const t = BN[id];
    if (t){
      $('#sc').innerHTML = `<span class="${cls(t.pct)}">${pct(t.pct)} 24h</span>`;
      $('#stats').innerHTML = `<div class="kv"><span>Achat (ask)</span><span>${fp(t.ask)}</span></div><div class="kv"><span>Vente (bid)</span><span>${fp(t.bid)}</span></div><div class="kv"><span>Volume 24h</span><span>${big(t.vol)}</span></div>`;
    }
  } else {
    const p = DEX[id];
    if (p){
      const pc = p.priceChange || {};
      $('#sc').innerHTML = `<span class="${cls(pc.h1 || 0)}">${pct(pc.h1)} 1h</span>`;
      const sn = SEEN[id];
      if (sn){
        const g = Math.round((Date.now()-sn.got)/1000), mv = Math.round((Date.now()-sn.moved)/1000);
        $('#fresh').innerHTML = (pfPrice(id) ? '<span class="up">Live à chaque trade</span> · ' : `Mis à jour il y a ${g} s · `)
          + `dernier trade il y a <span class="${mv > 30 ? 'down' : ''}">${mv} s</span>`;
      }
      $('#stats').innerHTML = `
        <div class="kv"><span>5 min / 24h</span><span><span class="${cls(pc.m5 || 0)}">${pct(pc.m5)}</span> · <span class="${cls(pc.h24 || 0)}">${pct(pc.h24)}</span></span></div>
        <div class="kv"><span>Liquidité</span><span>${liq(p) > 0 ? big(liq(p)) : (p.dexId === 'pumpfun' ? 'Bonding curve' : 'Inconnue')}</span></div>
        <div class="kv"><span>Market cap</span><span>${pfPrice(id) ? big(pfPrice(id)*1e9) : big(p.marketCap || p.fdv)}</span></div>
        <div class="kv"><span>Volume 24h</span><span>${big(p.volume && p.volume.h24)}</span></div>
        <div class="kv"><span>DEX</span><span>${esc(p.dexId)} · ${age(p.pairCreatedAt)}</span></div>`;
    }
  }
  buildPos();
  const pos = S.pos[sheetKey], pi = $('#pinfo');
  if (pos && pi){
    const mv = marketValue(pos, sheetKey), sv = sellValue(pos, sheetKey);
    const res = v => v == null ? '<span class="mut">-</span>' : `<span class="${cls(v - pos.cost)}">${v - pos.cost >= 0 ? '+' : ''}${money(v - pos.cost)} (${pct((v - pos.cost)/pos.cost*100)})</span>`;
    pi.innerHTML = `<div class="kv"><span>Quantité</span><span>${fp(pos.qty)}</span></div>
      <div class="kv"><span>Coût total (frais d'achat inclus)</span><span>${money(pos.cost)}</span></div>
      <div class="kv"><span>Valeur au prix actuel</span><span>${money(mv)}</span></div>
      <div class="kv"><span>Résultat</span>${res(mv)}</div>
      <div class="kv"><span>Si je vends tout maintenant</span><span>${money(sv)}</span></div>
      <div class="kv"><span>Résultat après revente</span>${res(sv)}</div>`;
  }
  if (document.activeElement !== $('#amt')) updQuote();
}
function refresh(){ renderHeader(); if (sheetKey) refreshSheet(); else renderList(); }

/* ---------- démarrage ---------- */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  tab = b.dataset.t;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  if (sheetKey) closeSheet(); else renderView();
  if (tab === 'meme' && memeTab !== 'search' && !feed[memeTab].length) loadFeed(memeTab).then(renderList).catch(() => toast('Erreur DexScreener'));
});
renderHeader(); renderView(); connectBN(); connectRPC(); loadLogos();
setInterval(() => {
  try { renderHeader(); } catch(e){ console.error(e); }
  try {
    if (sheetKey) refreshSheet();
    else if (!(tab === 'porte' && document.activeElement && document.activeElement.tagName === 'INPUT')) renderList();
  } catch(e){ console.error(e); }
}, 1000);
setInterval(pollBN, 1000);
setInterval(pollDex, 1000);
setInterval(syncCurves, 1000);
setInterval(() => { if (tab === 'meme' && memeTab !== 'search') loadFeed(memeTab).catch(() => {}); }, 30000);
</script>
