/* --- déroulé du marché --- */
async function runMission(){
  if (M.running || M.result) return;
  const t = M.tokens[M.sel], A = Math.min(CAPITAL, +M.amount || 0);
  if (!(A >= 1)) return toast('Mise invalide');
  if (!(M.slip > 0)) return toast('Choisis une tolérance de slippage');
  M.amount = A; M.running = true; renderTicket();
  const say = h => { const l = $('#cplive'); if (l) l.innerHTML = h; };
  const f = missionFees(t, A), N = f.net;
  // 1. confirmation : dépend de ta priority fee face à la médiane du réseau
  const ratio = M.prio/M.cong.median, q = ratio < 0.3 ? 0.012 : Math.min(0.95, 0.12 + 0.42*ratio);
  let slot = 0; while (++slot <= 150 && Math.random() >= q){}
  const r = { token: t.name, A, shown: [] }; M.live = r;
  if (slot > 150){
    say('<b class="down">Transaction expirée</b>'); await sleep(900);
    r.status = 'expired'; r.pnl = 0; return finishMission(r);
  }
  const sec = slot*0.4 + 0.3;
  for (let s = 0; s < Math.min(sec, 6); s += 0.25){ say(`Confirmation… <b>${nf2(Math.min(s, sec), 1)} s</b>`); await sleep(110); }
  r.confirmSec = sec;
  // 2. le prix bouge pendant l'attente : d'autres acheteurs passent avant toi
  const sd = t.vol*Math.sqrt(sec/60), move = gauss()*sd + (t.type === 'fresh' ? Math.abs(gauss())*sd*0.6 : 0);
  const short = move > 0 ? move/(1 + move)*100 : 0;
  r.move = move*100;
  if (short > M.slip){
    say('<b class="down">Échec : slippage dépassé</b>'); await sleep(900);
    r.status = 'slip'; r.pnl = -N; return finishMission(r);
  }
  const pFill = t.price*(1 + move), dx = A*(1 - f.pct) - N, tokens = dx/pFill * t.R/(t.R + dx);
  r.entry = pFill; r.slp = M.sl > 0 ? pFill*(1 - M.sl/100) : null; r.tpp = M.tp > 0 ? pFill*(1 + M.tp/100) : null;
  addTradeLines(r);
  if (cpSeries) cpSeries.setMarkers([{ time: M.t0 + (CANDLES - 1)*60, position: 'belowBar', color: '#ab9ff2', shape: 'arrowUp', text: 'achat' }]);
  // 3. les 60 minutes suivantes
  let exitP = null, why = null, blocked = false;
  for (let i = 0; i < CANDLES; i++){
    const c = t.fut[i];
    if (t.rug === i && t.rugKind === 'freeze') blocked = true;
    if (t.rug === i && t.rugKind === 'lp'){ exitP = 0; why = 'lp'; }
    if (exitP === null && !blocked){
      if (r.slp && c.l <= r.slp){ exitP = Math.min(r.slp, c.o); why = 'stop'; }
      else if (r.tpp && c.h >= r.tpp){ exitP = Math.max(r.tpp, Math.min(c.o, c.h)); why = 'tp'; }
    }
    r.shown.push(c);
    try { if (cpSeries) cpSeries.update({ time: M.t0 + (CANDLES + i)*60, open: c.o, high: c.h, low: c.l, close: c.c }); } catch(e){}
    const val = exitP !== null ? null : tokens*c.c;
    say(exitP !== null ? '' : `Position ouverte · <b class="${cls(val - A)}">${val - A >= 0 ? '+' : ''}${money(val - A)}</b> <span class="mut">minute ${i + 1} / 60</span>`);
    if (exitP !== null){ r.exitIdx = i; break; }
    await sleep(70);
  }
  if (exitP === null){ exitP = blocked ? 0 : t.fut[CANDLES - 1].c; why = blocked ? 'freeze' : 'end'; r.exitIdx = CANDLES - 1; }
  if (blocked && why !== 'freeze' && why !== 'lp'){ exitP = 0; why = 'freeze'; }
  const V = tokens*exitP, gross = t.R*V/(t.R + V), out = Math.max(0, gross*(1 - f.pct) - (V > 0 ? N : 0));
  r.status = why; r.exitP = exitP; r.out = out; r.pnl = out - A;
  if (exitP > 0 && cpSeries) cpSeries.setMarkers([{ time: M.t0 + (CANDLES - 1)*60, position: 'belowBar', color: '#ab9ff2', shape: 'arrowUp', text: 'achat' },
    { time: M.t0 + (CANDLES + r.exitIdx)*60, position: 'aboveBar', color: why === 'tp' ? UPC : why === 'stop' ? DNC : '#8e8e9a', shape: 'arrowDown', text: why === 'tp' ? 'objectif' : why === 'stop' ? 'stop' : 'fin' }]);
  await sleep(500);
  finishMission(r);
}

/* --- notation : 100 points sur les décisions --- */
function gradeMission(){
  const t = M.tokens[M.sel], P = M.profile, p = preview(), items = [];
  const flagged = !t.checks.mint || !t.checks.freeze || !t.checks.lp;
  const safe = M.tokens.filter(x => x.checks.mint && x.checks.freeze && x.checks.lp);
  const bestTok = safe.slice().sort((a, b) => FIT[P.id][b.type] - FIT[P.id][a.type])[0];
  // 1. choix du token
  let pts, msg;
  if (flagged){ pts = 0; msg = `${t.name} avait ${!t.checks.mint ? 'son autorité de mint active' : !t.checks.freeze ? 'son autorité de gel active' : 'sa liquidité non brûlée'}. Une seule croix rouge suffit à passer son tour.`; }
  else { pts = FIT[P.id][t.type]; msg = pts >= 25 ? `Bon choix pour un profil ${P.name.toLowerCase()}.` : `Un ${t.label.toLowerCase()} colle moins à un profil ${P.name.toLowerCase()}. ${bestTok.name} (${bestTok.label.toLowerCase()}) était plus adapté.`; }
  items.push(['Choix du token', pts, 25, msg]);
  // 2. risque
  const ok = p.risk <= P.maxLoss;
  items.push(['Respect de la perte maximale', ok ? 25 : p.risk <= P.maxLoss*1.3 ? 12 : 0, 25,
    M.sl > 0 ? `Perte possible ${money(p.risk)} pour ${money(P.maxLoss)} autorisés. ${ok ? 'Respecté.' : 'Il fallait miser moins ou serrer le stop.'}` : `Sans stop loss, toute la mise (${money(p.risk)}) est en jeu. ${ok ? 'Ça passe ici car la mise est petite.' : 'Bien au-delà des ' + money(P.maxLoss) + ' autorisés.'}`]);
  // 3. taille face à la liquidité
  items.push(['Taille face à la liquidité', p.imp <= 0.01 ? 10 : p.imp <= 0.03 ? 6 : p.imp <= 0.06 ? 3 : 0, 10, `Impact de ${nf2(p.imp*100, 2)} % à l'achat, autant à la revente. ${p.imp <= 0.01 ? 'Négligeable.' : 'Sur un petit pool, miser moins réduit cette perte.'}`]);
  // 4. slippage
  const [s0, s1] = t.slip;
  items.push(['Tolérance de slippage', M.slip >= s0 && M.slip <= s1 ? 10 : M.slip < s0 ? 4 : M.slip <= s1*2 ? 5 : 0, 10,
    M.slip < s0 ? `${nf2(M.slip, 1)} % est trop serré pour un ${t.label.toLowerCase()} : risque d'échec. Vise ${s0} à ${s1} %.` : M.slip > s1 ? `${nf2(M.slip, 1)} % laisse beaucoup de marge aux bots qui passent avant toi. Vise ${s0} à ${s1} %.` : `Adapté à la volatilité du token (${s0} à ${s1} %).`]);
  // 5. priority fee
  const ratio = M.prio/M.cong.median, feeUsd = (M.prio + SOL_BASE_FEE)*M.sol, heavy = feeUsd > M.amount*0.01;
  items.push(['Priority fee', ratio >= 1 && ratio <= 5 && !heavy ? 10 : ratio < 1 ? 3 : 5, 10,
    ratio < 1 ? `Sous la médiane du réseau (${solTxt(M.cong.median)} SOL) : confirmation lente ou expirée.` : heavy ? `${money(feeUsd)} par transaction, plus de 1 % de ta mise : trop cher pour ce montant.` : ratio > 5 ? `Plus de 5 fois la médiane : tu paies pour rien.` : `Bien placée face à un réseau ${M.cong.name}.`]);
  // 6. ratio
  const rr = p.rr;
  items.push(['Ratio risque / gain', !rr ? 0 : rr >= 2 ? 10 : rr >= 1.5 ? 7 : rr >= 1 ? 4 : 0, 10, !rr ? 'Il faut un stop et un objectif pour avoir un plan.' : `1 : ${nf2(rr, 1)}. ${rr >= 2 ? 'Solide.' : 'Vise au moins 1 : 2.'}`]);
  // 7. stop face à la volatilité
  const noise = t.vol*Math.sqrt(10)*100;
  items.push(['Stop face à la volatilité', !(M.sl > 0) ? 0 : M.sl < noise ? 3 : M.sl > noise*6 ? 6 : 10, 10,
    !(M.sl > 0) ? 'Pas de stop.' : M.sl < noise ? `Le prix bouge d'environ ${pct1(noise)} en 10 minutes : un stop à ${pct1(M.sl)} saute sur du simple bruit.` : M.sl > noise*6 ? `Stop très large pour ce token (bruit ~${pct1(noise)} en 10 min).` : `Au-delà du bruit habituel (~${pct1(noise)} en 10 min), sans être trop loin.`]);
  const score = items.reduce((a, x) => a + x[1], 0);
  // la mise idéale
  const slI = Math.max(1, Math.round(noise*2)), A_I = Math.max(1, Math.min(CAPITAL, Math.floor(P.maxLoss/(slI/100 + 0.03))));
  const ideal = `${bestTok.name}, mise d'environ ${money(A_I)}, slippage ${Math.round((s0 + s1)/2*10)/10} % (${bestTok.label.toLowerCase()} : ${TTYPES[bestTok.type].slip[0]} à ${TTYPES[bestTok.type].slip[1]} %), priority fee autour de ${solTxt(+(M.cong.median*2).toPrecision(2))} SOL, stop vers -${slI} %, objectif vers +${slI*2} %.`;
  return { items, score, ideal };
}
function finishMission(r){
  M.running = false; M.result = r; M.live = null;
  const g = gradeMission(); r.grade = g;
  S.cases = S.cases || { best: 0, played: 0 };
  S.cases.played++; S.cases.best = Math.max(S.cases.best, g.score); save();
  renderTicket(); renderResult();
}
function renderResult(again){
  const r = M.result, g = r.grade, el = $('#cpres'); if (!el) return;
  const P = M.profile, letter = g.score >= 85 ? 'A' : g.score >= 70 ? 'B' : g.score >= 55 ? 'C' : 'D';
  const C = 2*Math.PI*44, off = C*(1 - g.score/100);
  const outcome = {
    expired: 'Ta transaction a expiré : la priority fee était trop basse pour ce réseau. Aucun frais payé, mais tu as raté le trade.',
    slip: r.status === 'slip' ? `Le prix a bougé de ${pct1(r.move)} pendant ${nf2(r.confirmSec, 1)} s de confirmation : au-delà de ta tolérance. Transaction échouée, frais réseau perdus.` : '',
    tp: 'Objectif atteint, vendu au take profit.', stop: 'Le stop loss a coupé la perte.',
    end: 'Ni stop ni objectif touchés : vendu au prix de fin de mission.',
    lp: 'Le créateur a retiré la liquidité. Plus rien à vendre, ton stop n\'a servi à rien.',
    freeze: 'Le créateur a gelé les portefeuilles. Impossible de vendre, la position est perdue.'
  }[r.status];
  const goal = r.pnl >= P.goal, kept = -r.pnl <= P.maxLoss;
  el.innerHTML = `<div class="result">
    <div class="rescore">
      <svg viewBox="0 0 110 110" class="ring"><circle cx="55" cy="55" r="44" style="fill:none;stroke:var(--surface2);stroke-width:10"/>
        <circle cx="55" cy="55" r="44" style="fill:none;stroke:${g.score >= 70 ? 'var(--up)' : g.score >= 55 ? 'var(--acc)' : 'var(--down)'};stroke-width:10;stroke-linecap:round;stroke-dasharray:${C.toFixed(1)};stroke-dashoffset:${off.toFixed(1)};transform:rotate(-90deg);transform-origin:55px 55px"/>
        <text x="55" y="58" text-anchor="middle" style="fill:var(--txt);font-size:30px;font-weight:700">${g.score}</text><text x="55" y="76" text-anchor="middle" style="fill:var(--mut);font-size:11px">/ 100</text></svg>
      <div><div class="resgrade">Note ${letter}</div><div class="mut sm">La note juge tes décisions. Le résultat dépend aussi de la chance.</div></div>
    </div>
    <div class="resout">
      <div class="resline"><span>Résultat</span><b class="${cls(r.pnl)}">${r.pnl >= 0 ? '+' : ''}${money(r.pnl)}</b></div>
      <div class="ressub">${outcome}</div>
      <div class="respills"><span class="${goal ? 'okp' : 'kop'}">${goal ? ICON_OK : ICON_KO} objectif +${money(P.goal)}</span><span class="${kept ? 'okp' : 'kop'}">${kept ? ICON_OK : ICON_KO} perte max ${money(P.maxLoss)}</span></div>
    </div>
    <div class="crit">${g.items.map(([n, pts, max, msg]) => `<div class="critrow"><div class="crithead"><span class="ci ${pts >= max ? 'ok' : pts > 0 ? 'mid' : 'ko'}">${pts >= max ? ICON_OK : pts > 0 ? ICON_MID : ICON_KO}</span><b>${n}</b><em>${pts} / ${max}</em></div><div class="critmsg">${msg}</div></div>`).join('')}</div>
    <div class="ideal"><b>Ce qu'il fallait faire</b><span>${g.ideal}</span></div>
    <button class="btn btn-buy" id="cpagain">Nouvelle mission</button></div>`;
  $('#cpagain').onclick = () => { M = null; renderTrain($('#view')); window.scrollTo(0, 0); };
  if (!again) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------- fiche token ---------- */
function openSheet(key){
  sheetKey = key; curTf = DEFAULT_TF;
  const {kind,id} = parse(key), m = meta(key), sh = $('#sheet');
  const links = kind === 'sol' ? `<button id="copyca" class="chip">${esc(id.slice(0,4))}…${esc(id.slice(-4))}  Copier</button>` : '';
  sh.innerHTML = `<div class="sheetin">
    <div class="topbar"><button id="back" class="iconbtn" aria-label="Retour"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>${links}</div>
    <div class="sheetgrid"><div class="maincol">
    <div class="tokhead">${icon(m.img, m.sym)}<div class="grow"><div class="tokname">${esc(m.sym)}</div><div class="mut sm">${esc(m.name)}</div></div></div>
    <div id="sp">-</div><div id="sc"></div>
    <div class="chartbar"><div id="fresh"></div><button id="chartreset" class="chartreset" aria-label="Recentrer le graphique"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg></button></div>
    <div id="chartwrap"><div id="chart"></div><div id="legend"></div></div><div id="chartnote"></div>
    </div><div class="sidecol">
    <div class="card"><h3>Acheter</h3>
      <input id="amt" class="amount" type="number" inputmode="decimal" placeholder="0,00 $">
      <div class="chips"><button data-p=".1">10 %</button><button data-p=".25">25 %</button><button data-p=".5">50 %</button><button data-p="1">Max</button></div>
      <div id="quote"></div>
      <button class="btn btn-buy" id="bbuy">Acheter</button>
    </div>
    <div id="posbox"></div>
    <div class="card" id="stats"></div>
    </div></div></div>`;
  sh.classList.add('open'); window.scrollTo(0,0); sh.scrollTop = 0;
  $('#back').onclick = closeSheet;
  if ($('#copyca')) $('#copyca').onclick = () => {
    const done = () => toast('Adresse copiée');
    if (navigator.clipboard) navigator.clipboard.writeText(id).then(done, () => prompt('Adresse du token', id));
    else prompt('Adresse du token', id);
  };
  sh.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { $('#amt').value = (Math.floor(S.cash*b.dataset.p*100)/100).toFixed(2); updQuote(); });
  $('#amt').oninput = updQuote;
  $('#bbuy').onclick = () => buy(key, $('#amt').value);
  buildPos();
  refreshSheet();
  $('#chartreset').onclick = resetChart;
  chartMode = null;
  loadChart(key);
}
function closeSheet(){ if (chartObj){ chartObj.remove(); chartObj = null; series = null; volSeries = null; chartMode = null; } sheetKey = null; $('#sheet').classList.remove('open'); renderView(); }
function buildPos(){
  const box = $('#posbox'); if (!box || !sheetKey) return;
  const p = S.pos[sheetKey];
  if (!p){ box.innerHTML = ''; box.dataset.has = ''; return; }
  if (box.dataset.has === '1') return;
  box.dataset.has = '1';
  box.innerHTML = `<div class="card"><h3>Ma position</h3><div id="pinfo"></div>
    <div class="field">Vendre</div>
    <div class="chips three sell" style="margin-top:0"><button data-s=".25">25 %</button><button data-s=".5">50 %</button><button data-s="1">Tout</button></div>
    <div class="field">Stop loss (prix)</div><input id="sl" type="number" inputmode="decimal" value="${p.sl ?? ''}">
    <div class="field">Take profit (prix)</div><input id="tp" type="number" inputmode="decimal" value="${p.tp ?? ''}">
    <button id="savetrig" class="btn btn-ghost" style="margin-top:12px">Enregistrer SL / TP</button></div>`;
  box.querySelectorAll('[data-s]').forEach(b => b.onclick = () => sell(sheetKey, +b.dataset.s));
  $('#savetrig').onclick = () => {
    const q = S.pos[sheetKey]; if (!q) return;
    q.sl = +$('#sl').value || null; q.tp = +$('#tp').value || null;
    save(); toast('SL / TP enregistrés');
  };
}
function updQuote(){
  if (!sheetKey) return;
  const amt = +$('#amt').value, el = $('#quote'), {kind,id} = parse(sheetKey);
  if (!(amt > 0)){ el.textContent = 'Cash disponible : '+money(S.cash); return; }
  if (kind === 'bn'){
    const t = BN[id]; if (!t){ el.textContent = ''; return; }
    el.innerHTML = `Prix d'achat (ask) : ${fp(t.ask)}<br>Frais : ${money(amt*BN_FEE)}<br>Tu reçois : ${fp(amt*(1-BN_FEE)/t.ask)} ${id}`;
  } else {
    const p = DEX[id]; if (!p){ el.textContent = ''; return; }
    const q = buyQuote(p, amt);
    if (q.error){ el.textContent = q.error; return; }
    const fc = feeCache[poolAcct(p)];
    if (!fc || Date.now() - fc.t > 10000) recentFees(poolAcct(p)).catch(() => {});
    const fPool = amt*poolFee(p), fPlat = amt*PLAT_FEE, fNet = q.fee - fPool - fPlat;
    el.innerHTML = `Prix moyen estimé : ${fp(q.avg)}<br>Frais : ${money(q.fee)} (pool ${money(fPool)} · plateforme ${money(fPlat)} · réseau ${money(fNet)})<br>Confirmation estimée : ${fc ? etaText(landChance(fc.fees)) : '…'}<br>Impact sur le prix : <span class="${q.impact > .05 ? 'down' : ''}">${nf2(q.impact*100, 2)} %</span><br>Tu reçois environ : ${fp(q.tokens)} ${esc(p.baseToken.symbol)}`;
  }
}
function refreshSheet(){
  if (!sheetKey) return;
  const {kind,id} = parse(sheetKey);
  const pr = priceOf(sheetKey);
  $('#sp').textContent = fp(pr);
  if (kind === 'bn'){
    const t = BN[id];
    if (t){
      $('#sc').innerHTML = `<span class="${cls(t.pct)}">${pct(t.pct)} 24h</span>`;
      $('#stats').innerHTML = `<div class="kv"><span>Achat (ask)</span><span>${fp(t.ask)}</span></div><div class="kv"><span>Vente (bid)</span><span>${fp(t.bid)}</span></div><div class="kv"><span>Volume 24h</span><span>${big(t.vol)}</span></div>`;
    }
  } else {
    const p = DEX[id];
    if (p){
      const pc = p.priceChange || {};
      $('#sc').innerHTML = `<span class="${cls(pc.h1 || 0)}">${pct(pc.h1)} 1h</span>`;
      const sn = SEEN[id];
      if (sn){
        const g = Math.round((Date.now()-sn.got)/1000), mv = Math.round((Date.now()-sn.moved)/1000);
        $('#fresh').innerHTML = (pfPrice(id) ? '<span class="up">Live à chaque trade</span> · ' : `Mis à jour il y a ${g} s · `)
          + `dernier trade il y a <span class="${mv > 30 ? 'down' : ''}">${mv} s</span>`;
      }
      $('#stats').innerHTML = `
        <div class="kv"><span>5 min / 24h</span><span><span class="${cls(pc.m5 || 0)}">${pct(pc.m5)}</span> · <span class="${cls(pc.h24 || 0)}">${pct(pc.h24)}</span></span></div>
        <div class="kv"><span>Liquidité</span><span>${liq(p) > 0 ? big(liq(p)) : (p.dexId === 'pumpfun' ? 'Bonding curve' : 'Inconnue')}</span></div>
        <div class="kv"><span>Market cap</span><span>${pfPrice(id) ? big(pfPrice(id)*1e9) : big(p.marketCap || p.fdv)}</span></div>
        <div class="kv"><span>Volume 24h</span><span>${big(p.volume && p.volume.h24)}</span></div>
        <div class="kv"><span>DEX</span><span>${esc(p.dexId)} · ${age(p.pairCreatedAt)}</span></div>`;
    }
  }
  buildPos();
  const pos = S.pos[sheetKey], pi = $('#pinfo');
  if (pos && pi){
    const mv = marketValue(pos, sheetKey), sv = sellValue(pos, sheetKey);
    const res = v => v == null ? '<span class="mut">-</span>' : `<span class="${cls(v - pos.cost)}">${v - pos.cost >= 0 ? '+' : ''}${money(v - pos.cost)} (${pct((v - pos.cost)/pos.cost*100)})</span>`;
    pi.innerHTML = `<div class="kv"><span>Quantité</span><span>${fp(pos.qty)}</span></div>
      <div class="kv"><span>Coût total (frais d'achat inclus)</span><span>${money(pos.cost)}</span></div>
      <div class="kv"><span>Valeur au prix actuel</span><span>${money(mv)}</span></div>
      <div class="kv"><span>Résultat</span>${res(mv)}</div>
      <div class="kv"><span>Si je vends tout maintenant</span><span>${money(sv)}</span></div>
      <div class="kv"><span>Résultat après revente</span>${res(sv)}</div>`;
  }
  if (document.activeElement !== $('#amt')) updQuote();
}
function refresh(){ renderHeader(); if (sheetKey) refreshSheet(); else renderList(); }

/* ---------- démarrage ---------- */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  tab = b.dataset.t;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  if (sheetKey) closeSheet(); else renderView();
  if (tab === 'meme' && memeTab !== 'search' && !feed[memeTab].length) loadFeed(memeTab).then(renderList).catch(() => toast('Erreur DexScreener'));
});
renderHeader(); renderView(); connectBN(); connectRPC(); loadLogos();
setInterval(() => {
  try { renderHeader(); } catch(e){ console.error(e); }
  try {
    if (sheetKey) refreshSheet();
    else if (!(tab === 'porte' && document.activeElement && document.activeElement.tagName === 'INPUT')) renderList();
  } catch(e){ console.error(e); }
}, 1000);
setInterval(pollBN, 1000);
setInterval(pollDex, 1000);
setInterval(syncCurves, 1000);
setInterval(() => { if (tab === 'meme' && memeTab !== 'search') loadFeed(memeTab).catch(() => {}); }, 30000);
</script>
