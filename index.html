<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17171b">
<title>CryptoSimu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17171b; --surface:#222228; --surface2:#2d2d34; --line:rgba(255,255,255,.06);
  --txt:#f4f4f6; --surface0:#1c1c21; --mut:#8e8e9a; --acc:#ab9ff2; --acc-ink:#1d1a33;
  --up:#2ebd85; --down:#f6465d; --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;background:var(--bg);color:var(--txt);font-family:Figtree,-apple-system,system-ui,sans-serif;font-size:15px;line-height:1.35;font-variant-numeric:tabular-nums}
body{padding-bottom:84px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input{font:inherit;width:100%;padding:13px 14px;border-radius:12px;border:0;background:var(--surface2);color:var(--txt);outline:none}
input::placeholder{color:var(--mut)}
input:focus{box-shadow:0 0 0 2px var(--acc)}
.up{color:var(--up)}.down{color:var(--down)}.mut{color:var(--mut)}.sm{font-size:13px}

/* en-tête : le solde */
header{padding:22px 16px 18px;text-align:center}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--down)}
.dot.on{background:var(--up)}
#total{font-size:42px;font-weight:700;letter-spacing:-.02em;margin:8px 0 6px}
.pnlrow{display:flex;justify-content:center;align-items:center;gap:8px;font-size:14px;font-weight:500}
.pill{padding:3px 9px;border-radius:999px;font-size:13px;font-weight:600}
.pill.up{background:rgba(46,189,133,.14)}.pill.down{background:rgba(246,70,93,.14)}
#cash{margin-top:6px;font-size:13px;color:var(--mut)}

main{padding:0 16px 8px}
.hint{font-size:13px;color:var(--mut);margin:0 4px 10px}

/* listes de tokens */
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border-radius:var(--r);margin-bottom:8px;cursor:pointer}
.row:active{background:var(--surface2)}
.row .ic{display:flex;flex:none}
.row img,.ph{width:40px;height:40px;border-radius:50%;flex:none;background:var(--surface2);object-fit:cover}
.ph{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--mut)}
.grow{flex:1;min-width:0}
.name{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name .sm{font-weight:500}
.right{text-align:right;flex:none}
.right>div:first-child{font-weight:600}

/* contrôles segmentés */
.tabs{display:flex;background:var(--surface);border-radius:12px;padding:3px;gap:2px;margin-bottom:12px}
.tabs button{flex:1;padding:8px 4px;border-radius:9px;color:var(--mut);font-weight:600;font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--surface2);color:var(--txt)}

form.search{position:relative;margin-bottom:12px}
form.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut)}
form.search input{padding-left:42px}

/* cartes et lignes clé/valeur */
.card{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:10px}
.card h3{font-size:16px;font-weight:600;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0}
.kv>span:first-child{color:var(--mut)}
.kv>span:last-child{font-weight:500;text-align:right}
.field{font-size:13px;color:var(--mut);margin:12px 0 6px}

/* boutons */
.btn{display:block;width:100%;padding:15px;border-radius:14px;font-weight:600;font-size:16px;text-align:center}
.btn-buy{background:var(--acc);color:var(--acc-ink)}
.btn-buy:active{filter:brightness(.92)}
.btn-ghost{background:var(--surface2);color:var(--txt)}
.btn-danger{background:rgba(246,70,93,.12);color:var(--down)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.chips.three{grid-template-columns:repeat(3,1fr)}
.chips button{padding:10px 0;border-radius:10px;background:var(--surface2);font-weight:600;font-size:14px}
.chips.sell button{background:rgba(246,70,93,.12);color:var(--down)}
.amount{font-size:22px;font-weight:600;padding:14px}
#quote{font-size:13px;color:var(--mut);line-height:1.6;margin-bottom:12px;min-height:20px}

/* barre de navigation */
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(23,23,27,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--mut);font-size:11px;font-weight:600}
nav button.on{color:var(--acc)}
nav svg{width:22px;height:22px}

/* fiche token */
#sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;display:none;padding:12px 16px 40px}
#sheet.open{display:block}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center}
.chip{padding:8px 12px;border-radius:999px;background:var(--surface);font-size:13px;font-weight:600;color:var(--mut)}
.tokhead{display:flex;align-items:center;gap:12px}
.tokhead img,.tokhead .ph{width:44px;height:44px}
.tokname{font-size:20px;font-weight:700;line-height:1.1}
#sp{font-size:30px;font-weight:700;letter-spacing:-.01em;margin-top:16px}
#sc{font-size:14px;font-weight:600;margin-top:2px}
#fresh{font-size:12px;color:var(--mut);margin:6px 0 14px}
#chartwrap{position:relative;margin:0 -4px 6px}
#chart{height:280px;touch-action:pan-y;overscroll-behavior:contain}
.chartbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 8px}
.chartbar #fresh{margin:0}
.chartreset{flex:none;width:34px;height:34px;border-radius:10px;background:var(--surface);color:var(--mut);display:flex;align-items:center;justify-content:center}
#legend{position:absolute;top:6px;left:8px;z-index:3;font-size:11px;line-height:1.5;color:var(--mut);pointer-events:none}
#chartnote{font-size:12px;color:var(--mut);margin-bottom:10px}

.sec{display:flex;flex-wrap:wrap;gap:6px}
.qm{color:var(--mut)}
.seccard .sechelp{font-size:12px;color:var(--mut);margin-top:10px}
.secdiag{margin-top:8px;font-size:12px;color:var(--mut)}
.secdiag summary{cursor:pointer;width:max-content}
.secdiag div{margin-top:3px}
.secit{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface2);color:var(--txt)}
.secit b{font-weight:700;width:15px;text-align:center}
.secit svg{width:15px;height:15px;flex:none}
.secit.ok svg{color:var(--up)}
.secit.ko{background:rgba(246,70,93,.13);color:var(--down)}
.secit.un{color:var(--mut)}
.pchips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 12px}
.pchips button{padding:8px 4px;border-radius:10px;background:var(--surface2);font-weight:600;font-size:13px;line-height:1.25;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pchips button span{font-size:11px;font-weight:500;color:var(--mut);white-space:nowrap}
.prow input::-webkit-inner-spin-button,.prow input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.prow input[type=number]{-moz-appearance:textfield}
.pchips button.on{border-color:var(--acc);background:rgba(171,159,242,.12)}
.prow{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:6px;margin-top:10px}
.prow input{padding:10px;font-weight:600}
.prow label{position:relative;display:block}
.prow label span{position:absolute;left:10px;top:4px;font-size:10px;color:var(--mut)}
.prow label input{padding:16px 22px 4px 10px}
.prow label em{position:absolute;right:10px;bottom:7px;font-style:normal;font-size:12px;color:var(--mut)}
.lvbar{margin-top:12px;display:grid;gap:6px;max-width:420px;margin-left:auto;margin-right:auto}
.lvtrack{height:5px;border-radius:99px;background:var(--surface2);overflow:hidden}
.lvtrack i{display:block;height:100%;background:var(--acc);border-radius:99px}
.lvinfo{font-size:12px;color:var(--mut)}
.lvrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lvfast{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--txt);cursor:pointer;flex:none}
.lvfast input{width:18px;height:18px;padding:0;accent-color:var(--acc)}
#lskip{background:rgba(46,189,133,.14);color:var(--up)}
.lvnew{font-size:11px;font-weight:700;color:var(--acc);background:rgba(171,159,242,.14);padding:2px 7px;border-radius:999px;vertical-align:middle}
.lvpos{font-size:11px;font-weight:700;color:var(--up);background:rgba(46,189,133,.12);padding:2px 7px;border-radius:999px;vertical-align:middle}
.lvcats{background:var(--bg);border-radius:14px;padding:12px 14px}
.lvmoments{display:grid;gap:8px}
.lvmoments>b{font-size:15px}
.lvm{background:var(--bg);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.lvmh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.lvmh>span:first-child{flex:1;color:var(--mut)}
.lvmh em{font-style:normal;font-weight:700;color:var(--down)}
.lvmb{font-size:14px;line-height:1.55}
.lvmb b{font-weight:600}
.lvwhy{font-size:13px;line-height:1.55;color:var(--mut)}
.lvwhy span{display:block;font-size:11px;font-weight:700;color:var(--acc);margin-bottom:2px}
.lvstat{font-size:13px;line-height:1.5;color:var(--txt);opacity:.85}
.lvv{padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700}
.lvv-excellent{background:rgba(46,189,133,.15);color:var(--up)}.lvv-bon{background:rgba(46,189,133,.1);color:var(--up)}
.lvv-imprecis{background:rgba(171,159,242,.14);color:var(--acc)}.lvv-erreur{background:rgba(246,70,93,.12);color:var(--down)}.lvv-grave{background:var(--down);color:var(--bg)}
@media (min-width:1100px){.lvbar{margin-left:0;grid-column:1/-1}}
.eqcard{padding-bottom:12px;min-width:0}
.eqstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
.eqstats div{display:flex;flex-direction:column;gap:1px;min-width:0}
.eqstats span{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eqstats b{font-size:14px;font-weight:600;white-space:nowrap}
.eqwrap{position:relative}
#eqchart{width:100%;min-width:0;touch-action:pan-y}
.eqsvg{display:block;width:100%;height:auto;overflow:visible;user-select:none;-webkit-user-select:none}
.eqgrid{stroke:rgba(255,255,255,.05);stroke-width:1}
.eqtick{fill:var(--mut);font-size:10.5px;font-family:Figtree,sans-serif}
.eqstart{stroke:rgba(142,142,154,.55);stroke-width:1;stroke-dasharray:3 4}
.eqline{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.eqline.up{stroke:var(--up)}.eqline.down{stroke:var(--down)}
.eqgap{fill:none;stroke:var(--mut);stroke-width:1.5;stroke-dasharray:2 4;opacity:.7}
.eqdot{fill:var(--txt);opacity:.55}
.eqlast{stroke:var(--surface);stroke-width:2}.eqlast.up{fill:var(--up)}.eqlast.down{fill:var(--down)}
.eqcur{stroke:var(--mut);stroke-width:1;stroke-dasharray:2 3}
.eqtip{position:absolute;top:-4px;display:none;pointer-events:none;background:var(--surface2);border-radius:10px;padding:6px 10px;font-size:12px;line-height:1.4;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.eqtip b{font-size:13px}.eqtip span:last-child{color:var(--mut)}
@media (max-width:420px){.eqstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
header{position:relative}
.fsbtn{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--mut);opacity:.6;transition:opacity .15s,background .15s}
.fsbtn[hidden]{display:none}
@media (hover:hover){.fsbtn:hover{opacity:1;background:var(--surface)}}
.fsbtn:active{opacity:1;background:var(--surface)}
@media (min-width:1100px){.fsbtn{top:24px;right:24px}}
.fcard{padding:0;margin-bottom:12px;overflow:hidden}
.fhead{width:100%;display:flex;align-items:center;gap:10px;padding:14px 16px;text-align:left}
.fhead b{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.fhead .mut{flex:1;text-align:right}
.fbadge{font-size:11px;font-weight:700;background:var(--acc);color:var(--acc-ink);border-radius:999px;padding:1px 7px}
.fchev{display:flex;color:var(--mut);transition:transform .15s}.fchev.open{transform:rotate(90deg)}
.fbody{padding:0 16px 14px}
.fbody[hidden]{display:none}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ff{display:flex;flex-direction:column;gap:4px;min-width:0}
.ff>span:first-child{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ffi{position:relative;display:block}
.ffi input{padding:9px 40px 9px 11px;font-weight:600;font-size:14px}
.ffi em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;color:var(--mut)}
.ffi input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.fchecks{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.fchecks button{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border-radius:999px;background:var(--surface2);font-size:13px;font-weight:600;color:var(--mut);border:1px solid transparent}
.fchecks button svg{width:14px;height:14px}
.fchecks button.on{color:var(--txt);border-color:var(--acc);background:rgba(171,159,242,.12)}
.ffoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.fhide{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);cursor:pointer}
.fhide input{width:17px;height:17px;padding:0;accent-color:var(--acc)}
.srchint button{color:var(--acc);font-weight:600;font-size:13px}
@media (min-width:720px){.fgrid{grid-template-columns:repeat(4,minmax(0,1fr))} #fpanel{grid-column:1/-1}}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--surface2);color:var(--txt);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:20;display:none;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.hist-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.hist-head b{font-weight:600}
.credit{font-size:12px;color:var(--mut);text-align:center;margin:16px 0 4px}

/* entraînement */
.train{max-width:980px;margin:0 auto}
@media (min-width:1100px){.train{margin:0}}
.trtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:4px 2px 14px}
.trtitle{font-size:22px;font-weight:700;letter-spacing:-.01em}
.trsub{font-size:13px;color:var(--mut);margin-top:3px;max-width:42ch}
.trback{display:flex;align-items:center;gap:12px}
.hub{display:grid;gap:10px}
.hubcard{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 54px 22px 20px;transition:border-color .15s,background .15s}
@media (hover:hover){.hubcard:hover{border-color:rgba(171,159,242,.4)}}
.hubcard:active{background:var(--surface2)}
.hubk{font-size:12px;font-weight:600;color:var(--acc);letter-spacing:.02em}
.hubtitle{font-size:19px;font-weight:700;letter-spacing:-.01em}
.hubdesc{font-size:14px;line-height:1.5;color:var(--mut);max-width:46ch}
.hubgo{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--mut);display:flex}
@media (min-width:720px){.hub{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}}

/* cas pratiques : l'énoncé */
.brief{background:var(--surface);border-radius:18px;padding:20px;display:grid;gap:16px;max-width:640px}
.briefk{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;font-weight:600;color:var(--acc);letter-spacing:.02em}
.prof{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:0}
.prof-prudent{background:rgba(46,189,133,.15);color:var(--up)}
.prof-equi{background:rgba(171,159,242,.15);color:var(--acc)}
.prof-agressif{background:rgba(246,70,93,.15);color:var(--down)}
.brieftxt{font-size:16px;line-height:1.6;text-wrap:pretty}
.briefrows{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0}
.briefnote{font-size:13px;line-height:1.55;color:var(--mut)}
.briefbtns{display:grid;grid-template-columns:auto 1fr;gap:8px}
.briefbtns .btn{white-space:nowrap;padding:15px 20px}
.ck{display:inline-flex;width:18px;height:18px;vertical-align:middle}.ck svg{width:18px;height:18px}
.ck.ok{color:var(--up)}.ck.ko{color:var(--down)}

/* cas pratiques : l'appli en version mission */
#msn{position:fixed;inset:0;background:var(--bg);z-index:12;overflow-y:auto;display:none;padding-bottom:90px}
#msn.open{display:block}
.mbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(29,26,51,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(171,159,242,.2)}
.mq{display:flex;align-items:center;gap:2px;font-size:14px;font-weight:600;color:var(--acc);margin-left:-6px;flex:none}
.mlab{display:flex;flex-direction:column;min-width:0;font-size:12px;color:var(--mut);line-height:1.3}
.mlab b{font-size:14px;color:var(--txt);font-weight:600}
.mlab span,.mlab b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar .chip{flex:none;background:rgba(171,159,242,.14);color:var(--acc)}
.mbriefbox{margin:12px 16px 0;padding:16px;border-radius:16px;background:var(--surface);font-size:14px;line-height:1.55;display:grid;gap:10px}
.mbriefbox[hidden]{display:none}
.mbriefbox .briefrows{padding:4px 0}
.mhead[hidden]{display:none}
.dot.idle{background:var(--mut)}
.mtotal{font-size:42px;font-weight:700;letter-spacing:-.02em;margin:8px 0 6px}
.mcash{margin-top:6px;font-size:13px;color:var(--mut)}
#mview{padding-top:12px}
.mhead+#mview{padding-top:0}
.msp{font-size:30px;font-weight:700;letter-spacing:-.01em;margin-top:16px}
.msc{font-size:14px;font-weight:600;margin-top:2px}
.mfresh{font-size:12px;color:var(--mut)}
.mchartwrap{position:relative;margin:0 -4px 6px}
#mchart{height:280px}
.mquote{font-size:13px;color:var(--mut);line-height:1.6;margin-bottom:12px;min-height:20px}
.mfh{font-size:12px;color:var(--mut);margin-top:6px}
.ksep{height:1px;background:var(--line);margin:8px 0}
.reschart{display:grid;gap:8px}
#mrchart{height:220px;border-radius:12px;overflow:hidden}
.result{margin-top:12px;background:var(--surface);border-radius:18px;padding:18px;display:grid;gap:16px}
.rescore{display:flex;align-items:center;gap:16px}
.ring{width:110px;height:110px;flex:none}
.resgrade{font-size:22px;font-weight:700}
.resout{background:var(--surface2);border-radius:14px;padding:14px;display:grid;gap:6px}
.resline{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--mut)}
.resline b{font-size:22px;font-weight:700}
.ressub{font-size:14px;line-height:1.5}
.respills{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.respills span{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.respills svg{width:14px;height:14px}
.okp{background:rgba(46,189,133,.14);color:var(--up)}.kop{background:rgba(246,70,93,.14);color:var(--down)}
.crit{display:grid;gap:8px}
.critrow{padding:12px 14px;border-radius:12px;background:var(--bg)}

<body>

  <button id="fsbtn" class="fsbtn" aria-label="Plein écran" title="Plein écran" hidden></button>

<main id="view"></main>
<nav>
  <div class="brand">CryptoSimu</div>
  <button data-t="marche" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-8"/><path d="M15 8h5v5"/></svg>Marché</button>
  <button data-t="meme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3 4 4.5 4 8.5a4 4 0 0 1-8 0c0-1.6.7-2.8 1.5-3.7.2 1.4 1 2.2 2 2.2 0-2.5-1-4.5.5-7z"/><path d="M8 20h8"/></svg>Memecoins</button>
  <button data-t="porte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18"/><path d="M16 15h2"/><path d="M7 6V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1"/></svg>Portefeuille</button>
  <button data-t="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Entraînement</button>
  <button data-t="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historique</button>
</nav>
<div id="sheet"></div>
<div id="msn"></div>
<div id="toast"></div>
<script src="https://unpkg.com/@solana/web3.js@1/lib/index.iife.min.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
'use strict';
const APP_VERSION = '2026.10.21-7';
const START = 100;
const BN_FEE = 0.001;      // 0,1 % frais spot Binance (taux standard)
const BN_MIN = 5;          // ordre minimum 5 USDT sur Binance
const SOL_BASE_FEE = 0.000005;
// Cryptos de l'onglet Marché (paires USDT de Binance). Pas de memecoins ici (ils sont dans leur onglet), sauf DOGE et PEPE.
// Celles que Binance ne cote pas ou plus sont masquées automatiquement.
const MAJORS = ['BTC','ETH','SOL','BNB','XRP','DOGE','ADA','TRX','AVAX','LINK','DOT','SUI','LTC','BCH','NEAR','APT','UNI','XLM','ATOM',
  'ETC','FIL','ICP','HBAR','ARB','OP','INJ','AAVE','RENDER','FET','TAO','ALGO','VET','WLD','ONDO',
  'PEPE','SAND','MANA','CRV'];
const DS = 'https://api.dexscreener.com';
let LOGO = {};
try { const c = JSON.parse(localStorage.getItem('logos_v2')); if (c && Date.now() - c.t < 7*86400e3) LOGO = c.logos || {}; } catch(e){}
// Logos : les 250 plus grosses cryptos de CoinGecko, associées par symbole (la plus grosse gagne en cas de doublon)
async function loadLogos(){
  if (MAJORS.filter(m => LOGO[m]).length >= MAJORS.length * 0.8) return;
  try {
    const r = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=1');
    const arr = await r.json(), want = new Set(MAJORS);
    for (const c of arr){ const sy = String(c.symbol || '').toUpperCase(); if (want.has(sy) && !LOGO[sy] && c.image) LOGO[sy] = c.image; }
    try { localStorage.setItem('logos_v2', JSON.stringify({ t: Date.now(), logos: LOGO })); } catch(e){}
    for (const k in S.pos){ const {kind,id} = parse(k); if (kind === 'bn' && LOGO[id]) S.pos[k].img = LOGO[id]; }
    if (tab === 'marche' && !sheetKey) renderList();
  } catch(e){}
}
const KEY = 'centballes_v1';

const BN = {}, DEX = {}, CH = {}, SEEN = {};
let S = load() || fresh();
delete S.settings.tf;
delete S.train; delete S.cases;
const DEFAULT_TF = '1h';
let curTf = DEFAULT_TF;      // durée du graphique, propre à la fiche ouverte
delete S.settings.plat;
if (!(S.settings.prio >= 0.0001)) S.settings.prio = 0.0001;
// Préréglages SL / TP (comme sur les terminaux memecoins) : posés automatiquement à l'achat, en % du prix d'achat frais compris
const DEF_PRESETS = [{ n: 'Serré', sl: 5, tp: 10 }, { n: 'Normal', sl: 10, tp: 20 }, { n: 'Large', sl: 25, tp: 60 }];
if (!Array.isArray(S.settings.presets) || S.settings.presets.length !== 3) S.settings.presets = JSON.parse(JSON.stringify(DEF_PRESETS));
if (!(S.settings.preset >= -1 && S.settings.preset <= 2)) S.settings.preset = -1;
let tab = 'marche', memeTab = 'top', sheetKey = null;
const inflight = new Set();   // tokens avec une transaction en attente
const feed = { top: [], new: [], search: [] };

/* ---------- utilitaires ---------- */
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SUB = '₀₁₂₃₄₅₆₇₈₉';
function fp(x){
  if (x == null || !isFinite(x)) return '-';
  const a = Math.abs(x);
  if (a === 0) return '0';
  if (a < 0.0001){
    const z = -Math.floor(Math.log10(a)) - 1;
    const d = Math.round(a * Math.pow(10, z + 4)).toString().slice(0, 4).replace(/0+$/, '') || '0';
    return (x < 0 ? '-' : '') + '0,0' + String(z).split('').map(c => SUB[c]).join('') + d;
  }
  if (a >= 1000) return x.toLocaleString('fr-FR',{maximumFractionDigits:2});
  if (a >= 1) return x.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:4});
  return x.toLocaleString('fr-FR',{maximumSignificantDigits:4});
}
const money = x => (x == null || !isFinite(x)) ? '-' : x.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' $';
const nf2 = (x, d) => x.toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = x => (x == null || !isFinite(x)) ? '-' : (x >= 0 ? '+' : '') + nf2(x, 2) + ' %';
const cls = x => x >= 0 ? 'up' : 'down';
function big(x){
  if (x == null || !isFinite(x)) return '-';
  if (x >= 1e9) return nf2(x/1e9, 2)+' Md $';
  if (x >= 1e6) return nf2(x/1e6, 2)+' M $';
  if (x >= 1e3) return nf2(x/1e3, 1)+' k $';
  return nf2(x, 0)+' $';
}
function age(ts){
  if (!ts) return '';
  const m = (Date.now()-ts)/60000;
  if (m < 60) return Math.floor(m)+' min';
  if (m < 1440) return Math.floor(m/60)+' h';
  return Math.floor(m/1440)+' j';
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 2600);
}
async function j(url){
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
function parse(key){ const i = key.indexOf(':'); return { kind: key.slice(0,i), id: key.slice(i+1) }; }

/* ---------- sauvegarde ---------- */
function fresh(){ const now = Date.now(); return { cash: START, pos: {}, hist: [], start: now, eq: [{ t: now, v: START }], settings: { prio: 0.001, slip: 10 } }; }
function load(){
  try { const r = localStorage.getItem(KEY); if (!r) return null; const s = JSON.parse(r); for (const k in s.pos) delete s.pos[k].pending; return s; }
  catch(e){ return null; }
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

/* ---------- Binance (WebSocket temps réel + secours REST) ---------- */
// Certains réseaux mobiles bloquent le port 9443 : on alterne entre deux
// adresses WebSocket, et si rien n'arrive, on interroge l'API REST chaque seconde.
const BN_WS = ['wss://stream.binance.com:9443', 'wss://data-stream.binance.vision'];
const BN_REST = ['https://api.binance.com', 'https://data-api.binance.vision'];
let ws, wsDelay = 1000, wsHost = 0, bnWsLast = 0, bnRestBusy = false, bnRestLast = 0;
function setBN(sym, d){
  BN[sym] = d;
  pushChart('bn:'+sym, d.last);
  checkTriggers('bn:'+sym);
}
function connectBN(){
  const streams = MAJORS.map(s => s.toLowerCase()+'usdt@ticker').join('/');
  ws = new WebSocket(BN_WS[wsHost % BN_WS.length]+'/stream?streams='+streams);
  ws.onmessage = e => {
    const d = JSON.parse(e.data).data;
    if (!d || !d.s) return;
    if (!bnWsLast){ $('#dot').classList.add('on'); $('#stat').textContent = 'Temps réel'; }
    bnWsLast = Date.now(); wsDelay = 1000;
    setBN(d.s.replace(/USDT$/,''), { last: +d.c, bid: +d.b, ask: +d.a, pct: +d.P, vol: +d.q });
  };
  ws.onclose = () => {
    bnWsLast = 0; wsHost++;
    setTimeout(connectBN, wsDelay); wsDelay = Math.min(wsDelay*2, 30000);
  };
  ws.onerror = () => { try { ws.close(); } catch(e){} };
}
async function bnGet(path){
  for (const h of BN_REST){ try { return await j(h+path); } catch(e){} }
  throw new Error('Binance injoignable');
}
async function pollBN(){
  if (Date.now() - bnWsLast < 3000 || bnRestBusy || document.hidden || Date.now() - bnRestLast < 2000) return;
  bnRestBusy = true; bnRestLast = Date.now();
  try {
    const q = encodeURIComponent(JSON.stringify(MAJORS.map(s => s+'USDT')));
    let t24, book;
    try { [t24, book] = await Promise.all([bnGet('/api/v3/ticker/24hr?symbols='+q), bnGet('/api/v3/ticker/bookTicker?symbols='+q)]); }
    catch(e){
      const want = new Set(MAJORS.map(s => s+'USDT'));
      [t24, book] = await Promise.all([bnGet('/api/v3/ticker/24hr'), bnGet('/api/v3/ticker/bookTicker')]);
      t24 = t24.filter(t => want.has(t.symbol)); book = book.filter(b => want.has(b.symbol));
    }
    const bk = {}; for (const b of book) bk[b.symbol] = b;
    for (const t of t24){
      const b = bk[t.symbol] || {};
      setBN(t.symbol.replace(/USDT$/,''), { last: +t.lastPrice, bid: +(b.bidPrice || t.lastPrice), ask: +(b.askPrice || t.lastPrice), pct: +t.priceChangePercent, vol: +t.quoteVolume });
    }
    if (Date.now() - bnWsLast >= 3000){ $('#dot').classList.add('on'); $('#stat').textContent = 'Temps réel'; }
  } catch(e){
    if (Date.now() - bnWsLast >= 3000){ $('#dot').classList.remove('on'); $('#stat').textContent = 'Binance injoignable'; }
  }
  bnRestBusy = false;
}

/* ---------- DexScreener (memecoins Solana) ---------- */
const liq = p => (p && p.liquidity && p.liquidity.usd) || 0;
/* Choix du pool de référence d'un token.
   Un token peut avoir plusieurs pools, dont de minuscules pools mal pricés
   (ex. 160 $ de liquidité à un prix 50x trop bas). DexScreener ne renvoie pas
   toujours tous les pools d'un token dans une réponse groupée : sans précaution,
   l'app pouvait basculer sur un mauvais pool et afficher un faux prix.
   Règles : on prend le pool le plus liquide (puis le plus actif), et une fois
   choisi on y reste, sauf si un autre pool devient nettement plus liquide. */
let PAIR = {};                   // token -> adresse du pool retenu (gardé entre deux sessions)
try { PAIR = JSON.parse(localStorage.getItem('pairs_v1')) || {}; } catch(e){}
const savePairs = () => { try { localStorage.setItem('pairs_v1', JSON.stringify(PAIR)); } catch(e){} };
const txns1h = p => p && p.txns && p.txns.h1 ? (p.txns.h1.buys || 0) + (p.txns.h1.sells || 0) : 0;
const better = (x, y) => liq(x) !== liq(y) ? liq(x) > liq(y) : txns1h(x) > txns1h(y);
function pickPair(a, cands){
  const best = cands.reduce((m, p) => better(p, m) ? p : m);
  const curAddr = PAIR[a], cur = curAddr && cands.find(p => p.pairAddress === curAddr);
  if (cur) return liq(best) > 3 * liq(cur) + 1000 ? best : cur;
  // le pool retenu manque dans cette réponse : on garde l'ancien plutôt qu'un pool bien moins liquide
  if (curAddr && DEX[a] && liq(best) < liq(DEX[a]) / 2) return null;
  return best;
}
async function fetchTokens(addrs){
  const out = {}, groups = {};
  for (let i = 0; i < addrs.length; i += 15){
    const arr = await j(`${DS}/tokens/v1/solana/${addrs.slice(i,i+15).join(',')}?_=${Date.now()}`);
    for (const p of arr || []){
      if (p.chainId !== 'solana' || !p.baseToken || !p.pairAddress) continue;
      (groups[p.baseToken.address] || (groups[p.baseToken.address] = [])).push(p);
    }
  }
  // Token jamais vu : on demande la liste complète de ses pools avant de choisir
  for (const a in groups){
    if (PAIR[a]) continue;
    try {
      const all = await j(`${DS}/token-pairs/v1/solana/${a}`);
      const ok = (all || []).filter(p => p.chainId === 'solana' && p.pairAddress && p.baseToken && p.baseToken.address === a);
      if (ok.length) groups[a] = ok;
    } catch(e){}
  }
  let changed = false;
  for (const a in groups){
    const p = pickPair(a, groups[a]);
    if (p && PAIR[a] !== p.pairAddress) changed = true;
    if (p){ PAIR[a] = p.pairAddress; out[a] = p; }
    else if (DEX[a]) out[a] = DEX[a];
  }
  if (changed) savePairs();
  const now = Date.now();
  for (const a in out){
    const old = DEX[a], sn = SEEN[a] || (SEEN[a] = { got: now, moved: now });
    sn.got = now;
    if (!PF[a] && (!old || old.priceUsd !== out[a].priceUsd)) sn.moved = now;
    DEX[a] = out[a];
    if (!pfPrice(a) && (!old || old.priceUsd !== out[a].priceUsd)) addTick(a, +out[a].priceUsd, 0);
    checkTriggers('sol:'+a);
  }
  return out;
}

/* ---------- pump.fun temps réel (RPC Solana, chaque trade) ---------- */
// On s'abonne directement au compte de la bonding curve : chaque trade
// modifie ses réserves et le RPC nous pousse la nouvelle valeur.
const PUMP_PROG = '6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P';
const RPC_HTTP = 'https://api.mainnet-beta.solana.com', RPC_WS = 'wss://api.mainnet-beta.solana.com';
const PF = {}, rpcPending = {}, subToMint = {};
let rws = null, rpcId = 1;
function curveAddr(mint){
  const W = window.solanaWeb3; if (!W) return null;
  try {
    return W.PublicKey.findProgramAddressSync(
      [new TextEncoder().encode('bonding-curve'), new W.PublicKey(mint).toBytes()],
      new W.PublicKey(PUMP_PROG))[0].toBase58();
  } catch(e){ return null; }
}
function decodeCurve(b64){
  const bin = atob(b64); if (bin.length < 49) return null;
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  const dv = new DataView(u.buffer);
  return { vTok: Number(dv.getBigUint64(8, true)), vSol: Number(dv.getBigUint64(16, true)), complete: u[48] === 1 };
}
function applyCurve(mint, value){
  const c = PF[mint]; if (!c || !value || !value.data) return;
  const d = decodeCurve(value.data[0]); if (!d) return;
  const now = Date.now(), changed = d.vSol !== c.vSol || d.vTok !== c.vTok;
  const vol = c.vSol && BN.SOL ? Math.abs(d.vSol - c.vSol)/1e9 * BN.SOL.last : 0;
  Object.assign(c, d, { t: now });
  const sn = SEEN[mint] || (SEEN[mint] = { got: now, moved: now });
  sn.got = now; if (changed) sn.moved = now;
  const pr = pfPrice(mint);
  if (pr){ if (changed) addTick(mint, pr, vol); checkTriggers('sol:'+mint); }
}
function rpcSend(method, params, mint){
  if (!rws || rws.readyState !== 1) return;
  const id = rpcId++; if (mint) rpcPending[id] = { method, mint };
  rws.send(JSON.stringify({ jsonrpc: '2.0', id, method, params }));
}
function rpcSubscribe(mint){
  const c = PF[mint]; if (!c || c.sub != null) return;
  rpcSend('accountSubscribe', [c.curve, { encoding: 'base64', commitment: 'processed' }], mint);
}
const RPC_WSS = [RPC_WS, 'wss://solana-rpc.publicnode.com'];
let wsI = 0;
function connectRPC(){
  const url = RPC_WSS[wsI % RPC_WSS.length]; let opened = false;
  rws = new WebSocket(url);
  rws.addEventListener('open', () => { opened = true; });
  rws.addEventListener('close', () => { if (!opened) wsI++; });   // jamais connecté : on essaie l'autre serveur
  rws.onopen = () => { for (const k in subToMint) delete subToMint[k]; for (const m in PF){ PF[m].sub = null; rpcSubscribe(m); } };
  rws.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.id != null && rpcPending[d.id]){
      const r = rpcPending[d.id]; delete rpcPending[d.id];
      if (r.method === 'accountSubscribe' && PF[r.mint] && d.result != null){ PF[r.mint].sub = d.result; subToMint[d.result] = r.mint; }
      return;
    }
    if (d.method === 'accountNotification'){
      const m = subToMint[d.params.subscription];
      if (m) applyCurve(m, d.params.result.value);
    }
  };
  rws.onclose = () => setTimeout(connectRPC, 2000);
  rws.onerror = () => { try { rws.close(); } catch(e){} };
}
async function watchCurve(mint){
  if (PF[mint]) return;
  const curve = curveAddr(mint); if (!curve) return;
  PF[mint] = { curve, sub: null };
  rpcSubscribe(mint);
  try {
    const r = await fetch(RPC_HTTP, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'getAccountInfo', params: [curve, { encoding: 'base64', commitment: 'processed' }] }) });
    const jr = await r.json();
    applyCurve(mint, jr.result && jr.result.value);
  } catch(e){}
}
function unwatchCurve(mint){
  const c = PF[mint]; if (!c) return;
  if (c.sub != null){ rpcSend('accountUnsubscribe', [c.sub]); delete subToMint[c.sub]; }
  delete PF[mint];
}
function syncCurves(){
  const want = new Set();
  const add = a => { const p = DEX[a]; if (p && p.dexId === 'pumpfun' && want.size < 30) want.add(a); };
  if (sheetKey && sheetKey.startsWith('sol:')) add(parse(sheetKey).id);
  for (const k in S.pos){ const {kind,id} = parse(k); if (kind === 'sol') add(id); }
  if (tab === 'meme') memeAddrs().forEach(add);
  for (const m in PF) if (!want.has(m)) unwatchCurve(m);
  want.forEach(m => watchCurve(m));
}
// Prix live depuis la curve (null si pas de données ou token migré)
function pfPrice(mint){
  const c = PF[mint], sol = BN.SOL && BN.SOL.last;
  if (!c || !c.vTok || !c.vSol || c.complete || !sol) return null;
  return (c.vSol/1e9) / (c.vTok/1e6) * sol;
}
const dexPrice = p => pfPrice(p.baseToken.address) ?? +p.priceUsd;

/* ---------- images des memecoins ---------- */
// DexScreener ne donne une image que si l'équipe du token a rempli sa fiche.
// Sinon on lit les métadonnées du token directement sur Solana (Metaplex ou
// Token-2022), qui pointent vers un fichier JSON contenant l'image.
const META_PROG = 'metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s';
let IMG = {};
try { IMG = JSON.parse(localStorage.getItem('memeimg_v1')) || {}; } catch(e){}
const imgBusy = new Set(), imgFail = {};
const b64bytes = b64 => { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
const ipfs = u => String(u || '').trim().replace(/^ipfs:\/\//, 'https://ipfs.io/ipfs/');
function readStr(u, o){
  const n = (u[o] | (u[o+1] << 8) | (u[o+2] << 16) | (u[o+3] << 24)) >>> 0;
  return [new TextDecoder().decode(u.slice(o+4, o+4+n)).replace(/\0/g, '').trim(), o+4+n];
}
// toutes les requêtes Solana passent par rpcSafe : serveur principal, puis serveur de secours
const rpc = (method, params) => rpcSafe(method, params);
async function metaUri(mint){
  const W = window.solanaWeb3;
  if (W){
    const prog = new W.PublicKey(META_PROG);
    const pda = W.PublicKey.findProgramAddressSync([new TextEncoder().encode('metadata'), prog.toBytes(), new W.PublicKey(mint).toBytes()], prog)[0].toBase58();
    const r = await rpc('getAccountInfo', [pda, { encoding: 'base64' }]);
    if (r && r.value){
      const u = b64bytes(r.value.data[0]);
      let o = 65, name, sym, uri;           // 1 octet de type + 2 clés publiques
      [name, o] = readStr(u, o); [sym, o] = readStr(u, o); [uri] = readStr(u, o);
      if (uri) return uri;
    }
  }
  const r = await rpc('getAccountInfo', [mint, { encoding: 'jsonParsed' }]);
  const info = r && r.value && r.value.data && r.value.data.parsed && r.value.data.parsed.info;
  const tm = info && info.extensions && info.extensions.find(e => e.extension === 'tokenMetadata');
  return (tm && tm.state && tm.state.uri) || '';
}
async function fetchImg(mint){
  if (mint in IMG || imgBusy.has(mint) || imgBusy.size >= 3 || Date.now() - (imgFail[mint] || 0) < 60000) return;

  } catch(e){ imgFail[mint] = Date.now(); }

/* ---------- sécurité des memecoins ----------
   Tout est lu directement sur Solana, sans service tiers :
   - mint et gel : autorités du compte du token (vide = révoquée).
   - liquidité brûlée : le pool garde en mémoire le nombre de jetons LP émis
     (lp_amount sur Raydium AMM v4, lp_supply sur Raydium CPMM et PumpSwap).
     Les LP détruits ne sont plus dans l'offre réelle du jeton LP : l'écart
     donne la part brûlée. Sur la bonding curve pump.fun il n'y a pas de LP,
     la liquidité est bloquée par le programme. Ailleurs : non vérifiable.
   - top 10 : plus gros portefeuilles, hors comptes du pool. Seulement quand
     on sait reconnaître les comptes du pool, sinon rien n'est affiché. */
const AMM_V4 = '675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8', AMM_CPMM = 'CPMMoo8L3F4NbTegBCKVNunggL7H1ZpdTHKxQB5qKP1C', AMM_PSWAP = 'pAMMBay6oceH9fJKBRHGP5D4bD4sWpmSwMn52FMfXEA';
const SEC = {}, secBusy = new Set();
const pk58 = (u, o) => window.solanaWeb3 ? new window.solanaWeb3.PublicKey(u.slice(o, o + 32)).toBase58() : null;
const rdU64 = (u, o) => new DataView(u.buffer, u.byteOffset).getBigUint64(o, true);
// Plusieurs serveurs Solana gratuits : si l'un refuse (limite atteinte, blocage), on passe au suivant.
// Si aucun ne répond, on arrête de les solliciter pendant 2 minutes.
const SEC_RPCS = [RPC_HTTP, 'https://solana-rpc.publicnode.com', 'https://solana.drpc.org', 'https://solana-mainnet.g.alchemy.com/v2/demo'];
let secRpcI = 0, rpcDeadUntil = 0;
// état de chaque serveur Solana à la dernière tentative (affiché dans Portefeuille et dans « Sources »)
const rpcDiag = {};
const rpcName = u => u.includes('mainnet-beta') ? 'Solana officiel' : u.includes('publicnode') ? 'PublicNode' : u.includes('drpc') ? 'dRPC' : u.includes('alchemy') ? 'Alchemy (démo)' : u;
async function rpcSafe(method, params){
  if (Date.now() < rpcDeadUntil) throw new Error('RPC indisponible');
  let reached = false, why = '';
  for (let k = 0; k < SEC_RPCS.length; k++){
    const url = SEC_RPCS[(secRpcI + k) % SEC_RPCS.length], ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 6000);
    try {
      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: ctl.signal, body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }) });
      clearTimeout(tm); reached = true;
      const jr = r.ok ? await r.json() : null;
      if (jr && !jr.error && 'result' in jr){ secRpcI = (secRpcI + k) % SEC_RPCS.length; rpcDiag[rpcName(url)] = 'OK'; return jr.result; }
      why = jr && jr.error ? jr.error.message : 'HTTP ' + r.status;
      rpcDiag[rpcName(url)] = jr && jr.error ? 'refus (' + String(jr.error.message).slice(0, 40) + ')' : 'HTTP ' + r.status;
    } catch(e){ clearTimeout(tm); rpcDiag[rpcName(url)] = e.name === 'AbortError' ? 'délai dépassé' : 'bloqué avant d\'arriver'; }
  }
  // Un serveur qui RÉPOND par un refus (méthode lourde, limite atteinte) n'est pas en panne : on ne coupe rien.
  // On ne met Solana en pause (30 s) que si aucun serveur n'a répondu du tout.
  if (!reached) rpcDeadUntil = Date.now() + 30000;
  throw new Error(reached ? 'refusé : ' + why : 'RPC indisponible');
}
const rpcDiagTxt = () => Object.entries(rpcDiag).map(([k, v]) => `${k} : ${v}`).join(' · ');
// Sources de repli, gratuites et sans clé :
// - Jupiter (api.jup.ag/tokens/v2/search) : mint, gel, part des plus gros détenteurs. 0,5 requête/s sans clé.
// - RugCheck (report/summary) : pourcentage de LP verrouillée ou brûlée.
// - GeckoTerminal : mint, gel, top 10, LP verrouillée (mise à jour quotidienne).
let jupNext = 0;
async function jsonGet(url, timeout = 8000){
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), timeout);
  try {
    const r = await fetch(url, { signal: ctl.signal, cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } catch(e){ throw new Error(e.name === 'AbortError' ? 'délai dépassé' : e.message === 'Failed to fetch' ? 'bloqué' : e.message); }
  finally { clearTimeout(tm); }
}
async function jupAudit(mint){
  const now = Date.now(), at = Math.max(now, jupNext); jupNext = at + 2100;
  if (at > now) await sleep(at - now);
  const arr = await jsonGet('https://api.jup.ag/tokens/v2/search?query=' + mint);
  const x = Array.isArray(arr) && arr.find(o => o.id === mint);
  if (!x) throw new Error('token inconnu');
  return x;
}
async function loadSec(p){
  const mint = p.baseToken.address, old = SEC[mint];
  if (secBusy.has(mint)) return;
  if (old && Date.now() - old.t < (old.partial ? 30000 : 300000)) return;
  secBusy.add(mint);
  const s = { t: Date.now(), mint: null, freeze: null, lp: null, top10: null, lpSrc: null, topSrc: null, dev: null, holders: null, organic: null, organicLbl: null, partial: false, diag: {} };
  if (old) for (const k of ['mint', 'freeze', 'lp', 'top10', 'lpSrc', 'topSrc', 'dev', 'holders', 'organic', 'organicLbl']) if (old[k] != null) s[k] = old[k];
  const D = s.diag, need = !old || old.partial, curve = p.dexId === 'pumpfun';
  const note = (k, pr) => pr.then(v => { D[k] = 'OK'; return v; }, e => { const m = String(e && e.message || ''); D[k] = /fetch|network|load failed/i.test(m) ? 'bloqué' : e instanceof TypeError ? 'réponse inattendue' : (m || 'erreur'); return null; });
  // les sources de repli partent tout de suite, en parallèle de Solana
  const jup = need ? note('Jupiter', jupAudit(mint)) : null;
  const rug = need && !curve ? note('RugCheck', jsonGet(`https://api.rugcheck.xyz/v1/tokens/${mint}/report/summary`)) : null;
  const gtInfo = need ? note('GeckoTerminal', gtFetch(`${GT}/tokens/${mint}/info`, { tries: 1, timeout: 8000 }).then(d => d.data.attributes)) : null;
  const gtPool = need && !curve ? note('GeckoTerminal pool', gtFetch(`${GT}/pools/${p.pairAddress}`, { tries: 1, timeout: 8000 }).then(d => d.data.attributes)) : null;
  let supply = 0, vaults = null, owners = null;
  // 1. mint et gel, lus sur Solana
  try {
    const r = await rpcSafe('getAccountInfo', [mint, { encoding: 'jsonParsed' }]);
    const info = r && r.value && r.value.data && r.value.data.parsed && r.value.data.parsed.info;
    if (info){ s.mint = !info.mintAuthority; s.freeze = !info.freezeAuthority; supply = +info.supply; }
    D.Solana = 'OK';
  } catch(e){ D.Solana = 'pas de réponse (' + rpcDiagTxt() + ')'; }
  // 2. liquidité brûlée, et comptes du pool à exclure du top 10
  try {
    if (curve){
      s.lp = 'curve'; s.lpSrc = null; const c = curveAddr(mint); if (c) owners = [c];
    } else if (D.Solana === 'OK'){
      const pr = await rpcSafe('getAccountInfo', [p.pairAddress, { encoding: 'base64' }]);
      const v = pr && pr.value, prog = v && v.owner;
      const L = prog === AMM_V4 ? { lp: 464, n: 720, va: [336, 368] } : prog === AMM_CPMM ? { lp: 136, n: 333, va: [72, 104] } : prog === AMM_PSWAP ? { lp: 107, n: 203, va: [139, 171] } : null;
      if (L && window.solanaWeb3){
        const u = b64bytes(v.data[0]);
        vaults = L.va.map(o => pk58(u, o));
        const issued = rdU64(u, L.n), ls = await rpcSafe('getTokenSupply', [pk58(u, L.lp)]);
        if (issued > 0n && ls && ls.value){ s.lp = Math.min(1, Math.max(0, 1 - Number(BigInt(ls.value.amount))/Number(issued))); s.lpSrc = null; }
      }
    }
  } catch(e){}
  // 3. top 10, hors pool
  try {
    if (D.Solana === 'OK' && (vaults || owners)){
      if (!supply){ const ts = await rpcSafe('getTokenSupply', [mint]); supply = ts && ts.value ? +ts.value.amount : 0; }
      if (supply > 0){
        const la = await rpcSafe('getTokenLargestAccounts', [mint]);
        let list = (la && la.value) || [];
        if (vaults) list = list.filter(x => !vaults.includes(x.address));
        if (owners && list.length){
          const ma = await rpcSafe('getMultipleAccounts', [list.map(x => x.address), { encoding: 'jsonParsed' }]);
          const vals = (ma && ma.value) || [];
          list = list.filter((x, i) => { const o = vals[i] && vals[i].data && vals[i].data.parsed && vals[i].data.parsed.info.owner; return !owners.includes(o); });
        }
        if (la && la.value){ s.top10 = list.slice(0, 10).reduce((x, y) => x + Number(y.amount), 0)/supply*100; s.topSrc = null; }
      }
    }
  } catch(e){}
  // 4. ce qui manque encore : sources de repli
  const num = v => v != null && v !== '' && isFinite(+v) ? +v : null;
  const jt = jup && await jup, j = jt && jt.audit;
  if (jt){
    const got = [];

    if (num(jt.organicScore) != null){ s.organic = num(jt.organicScore); s.organicLbl = jt.organicScoreLabel || null; got.push('volume organique'); }
    if (j && num(j.devBalancePercentage) != null){ s.dev = num(j.devBalancePercentage); got.push('part du créateur'); }

    if (s.freeze == null && typeof j.freezeAuthorityDisabled === 'boolean') s.freeze = j.freezeAuthorityDisabled;
  }
  const rc = rug && await rug;
  if (s.lp == null && rc && num(rc.lpLockedPct) != null){ s.lp = Math.min(1, Math.max(0, num(rc.lpLockedPct)/100)); s.lpSrc = 'RugCheck'; }
  const a = gtInfo && await gtInfo;
  if (a){
    const rev = v => v == null ? null : String(v).toLowerCase() === 'no';
    if (s.mint == null) s.mint = rev(a.mint_authority);

    const got = [];

}

/* ---------- contrôle de cohérence des prix ----------
   But : repérer un MAUVAIS prix (mauvais pool, donnée aberrante), pas un vrai
   mouvement de marché. On compare donc deux sources au même instant :
   le prix utilisé par l'app et le prix agrégé de GeckoTerminal pour ce token.
   Un vrai rug fait chuter les deux ensemble : pas d'alerte.
   - écart inférieur à 3x : rien ne change ;
   - écart supérieur à 3x : avertissement, il faut appuyer une 2e fois pour valider ;
   - GeckoTerminal ne répond pas : la transaction part normalement.
   Les ventes automatiques (stop loss, take profit) ne sont jamais retardées. */
const SUSPECT_RATIO = 3, CONFIRM_MS = 15000, confirmUntil = {};
async function refPrice(id){
  if (gtBusyFor() > 1500) return null;      // file d'attente chargée : on ne retarde pas le trade
  try {
    const d = await gtFetch(`https://api.geckoterminal.com/api/v2/simple/networks/solana/token_price/${id}`, { tries: 1, timeout: 2500 });
    const tp = d.data.attributes.token_prices || {};
    const vals = Object.values(tp), v = +(tp[id] ?? tp[id.toLowerCase()] ?? (vals.length === 1 ? vals[0] : NaN));
    return v > 0 ? v : null;
  } catch(e){ return null; }
}
// Renvoie true si on peut continuer, false si on attend la confirmation du joueur
async function priceCheck(key, id, p, verb){
  if (confirmUntil[key] > Date.now()){ delete confirmUntil[key]; return true; }
  const ref = await refPrice(id), mine = dexPrice(p);
  if (!ref || !mine) return true;
  const r = mine / ref;
  if (r <= SUSPECT_RATIO && r >= 1/SUSPECT_RATIO) return true;
  confirmUntil[key] = Date.now() + CONFIRM_MS;
  toast(`Prix douteux : ${fp(mine)} ici, ${fp(ref)} sur GeckoTerminal. Appuie à nouveau sur ${verb} dans les 15 s pour confirmer.`);
  return false;
}

/* ---------- simulation d'exécution ---------- */
// Frais de pool, d'après la doc officielle de pump.fun (pump.fun/docs/fees) :
// bonding curve 1,25 % ; PumpSwap dégressif selon la market cap en SOL (1,25 % au début, 0,30 % au-delà de 98 240 SOL).
// Raydium et la plupart des autres pools : 0,25 %.
const PSWAP_TIERS = [[420, 0.0125], [1470, 0.012], [2460, 0.0115], [3440, 0.011], [4420, 0.0105], [9820, 0.01], [14740, 0.0095], [19650, 0.009], [24560, 0.0085], [29470, 0.008], [34380, 0.0075],
  [39300, 0.007], [44210, 0.0065], [49120, 0.006], [54030, 0.0055], [58940, 0.00525], [63860, 0.005], [68770, 0.00475], [73681, 0.0045], [78590, 0.00425], [83500, 0.004], [88400, 0.00375], [93330, 0.0035], [98240, 0.00325]];
function poolFee(p){
  if (p.dexId === 'pumpfun') return 0.0125;
  if (p.dexId === 'pumpswap'){
    const sol = BN.SOL && BN.SOL.last, mc = sol ? (+p.priceUsd)*1e9/sol : 0;
    if (!mc) return 0.0125;
    for (const [lim, f] of PSWAP_TIERS) if (mc < lim) return f;
    return 0.003;
  }
  return 0.0025;
}
const PRIO_MIN = 0.0001;   // pas de priority fee à 0, comme sur les vraies plateformes
const CU_LIMIT = 200000;   // unités de calcul réservées par un swap (limite par défaut de Solana)
// Frais de plateforme fixes sur les memecoins (taux de base d'Axiom), identiques pour tous les joueurs
const PLAT_FEE = 0.01;
const platFee = () => PLAT_FEE;

/* ---------- confirmation des transactions Solana ----------
   Chaque bloc (environ 400 ms), un validateur choisit les transactions qui
   paient le plus. On lit sur le vrai réseau, pour le pool du token, le
   prix minimal payé pour entrer dans chacun des ~150 derniers blocs.
   Ta priority fee dépasse ce minimum dans X % des blocs : c'est ta chance
   d'entrer à chaque bloc. Au bout de 150 blocs sans succès, le blockhash
   expire et la transaction est abandonnée (aucun frais payé). */
const SLOT_MS = 400, MAX_SLOTS = 150, feeCache = {};
// Dernière mesure du réseau gardée en mémoire : si Solana ne répond pas, on s'en sert (en le disant) plutôt que de supposer un réseau vide
let lastNet = null;
try { lastNet = JSON.parse(localStorage.getItem('net_v1')); } catch(e){}
async function recentFees(acct){
  const k = acct || '*', c = feeCache[k];
  if (c && Date.now() - c.t < 10000) return c.fees;
  try {
    const r = await rpc('getRecentPrioritizationFees', acct ? [[acct]] : []);
    const fees = (r || []).map(x => x.prioritizationFee);
    feeCache[k] = { t: Date.now(), fees };
    if (!acct && fees.length){ lastNet = { t: Date.now(), fees }; try { localStorage.setItem('net_v1', JSON.stringify(lastNet)); } catch(e){} }
    return fees;
  } catch(e){
    if (lastNet && Date.now() - lastNet.t < 6*3600e3){ const f = lastNet.fees.slice(); f.stale = lastNet.t; return f; }
    throw e;
  }
}
const myMicroLamports = () => Math.max(PRIO_MIN, +S.settings.prio || 0) * 1e9 * 1e6 / CU_LIMIT;
// Solana renvoie, pour chaque bloc récent, le plus petit frais payé par une transaction touchant ce compte.
// Un 0 veut souvent dire « personne n'a touché ce pool dans ce bloc » : on ne garde que les blocs où il y a eu de la concurrence.
const busyFees = fees => (fees || []).filter(f => f > 0);
function landChance(fees){
  const fs = busyFees(fees);
  if (fs.length < 10) return 0.9;          // presque aucune concurrence mesurée sur ce pool
  const mine = myMicroLamports();
  return Math.min(0.95, Math.max(0.01, fs.filter(f => mine >= f).length / fs.length));
}
const feeToSol = f => f * CU_LIMIT / 1e6 / 1e9;
function median(a){ if (!a.length) return 0; const b = a.slice().sort((x,y) => x-y); return b[Math.floor(b.length/2)]; }
const poolAcct = p => (PF[p.baseToken.address] && PF[p.baseToken.address].curve) || p.pairAddress;
function etaText(q){ const sec = 0.5 + SLOT_MS/1000/q; return q < 0.05 ? 'risque d\'expiration' : '~' + (sec < 10 ? sec.toFixed(1).replace('.', ',') : Math.round(sec)) + ' s'; }
// Attend vraiment le temps de confirmation simulé. Renvoie false si la transaction expire.
async function waitLanding(p){
  let fees = [];
  try { fees = await recentFees(poolAcct(p)); } catch(e){}
  const q = landChance(fees);
  let slot = 0;
  while (++slot <= MAX_SLOTS){ if (Math.random() < q) break; }
  if (slot > MAX_SLOTS){ await sleep(MAX_SLOTS * SLOT_MS); return false; }
  await sleep(200 + Math.random()*300 + slot * SLOT_MS);
  return true;
}

function netFeeUsd(){ const sol = BN.SOL && BN.SOL.last; return sol ? (SOL_BASE_FEE + Math.max(PRIO_MIN, +S.settings.prio || 0)) * sol : null; }
// Pool modélisé en produit constant (x*y=k).
// Pool classique : chaque côté = moitié de la liquidité affichée par DexScreener.
// Bonding curve pump.fun : DexScreener n'affiche pas de liquidité, on reconstruit
// les réserves virtuelles de la courbe (30 SOL x 1 073 000 000 tokens au départ).
const PF_K = 30 * 1073000000;
function reserveUsd(p){
  const L = liq(p); if (L > 0) return L/2;
  const sol = BN.SOL && BN.SOL.last, P = +p.priceUsd, c = PF[p.baseToken.address];
  if (sol && c && c.vSol && !c.complete) return c.vSol/1e9 * sol;
  if (p.dexId === 'pumpfun' && sol && P) return Math.sqrt(PF_K * P/sol) * sol;
  return 0;
}
function buyQuote(p, usd){
  const P = dexPrice(p), R = reserveUsd(p), net = netFeeUsd();
  if (net == null) return { error: 'Prix du SOL pas encore reçu' };
  if (!P || !R) return { error: 'Liquidité inconnue pour ce token' };
  const fee = usd*(poolFee(p) + platFee());
  const dx = usd - fee - net;
  if (dx <= 0) return { error: 'Montant trop faible pour couvrir les frais' };
  const tokens = (dx/P) * R/(R+dx);
  return { tokens, fee: fee+net, impact: dx/(R+dx), avg: usd/tokens };
}
function sellQuote(p, qty){
  const P = dexPrice(p), R = reserveUsd(p), net = netFeeUsd() || 0;
  if (!P || !R) return { usd: 0, fee: 0, impact: 1 };
  const V = qty*P;
  const gross = R*V/(R+V);
  const fee = gross*(poolFee(p) + platFee());
  return { usd: Math.max(0, gross-fee-net), fee: fee+net, impact: V ? 1-gross/V : 0 };
}
function priceOf(key){
  const {kind,id} = parse(key);
  if (kind === 'bn') return BN[id] ? BN[id].last : undefined;
  return DEX[id] ? dexPrice(DEX[id]) : undefined;
}
function sellValue(pos, key){
  const {kind,id} = parse(key);
  if (kind === 'bn'){ const t = BN[id]; return t ? pos.qty*t.bid*(1-BN_FEE) : null; }
  return DEX[id] ? sellQuote(DEX[id], pos.qty).usd : null;
}
function meta(key){
  const {kind,id} = parse(key);
  if (kind === 'bn') return { sym: id, name: id+' / USDT', img: LOGO[id] || '' };
  const p = DEX[id];
  return p ? { sym: p.baseToken.symbol, name: p.baseToken.name, img: tokenImg(p) } : { sym: id.slice(0,4), name: id, img: '' };
}
function log(e){ S.hist.unshift(Object.assign({ t: Date.now() }, e)); if (S.hist.length > 500) S.hist.pop(); }

async function buy(key, amount){
  amount = +amount;
  if (!(amount > 0)) return toast('Montant invalide');
  if (amount > S.cash + 1e-9) return toast('Solde insuffisant');
  const {kind,id} = parse(key), m = meta(key);
  if (kind === 'bn'){
    const t = BN[id]; if (!t) return toast('Prix pas encore reçu');
    if (amount < BN_MIN) return toast('Minimum 5 $ sur Binance');
    const fee = amount*BN_FEE, qty = (amount-fee)/t.ask;
    addPos(key, m, qty, amount); autoTrig(key);
    S.cash -= amount;
    log({ side:'Achat', key, sym:m.sym, qty, price:t.ask, usd:amount, fee });
    toast('Acheté '+fp(qty)+' '+m.sym); recordEq(true);
  } else {
    if (inflight.has(key)) return toast('Transaction déjà en cours sur ce token');
    const p0 = DEX[id]; if (!p0) return toast('Prix pas encore reçu');
    const q0 = buyQuote(p0, amount);
    if (q0.error) return toast(q0.error);
    inflight.add(key);
    if (!(await priceCheck(key, id, p0, 'Acheter'))){ inflight.delete(key); return; }
    toast('Transaction envoyée, en attente de confirmation…');
    const landed = await waitLanding(p0);
    if (!landed){
      inflight.delete(key);
      log({ side:'Achat expiré', key, sym:m.sym, qty:0, price:dexPrice(p0), usd:0, fee:0 });
      save(); refresh();
      return toast('Transaction expirée : priority fee trop basse. Aucun frais payé.');
    }
    let p = p0; try { const g = await fetchTokens([id]); if (g[id]) p = g[id]; } catch(e){}
    inflight.delete(key);
    const q = buyQuote(p, amount);
    if (amount > S.cash + 1e-9) return toast('Solde insuffisant');
    if (q.error || q.tokens < q0.tokens*(1 - S.settings.slip/100)){
      const nf = netFeeUsd() || 0; S.cash -= nf;
      log({ side:'Échec achat', key, sym:m.sym, qty:0, price:dexPrice(p), usd:0, fee:nf });
      save(); refresh();
      return toast('Échec : slippage dépassé (frais réseau payés)');
    }
    addPos(key, meta(key), q.tokens, amount); autoTrig(key);
    S.cash -= amount;
    log({ side:'Achat', key, sym:m.sym, qty:q.tokens, price:q.avg, usd:amount, fee:q.fee, impact:q.impact });
    toast('Acheté '+fp(q.tokens)+' '+m.sym); recordEq(true);
  }
  save(); refresh();
}
async function sell(key, frac, reason){
  const pos = S.pos[key]; if (!pos) return;
  const {kind,id} = parse(key), m = meta(key);
  const qty = pos.qty*frac;
  if (kind === 'bn'){
    const t = BN[id]; if (!t) return toast('Prix pas encore reçu');
    const gross = qty*t.bid;
    if (gross < BN_MIN && frac < 0.999) return toast('Minimum 5 $ sur Binance, vends tout');
    const fee = gross*BN_FEE;
    close(key, frac, gross-fee, { side: reason || 'Vente', key, sym:m.sym, qty, price:t.bid, fee });
  } else {
    if (inflight.has(key)) return toast('Transaction déjà en cours sur ce token');
    const p0 = DEX[id]; if (!p0) return toast('Prix pas encore reçu');
    if (netFeeUsd() == null) return toast('Prix du SOL pas encore reçu');
    const q0 = sellQuote(p0, qty);
    inflight.add(key);
    if (!reason && !(await priceCheck(key, id, p0, 'Vendre'))){ inflight.delete(key); return; }
    toast('Transaction envoyée, en attente de confirmation…');
    const landed = await waitLanding(p0);
    if (!landed){
      inflight.delete(key);
      log({ side:'Vente expirée', key, sym:m.sym, qty:0, price:dexPrice(p0), usd:0, fee:0 });
      save(); refresh();
      return toast('Transaction expirée : priority fee trop basse. Aucun frais payé.');
    }
    let p = p0; try { const g = await fetchTokens([id]); if (g[id]) p = g[id]; } catch(e){}
    inflight.delete(key);
    if (!S.pos[key]) return;
    const q = sellQuote(p, qty);
    if (q.usd < q0.usd*(1 - S.settings.slip/100)){
      const nf = netFeeUsd() || 0; S.cash -= nf;
      log({ side:'Échec vente', key, sym:m.sym, qty:0, price:dexPrice(p), usd:0, fee:nf });
      save(); refresh();
      return toast('Échec : slippage dépassé (frais réseau payés)');
    }
    close(key, frac, q.usd, { side: reason || 'Vente', key, sym:m.sym, qty, price: qty ? q.usd/qty : 0, fee:q.fee, impact:q.impact });
  }
  save(); refresh();
}
function addPos(key, m, qty, cost){
  const p = S.pos[key] || (S.pos[key] = { sym:m.sym, name:m.name, img:m.img, qty:0, cost:0, sl:null, tp:null });
  p.qty += qty; p.cost += cost;
}
function close(key, frac, usd, e){
  const pos = S.pos[key];
  const costPart = pos.cost*frac;
  S.cash += usd;
  e.usd = usd; e.pnl = usd - costPart;
  log(e);
  if (frac >= 0.999) delete S.pos[key];
  else { pos.qty -= e.qty; pos.cost -= costPart; }
  toast(e.side+' : '+money(usd)+' ('+(e.pnl >= 0 ? '+' : '')+money(e.pnl)+')'); recordEq(true);
}
function checkTriggers(key){
  const pos = S.pos[key]; if (!pos || pos.pending || Date.now() < (pos.retryAt || 0)) return;
  const pr = priceOf(key); if (!pr) return;
  let reason = null;
  if (pos.sl && pr <= pos.sl) reason = 'Stop loss';
  else if (pos.tp && pr >= pos.tp) reason = 'Take profit';
  if (!reason) return;
  pos.pending = true;
  sell(key, 1, reason).finally(() => { if (S.pos[key]){ S.pos[key].pending = false; S.pos[key].retryAt = Date.now() + 3000; } });
}

/* ---------- historique GeckoTerminal ----------
   L'API gratuite limite le nombre de requêtes par minute : on garde les
   réponses 20 s en cache et on réessaie après une pause si la limite est atteinte.
   Si le pool donné par DexScreener est inconnu de GeckoTerminal, on cherche
   les pools du token chez GeckoTerminal. En dernier recours, on reconstruit
   les bougies à partir des 300 derniers trades. */
const GT = 'https://api.geckoterminal.com/api/v2/networks/solana', gtCache = {}, gtPools = {};
// File d'attente : l'API gratuite tolère environ 30 requêtes par minute et par
// appareil. On espace donc les requêtes de 2,2 s au lieu de les envoyer en rafale,
// et si la limite est atteinte malgré tout, on fait une pause de 20 s.
const GT_GAP = 2200;
let gtNext = 0, gtPause = 0;
async function gtSlot(){
  const now = Date.now(), at = Math.max(now, gtNext, gtPause);
  gtNext = at + GT_GAP;
  if (at > now) await sleep(at - now);
}
const gtBusyFor = () => Math.max(gtNext, gtPause) - Date.now();
async function gtFetch(url, { tries = 3, timeout = 10000 } = {}){
  for (let i = 0; i < tries; i++){
    await gtSlot();
    const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), timeout);
    let r;
    try { r = await fetch(url, { cache: 'no-store', signal: ctl.signal }); }
    catch(e){ clearTimeout(tm); if (i === tries - 1) throw e; continue; }
    clearTimeout(tm);
    if (r.status === 429){                  // limite atteinte : pause, et on laisse l'appelant réessayer plus tard
      gtPause = Date.now() + 20000;
      throw Object.assign(new Error('Limite GeckoTerminal atteinte'), { rate: true });
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }
  throw new Error('GeckoTerminal injoignable');
}
async function gt(path){
  const c = gtCache[path]; if (c && Date.now() - c.t < 20000) return c.d;
  const d = await gtFetch(GT + path);
  gtCache[path] = { t: Date.now(), d };
  return d;
}
function tradesOf(r, id){
  return (r.data || []).map(x => {
    const t = x.attributes;
    return { ts: Date.parse(t.block_timestamp)/1000, price: +(t.to_token_address === id ? t.price_to_in_usd : t.price_from_in_usd), vol: +t.volume_in_usd || 0 };
  }).filter(t => t.ts && t.price).sort((a,b) => a.ts - b.ts);
}
async function histFromPool(pool, plan, id, tf){
  const h = { bars: [], vols: [] };
  if (plan.src === 'trades'){
    const r = await gt(`/pools/${pool}/trades`);
    if (!(r.data || []).length) return null;
    const lim = Date.now()/1000 - (tf === '1m' ? 60 : 600), c = { iv: plan.iv, bars: h.bars, vols: h.vols };
    tradesOf(r, id).filter(t => t.ts >= lim).forEach(t => bucket(c, t.ts, t.price, t.vol));
    return h;
  }
  const r = await gt(`/pools/${pool}/ohlcv/${plan.tfr}?aggregate=${plan.agg}&limit=${plan.lim}&token=${id}`);

async function loadHist(hist, plan, id, p, tf){

  try { const h = await histFromPool(p.pairAddress, plan, id, tf); if (h) return use(h); } catch(e){ if (e.rate) return false; }
  if (!gtPools[id]){
    try { const r = await gt(`/tokens/${id}/pools?page=1`); gtPools[id] = (r.data || []).map(x => x.attributes.address).filter(a => a && a !== p.pairAddress).slice(0, 2); }
    catch(e){ if (e.rate) return false; }
  }
  for (const pool of gtPools[id] || []){
    try { const h = await histFromPool(pool, plan, id, tf); if (h) return use(h); } catch(e){ if (e.rate) return false; }
  }

function pushChart(key, price){   // courbe des cryptos classiques
  const c = CH[key]; if (!c || !isFinite(price) || !price) return;
  const t = Math.floor((Date.now()/1000 + TZ())/c.iv)*c.iv, pts = c.pts, last = pts[pts.length-1];
  let pt;
  if (last && last.time === t){ last.value = price; pt = last; }
  else if (!last || t > last.time){ pt = { time: t, value: price }; pts.push(pt); if (pts.length > 2000) pts.shift(); }

// Ajoute un trade dans la bougie de sa tranche de temps
function bucket(c, ts, price, vol){
  const t = Math.floor((ts + TZ())/c.iv)*c.iv, b = c.bars, last = b[b.length-1];
  let bar, v;
  if (last && last.time === t){
    last.high = Math.max(last.high, price); last.low = Math.min(last.low, price); last.close = price;
    bar = last; v = c.vols[c.vols.length-1]; v.value += vol;
  } else if (!last || t > last.time){
    const o = last ? last.close : price;
    bar = { time: t, open: o, high: Math.max(o, price), low: Math.min(o, price), close: price };
    v = { time: t, value: vol };
    b.push(bar); c.vols.push(v);
    if (b.length > 3000){ b.shift(); c.vols.shift(); }
  } else return null;
  v.color = bar.close >= bar.open ? 'rgba(46,189,133,.45)' : 'rgba(246,70,93,.45)';
  return [bar, v];
}

  lastTick[mint] = { price, ts: now };
  const c = CD[mint]; if (!c) return;
  const r = bucket(c, now, price, vol || 0);
  if (r && sheetKey === 'sol:'+mint && chartMode === 'candle' && c.tf === curTf){
    try { series.update(r[0]); volSeries.update(r[1]); } catch(e){}

    if (n('mcMin') != null) chk(test(fltVal(a, 'mc'), v => v >= n('mcMin')*1e3));
    if (n('mcMax') != null) chk(test(fltVal(a, 'mc'), v => v <= n('mcMax')*1e3));
    if (n('liqMin') != null) chk(test(fltVal(a, 'liq'), v => v >= n('liqMin')*1e3));
    if (n('volMin') != null) chk(test(fltVal(a, 'vol'), v => v >= n('volMin')*1e3));
    if (n('ageMin') != null) chk(test(fltVal(a, 'age'), v => v >= n('ageMin')));
    if (n('ageMax') != null) chk(test(fltVal(a, 'age'), v => v <= n('ageMax')*60));
    if (n('chMin') != null) chk(test(fltVal(a, 'ch'), v => v >= n('chMin')));
    if (n('lastMax') != null) chk(test(fltVal(a, 'last'), v => v <= n('lastMax')));
    if (n('orgMin') != null) chk(test(fltVal(a, 'org'), v => v >= n('orgMin')));
    if (n('holdMin') != null) chk(test(fltVal(a, 'hold'), v => v >= n('holdMin')));
    if (!pass) continue;
    // critères qui demandent de charger la sécurité du token
    const wantSec = n('devMax') != null || FLT_CHECKS.some(([k]) => FLT['c_' + k]);
    if (wantSec && !SEC[a]) needSec.push(a);
    if (n('devMax') != null) chk(test(fltVal(a, 'dev'), v => v <= n('devMax')));
    for (const [k] of FLT_CHECKS) if (FLT['c_' + k]) chk(test(fltVal(a, k), v => v === true));
    if (pass) out.push(a);
  }
  // chargement progressif de la sécurité : quelques tokens à la fois
  needSec.slice(0, 4).forEach(a => { if (!secBusy.has(a)) loadSec(DEX[a]); });
  return { list: out, pool: pool.length };
}

/* ---------- courbe du portefeuille ----------
   La valeur totale (cash + positions au prix du marché) est enregistrée une fois par minute quand l'appli
   est ouverte, et à chaque achat ou vente. Rien n'est enregistré tant qu'un prix manque (sinon faux point). */

function recordEq(force){
  for (const k in S.pos) if (priceOf(k) == null) return;
  const v = totalValue(), now = Date.now(), last = S.eq[S.eq.length - 1];
  if (!force && last && now - last.t < 60000) return;
  if (last && now - last.t < 1000) last.v = Math.round(v*100)/100; else S.eq.push({ t: now, v: Math.round(v*100)/100 });
  if (S.eq.length > 6000){ const half = S.eq.length >> 1; S.eq = S.eq.slice(0, half).filter((_, i) => i % 2 === 0).concat(S.eq.slice(half)); }
  save();

}
/* Graphique maison en SVG, toujours depuis le début de la partie.

function eqDraw(){

  const raw = S.eq.concat([{ t: Date.now(), v: Math.round(totalValue()*100)/100, live: true }]);
  // points mis bout à bout ; on marque les reprises après une fermeture de l'appli
  let pts = raw.map((p, i) => ({ ...p, gap: i > 0 && p.t - raw[i - 1].t > 3*60000 }));

  const vals = pts.map(p => p.v).concat([START]);
  let lo = Math.min(...vals), hi = Math.max(...vals); const span = Math.max(hi - lo, hi*0.04); lo -= span*0.12; hi += span*0.12;

  const spacing = pts.length > 1 ? pw/(pts.length - 1) : pw, dots = spacing >= 6 ? pts.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="1.8" class="eqdot"/>`).join('') : '';
  const last = pts[pts.length - 1], lx = X(pts.length - 1), ly = Y(last.v), up = last.v >= START;
  const d0 = new Date(pts[0].t), dN = new Date(last.t), fmtD = d => d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
  const sameDay = d0.toDateString() === dN.toDateString();

    <defs><linearGradient id="eqg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${up ? '#2ebd85' : '#f6465d'}" stop-opacity=".22"/><stop offset="1" stop-color="${up ? '#2ebd85' : '#f6465d'}" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(v => `<line x1="${EQ_PAD.l}" x2="${EQ_PAD.l + pw}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" class="eqgrid"/><text x="${W - 4}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end" class="eqtick">${nf2(v, step < 1 ? 2 : 0)} $</text>`).join('')}
    <line x1="${EQ_PAD.l}" x2="${EQ_PAD.l + pw}" y1="${Y(START).toFixed(1)}" y2="${Y(START).toFixed(1)}" class="eqstart"/>
    <path d="${area}" fill="url(#eqg)"/>
    <path d="${dash}" class="eqgap"/>
    <path d="${line}" class="eqline ${up ? 'up' : 'down'}"/>
    ${dots}
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4.5" class="eqlast ${up ? 'up' : 'down'}"/>
    <text x="${EQ_PAD.l}" y="${H - 6}" class="eqtick">${fmtD(d0)}</text>
    <text x="${EQ_PAD.l + pw}" y="${H - 6}" text-anchor="end" class="eqtick">${sameDay ? 'maintenant' : fmtD(dN)}</text>
    <line id="eqcur" x1="0" x2="0" y1="${EQ_PAD.t}" y2="${EQ_PAD.t + ph}" class="eqcur" style="display:none"/><circle id="eqcurdot" r="4" class="eqlast ${up ? 'up' : 'down'}" style="display:none"/>
  </svg><div class="eqtip" id="eqtip"></div>`;
  // survol / doigt : valeur et date du point
  const svg = box.querySelector('svg'), tip = $('#eqtip');

/* ---------- entraînement ----------
   Exercices à réponse exacte, générés au hasard, calculés avec les mêmes
   formules que la simulation. Chaque exercice a son schéma (SVG), qui se
   complète une fois la réponse donnée. */
const TRAIN_CATS = [['all','Tout'],['impact','Impact'],['slip','Slippage'],['be','Rentabilité'],['size','Taille de position'],['fees','Frais'],['rr','Risque / gain'],['logo','Logos']];

const pickOne = arr => arr[Math.floor(Math.random()*arr.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const k = Math.floor(Math.random()*(i + 1)); [a[i], a[k]] = [a[k], a[i]]; } return a; };

const pct1 = x => nf2(x, 1) + ' %';
const solTxt = x => String(x).replace('.', ',');
function makeChoices(correct, traps, fmt){
  const good = fmt(correct), out = [good], seen = new Set(out);
  for (const w of traps){ if (!(w > 0) || !isFinite(w)) continue; const t = fmt(w); if (!seen.has(t)){ seen.add(t); out.push(t); } if (out.length === 4) break; }
  for (let k = 1; out.length < 4 && k < 20; k++){ const t = fmt(correct * (k % 2 ? 1 + 0.4*k : 1/(1 + 0.4*k))); if (!seen.has(t)){ seen.add(t); out.push(t); } }
  return { choices: shuffle(out), answer: good };
}

function walk(n, from, to, wobble, seed){
  let r = seed; const rand = () => (r = (r*9301 + 49297) % 233280) / 233280;
  const out = [];
  for (let i = 0; i < n; i++){ const t = i/(n - 1); out.push(from + (to - from)*t + (rand() - 0.5)*wobble*Math.sin(Math.PI*t)); }
  out[n - 1] = to; return out;
}

function slipViz(buy, movePct, tolPct, seed, tolIsGiven = false, steps2 = null){

  const p1 = buy ? 1 + mv/100 : 1 - mv/100;
  const lim = tolPct == null ? null : (buy ? 1/(1 - tolPct/100) : 1 - tolPct/100);
  const ext = Math.max(Math.abs(p1 - 1), lim ? Math.abs(lim - 1) : 0, 0.02) * 1.3, lo = 1 - ext, hi = 1 + ext;
  const yf = v => Y0 + (hi - v)/(hi - lo)*(Y1 - 22 - Y0), xc = 100;
  const pre = walk(12, 1 + (buy ? -1 : 1)*ext*0.25, 1, ext*0.5, seed);
  let g = '';
  if (lim) g += box(xc, Math.min(yf(1), yf(lim)), X1 - xc, Math.abs(yf(lim) - yf(1)), GREEN_BG, 0) + hline(yf(lim), GREEN, true, xc, X1) + txt(X1 + 6, yf(lim) + 4, 'limite', { c: GREEN, s: 10, w: 600 });
  g += hline(yf(1), MUT, true) + txt(X1 + 6, yf(1) + 4, 'prix au clic', { s: 10 });
  let post;
  if (steps2){
    const m1 = 1 - steps2[0]/100, m2 = m1*(1 - steps2[1]/100), xm = (xc + X1)/2;
    post = [1, 1, m1, m1, m2];
    g += line(`M${xc},${yf(1)}L${xm - 30},${yf(1)}L${xm - 30},${yf(m1)}L${X1 - 40},${yf(m1)}L${X1 - 40},${yf(m2)}L${X1},${yf(m2)}`, TXT, 2);
    g += tag(xm - 26, (yf(1) + yf(m1))/2 + 4, `-${steps2[0]} %`, 'var(--surface2)', TXT) + tag(X1 - 36, (yf(m1) + yf(m2))/2 + 4, `-${steps2[1]} %`, 'var(--surface2)', TXT);
  } else {
    post = walk(14, 1, p1, ext*0.45, seed + 3);
    g += line(pathOf(post, xc, X1, yf), TXT, 2);
    g += tag(X1 - 60, yf(p1) + (buy ? -12 : 22), movePct == null ? (buy ? '+ ? %' : '- ? %') : (buy ? '+' : '-') + nf2(movePct, 1) + ' %', 'var(--surface2)', movePct == null ? ACC : TXT);
  }
  g += line(pathOf(pre, X0, xc, yf), MUT, 1.6) + dot(xc, yf(1), ACC) + dot(X1, yf(p1), TXT);
  g += txt(xc, Y1 - 2, 'clic', { a: 'middle' }) + txt(X1, Y1 - 2, 'confirmation', { a: 'middle' });
  return svg(g);
}

/* ---------- cas pratiques ----------
   Un énoncé, puis l'appli en version mission : trois tokens fictifs, prix
