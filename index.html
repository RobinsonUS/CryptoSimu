<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17171b">
<title>CryptoSimu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17171b; --surface:#222228; --surface2:#2d2d34; --line:rgba(255,255,255,.06);
  --txt:#f4f4f6; --surface0:#1c1c21; --mut:#8e8e9a; --acc:#ab9ff2; --acc-ink:#1d1a33;
  --up:#2ebd85; --down:#f6465d; --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;background:var(--bg);color:var(--txt);font-family:Figtree,-apple-system,system-ui,sans-serif;font-size:15px;line-height:1.35;font-variant-numeric:tabular-nums}
body{padding-bottom:84px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input{font:inherit;width:100%;padding:13px 14px;border-radius:12px;border:0;background:var(--surface2);color:var(--txt);outline:none}
input::placeholder{color:var(--mut)}
input:focus{box-shadow:0 0 0 2px var(--acc)}
.up{color:var(--up)}.down{color:var(--down)}.mut{color:var(--mut)}.sm{font-size:13px}

/* en-tête : le solde */
header{padding:22px 16px 18px;text-align:center}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--down)}
.dot.on{background:var(--up)}
#total{font-size:42px;font-weight:700;letter-spacing:-.02em;margin:8px 0 6px}
.pnlrow{display:flex;justify-content:center;align-items:center;gap:8px;font-size:14px;font-weight:500}
.pill{padding:3px 9px;border-radius:999px;font-size:13px;font-weight:600}
.pill.up{background:rgba(46,189,133,.14)}.pill.down{background:rgba(246,70,93,.14)}
#cash{margin-top:6px;font-size:13px;color:var(--mut)}

main{padding:0 16px 8px}
.hint{font-size:13px;color:var(--mut);margin:0 4px 10px}

/* listes de tokens */
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border-radius:var(--r);margin-bottom:8px;cursor:pointer}
.row:active{background:var(--surface2)}
.row .ic{display:flex;flex:none}
.row img,.ph{width:40px;height:40px;border-radius:50%;flex:none;background:var(--surface2);object-fit:cover}
.ph{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--mut)}
.grow{flex:1;min-width:0}
.name{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name .sm{font-weight:500}
.right{text-align:right;flex:none}
.right>div:first-child{font-weight:600}

/* contrôles segmentés */
.tabs{display:flex;background:var(--surface);border-radius:12px;padding:3px;gap:2px;margin-bottom:12px}
.tabs button{flex:1;padding:8px 4px;border-radius:9px;color:var(--mut);font-weight:600;font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--surface2);color:var(--txt)}

form.search{position:relative;margin-bottom:12px}
form.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut)}
form.search input{padding-left:42px}

/* cartes et lignes clé/valeur */
.card{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:10px}
.card h3{font-size:16px;font-weight:600;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0}
.kv>span:first-child{color:var(--mut)}
.kv>span:last-child{font-weight:500;text-align:right}
.field{font-size:13px;color:var(--mut);margin:12px 0 6px}

/* boutons */
.btn{display:block;width:100%;padding:15px;border-radius:14px;font-weight:600;font-size:16px;text-align:center}
.btn-buy{background:var(--acc);color:var(--acc-ink)}
.btn-buy:active{filter:brightness(.92)}
.btn-ghost{background:var(--surface2);color:var(--txt)}
.btn-danger{background:rgba(246,70,93,.12);color:var(--down)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.chips.three{grid-template-columns:repeat(3,1fr)}
.chips button{padding:10px 0;border-radius:10px;background:var(--surface2);font-weight:600;font-size:14px}
.chips.sell button{background:rgba(246,70,93,.12);color:var(--down)}
.amount{font-size:22px;font-weight:600;padding:14px}
#quote{font-size:13px;color:var(--mut);line-height:1.6;margin-bottom:12px;min-height:20px}

/* barre de navigation */
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(23,23,27,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--mut);font-size:11px;font-weight:600}
nav button.on{color:var(--acc)}
nav svg{width:22px;height:22px}

/* fiche token */
#sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;display:none;padding:12px 16px 40px}
#sheet.open{display:block}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center}
.chip{padding:8px 12px;border-radius:999px;background:var(--surface);font-size:13px;font-weight:600;color:var(--mut)}
.tokhead{display:flex;align-items:center;gap:12px}
.tokhead img,.tokhead .ph{width:44px;height:44px}
.tokname{font-size:20px;font-weight:700;line-height:1.1}
#sp{font-size:30px;font-weight:700;letter-spacing:-.01em;margin-top:16px}
#sc{font-size:14px;font-weight:600;margin-top:2px}
#fresh{font-size:12px;color:var(--mut);margin:6px 0 14px}
#chartwrap{position:relative;margin:0 -4px 6px}
#chart{height:280px;touch-action:pan-y;overscroll-behavior:contain}
.chartbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 8px}
.chartbar #fresh{margin:0}
.chartreset{flex:none;width:34px;height:34px;border-radius:10px;background:var(--surface);color:var(--mut);display:flex;align-items:center;justify-content:center}
#legend{position:absolute;top:6px;left:8px;z-index:3;font-size:11px;line-height:1.5;color:var(--mut);pointer-events:none}
#chartnote{font-size:12px;color:var(--mut);margin-bottom:10px}

#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--surface2);color:var(--txt);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:20;display:none;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.hist-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.hist-head b{font-weight:600}
.credit{font-size:12px;color:var(--mut);text-align:center;margin:16px 0 4px}

/* entraînement */
.train{max-width:980px;margin:0 auto}
@media (min-width:1100px){.train{margin:0}}
.trtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:4px 2px 14px}
.trtitle{font-size:22px;font-weight:700;letter-spacing:-.01em}
.trsub{font-size:13px;color:var(--mut);margin-top:3px;max-width:42ch}
.streak{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;background:var(--surface);font-size:12px;color:var(--mut)}
.streak svg{color:var(--acc)}
.streak b{display:block;color:var(--txt);font-size:16px;line-height:1.1}
.streak .sep{width:1px;align-self:stretch;background:var(--line)}
.trback{display:flex;align-items:center;gap:12px}
.hub{display:grid;gap:12px}
.hubcard{display:flex;flex-direction:column;text-align:left;background:var(--surface);border-radius:22px;overflow:hidden;border:1px solid transparent;transition:border-color .15s}
@media (hover:hover){.hubcard:hover{border-color:rgba(171,159,242,.45)}}
.hubcard:active{border-color:var(--acc)}
.hubart{background:var(--surface0);padding:18px 18px 10px;display:flex;justify-content:center}
.hubart svg{width:100%;max-width:300px;height:auto}
.hubtxt{padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.hubtitle{font-size:21px;font-weight:700;letter-spacing:-.01em}
.hubdesc{font-size:14px;line-height:1.55;color:var(--mut)}
.hubmeta{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--mut)}
.hubmeta span:first-child{display:flex;align-items:center;gap:6px}
.hubmeta svg{width:15px;height:15px;color:var(--acc)}
.hubmeta .go{flex:none;padding:8px 14px;border-radius:999px;background:var(--acc);color:var(--acc-ink);font-weight:700}
@media (min-width:720px){.hub{grid-template-columns:1fr 1fr}}

/* cas pratiques */
.brief{background:var(--surface);border-radius:18px;padding:16px;margin-bottom:12px;display:grid;gap:12px}
.briefhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.prof{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.prof-prudent{background:rgba(46,189,133,.15);color:var(--up)}
.prof-equi{background:rgba(171,159,242,.15);color:var(--acc)}
.prof-agressif{background:rgba(246,70,93,.15);color:var(--down)}
.briefgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.briefgrid>div{background:var(--surface2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.briefgrid span{font-size:12px;color:var(--mut)}
.briefgrid b{font-size:17px;font-weight:700}
.briefgrid em{font-style:normal;font-size:11px;color:var(--mut)}
@media (min-width:720px){.briefgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cpgrid{display:grid;gap:12px}
.cpmain{background:var(--surface);border-radius:18px;padding:12px;min-width:0}
.toks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px}
.tok{padding:10px;border-radius:12px;background:var(--surface2);border:1px solid transparent;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.tok b{font-size:15px}
.tok span{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tok.on{border-color:var(--acc);background:rgba(171,159,242,.1)}
.cpchartwrap{position:relative;border-radius:12px;overflow:hidden}
#cpchart{height:260px}
.cplive{position:absolute;left:10px;top:8px;z-index:3;font-size:13px;color:var(--txt);pointer-events:none}
.tinfo{margin-top:10px;display:grid;gap:10px}
.tistats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tistats>div{background:var(--surface2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tistats span{font-size:11px;color:var(--mut)}
.tistats b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tisec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:13px}
.tisec>div{display:flex;align-items:center;gap:6px}
.ck{display:inline-flex;width:18px;height:18px}.ck svg{width:18px;height:18px}
.ck.ok{color:var(--up)}.ck.ko{color:var(--down)}
.ticket{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tkhead{font-size:16px;font-weight:700}
.tf{display:flex;flex-direction:column;gap:5px;min-width:0}
.tfl{font-size:13px;color:var(--mut)}
.tfi{position:relative;display:block}
.tfi input{padding-right:46px;font-weight:600}
.tfi em{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;font-size:13px;color:var(--mut)}
.tfh{font-size:11px;color:var(--mut)}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:-2px}
.tchips button{padding:6px 10px;border-radius:999px;background:var(--surface2);font-size:12px;font-weight:600;color:var(--mut)}
.tchips button.on{background:var(--txt);color:var(--bg)}
.tchips button:disabled,.tfi input:disabled{opacity:.55}
.tprev{background:var(--bg);border-radius:12px;padding:12px;display:grid;gap:4px}
.riskbar{display:grid;gap:6px;margin-bottom:4px}
.rbtop{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
.rbtop b{color:var(--txt);font-weight:700}.rbtop b.down{color:var(--down)}
.rbtop em{font-style:normal;color:var(--mut);font-weight:500}
.rbtrack{position:relative;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.rbtrack i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--up)}
.rbtrack i.over{background:var(--down)}
.rbtrack s{position:absolute;top:0;bottom:0;width:2px;background:var(--txt);opacity:.6}
.ticket .btn:disabled{opacity:.5}
.result{margin-top:12px;background:var(--surface);border-radius:18px;padding:18px;display:grid;gap:16px}
.rescore{display:flex;align-items:center;gap:16px}
.ring{width:110px;height:110px;flex:none}
.resgrade{font-size:22px;font-weight:700}
.resout{background:var(--surface2);border-radius:14px;padding:14px;display:grid;gap:6px}
.resline{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--mut)}
.resline b{font-size:22px;font-weight:700}
.ressub{font-size:14px;line-height:1.5}
.respills{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.respills span{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.respills svg{width:14px;height:14px}
.okp{background:rgba(46,189,133,.14);color:var(--up)}.kop{background:rgba(246,70,93,.14);color:var(--down)}
.crit{display:grid;gap:8px}
.critrow{padding:12px 14px;border-radius:12px;background:var(--bg)}
.crithead{display:flex;align-items:center;gap:8px;font-size:14px}
.crithead b{flex:1;font-weight:600}
.crithead em{font-style:normal;font-weight:700;font-size:13px}
.ci{display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center}
.ci svg{width:14px;height:14px}
.ci.ok{background:var(--up);color:var(--bg)}.ci.mid{background:var(--acc);color:var(--bg)}.ci.ko{background:var(--down);color:var(--bg)}
.critmsg{font-size:13px;color:var(--mut);line-height:1.5;margin:6px 0 0 30px}
.ideal{border:1px solid rgba(171,159,242,.35);border-radius:14px;padding:14px;display:grid;gap:4px;font-size:14px;line-height:1.55}
.ideal b{color:var(--acc)}
@media (min-width:900px){
  .cpgrid{grid-template-columns:minmax(0,1fr) 340px;align-items:start}
  .ticket{position:sticky;top:12px}
  #cpchart{height:320px}
  .crit{grid-template-columns:1fr 1fr}
}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.modes button{text-align:left;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid transparent;display:flex;flex-direction:column;gap:3px;min-width:0}
.modes b{font-size:15px;font-weight:700}
.modes span{font-size:12px;color:var(--mut);line-height:1.35}
.modes button.on{border-color:var(--acc);background:rgba(171,159,242,.08)}
.modes button.on b{color:var(--acc)}
.opt.long .lab{font-size:14px;font-weight:600;line-height:1.4}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 14px;padding-bottom:2px}
.pills::-webkit-scrollbar{display:none}
.pills button{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);color:var(--mut);font-weight:600;font-size:14px}
.pills button.on{background:var(--txt);color:var(--bg)}
.ex{background:var(--surface);border-radius:20px;overflow:hidden}
.exviz{background:var(--surface0);padding:14px 12px 8px;border-bottom:1px solid var(--line)}
.exviz svg{display:block;width:100%;height:auto;max-height:260px}
.exviz .logo{display:block;width:120px;height:120px;border-radius:50%;margin:18px auto;object-fit:cover;background:var(--surface2)}
.exbody{padding:18px 18px 20px}
.extag{font-size:12px;font-weight:600;color:var(--acc);margin-bottom:8px}
.exq{font-size:17px;line-height:1.5;font-weight:500;text-wrap:pretty}
.exq .mut{display:block;margin-top:6px;font-size:14px;font-weight:400}
.exopts{display:grid;gap:8px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px solid transparent;font-weight:600;font-size:15px}
.opt:not(:disabled):active{border-color:var(--acc)}
@media (hover:hover){.opt:not(:disabled):hover{border-color:rgba(171,159,242,.5)}}
.opt .key{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--bg);color:var(--mut)}
.opt .lab{flex:1}
.opt.ok{border-color:var(--up);background:rgba(46,189,133,.1)}
.opt.ok .key{background:var(--up);color:var(--bg)}
.opt.ko{border-color:var(--down);background:rgba(246,70,93,.1)}
.opt.ko .key{background:var(--down);color:var(--bg)}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}
.exfb{margin-top:18px}
.verdict{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700}
.steps{margin:12px 0;padding:12px 14px;border-radius:12px;background:var(--bg);font-size:14px;line-height:1.75}
.steps b{font-weight:600}
.tip{font-size:14px;line-height:1.55;color:var(--mut)}
.tip b{color:var(--txt);font-weight:600}
.exfb .btn{margin-top:16px}
@media (min-width:900px){
  .ex{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
  .exviz{border-bottom:0;border-right:1px solid var(--line);display:flex;align-items:center;padding:20px}
  .exviz svg{max-height:none}
  .exbody{padding:24px}
}

/* ----- mise en page : téléphone par défaut ----- */
.brand{display:none}
.sheetgrid{display:flex;flex-direction:column}
.maincol,.sidecol{display:contents}
.memebar .tabs{margin-bottom:12px}

/* ----- tablette ----- */
@media (min-width:720px){
  main{max-width:1000px;margin:0 auto;padding:0 24px 16px}
  #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  #list .row,#list .card{margin:0}
  #list .empty{grid-column:1/-1}
  .memebar{display:flex;gap:10px;align-items:center;margin-bottom:12px}
  .memebar form.search{flex:1;margin:0}
  .memebar .tabs{flex:0 0 360px;margin:0}
  .sheetin{max-width:1000px;margin:0 auto}
  #chart{height:360px}
  #toast{bottom:104px}
}
@media (min-width:900px){
  .porte{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
  .porte #list{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .sheetgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
  .maincol,.sidecol{display:block;min-width:0}
  .sidecol{position:sticky;top:12px}
  #chart{height:400px}
}

/* ----- ordinateur : barre latérale ----- */
@media (min-width:1100px){
  body{padding:0 0 0 232px}
  nav{top:0;right:auto;width:232px;flex-direction:column;align-items:stretch;gap:4px;padding:20px 12px;border-top:0;border-right:1px solid var(--line);background:var(--bg)}
  .brand{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em;padding:4px 12px 20px}
  nav button{flex:none;flex-direction:row;gap:12px;padding:11px 12px;border-radius:12px;font-size:15px}
  nav button.on{background:var(--surface);color:var(--txt)}
  nav button.on svg{color:var(--acc)}
  header{max-width:1240px;margin:0 auto;padding:28px 32px 22px;text-align:left;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"status status" "total total" "pnl cash";column-gap:16px;align-items:center}
  .status{grid-area:status}
  #total{grid-area:total;font-size:48px;margin:6px 0 4px}
  .pnlrow{grid-area:pnl;justify-content:flex-start}
  #cash{grid-area:cash;margin:0}
  main{max-width:1240px;padding:0 32px 32px}
  #sheet{left:232px;padding:20px 32px 40px}
  .sheetin{max-width:1240px}

<script>
'use strict';
const APP_VERSION = '2026.10.20-7';
const START = 100;
const BN_FEE = 0.001;      // 0,1 % frais spot Binance (taux standard)
const BN_MIN = 5;          // ordre minimum 5 USDT sur Binance
const SOL_BASE_FEE = 0.000005;
// Cryptos de l'onglet Marché (paires USDT de Binance). Pas de memecoins ici (ils sont dans leur onglet), sauf DOGE et PEPE.
// Celles que Binance ne cote pas ou plus sont masquées automatiquement.
const MAJORS = ['BTC','ETH','SOL','BNB','XRP','DOGE','ADA','TRX','AVAX','LINK','DOT','SUI','LTC','BCH','NEAR','APT','UNI','XLM','ATOM',
  'ETC','FIL','ICP','HBAR','ARB','OP','INJ','AAVE','RENDER','FET','TAO','ALGO','VET','WLD','ONDO',
  'PEPE','SAND','MANA','CRV'];
const DS = 'https://api.dexscreener.com';
let LOGO = {};
try { const c = JSON.parse(localStorage.getItem('logos_v2')); if (c && Date.now() - c.t < 7*86400e3) LOGO = c.logos || {}; } catch(e){}
// Logos : les 250 plus grosses cryptos de CoinGecko, associées par symbole (la plus grosse gagne en cas de doublon)
async function loadLogos(){

    if (tab === 'marche' && !sheetKey) renderList();
  } catch(e){}
}
const KEY = 'centballes_v1';

const BN = {}, DEX = {}, CH = {}, SEEN = {};
let S = load() || fresh();
delete S.settings.tf;
if (!S.train) S.train = { streak: 0, best: 0 };
if (!S.cases) S.cases = { best: 0, played: 0 };
const DEFAULT_TF = '1h';

delete S.settings.plat;

const inflight = new Set();   // tokens avec une transaction en attente
const feed = { top: [], new: [], search: [] };

/* ---------- utilitaires ---------- */
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SUB = '₀₁₂₃₄₅₆₇₈₉';
function fp(x){
  if (x == null || !isFinite(x)) return '-';
  const a = Math.abs(x);
  if (a === 0) return '0';
  if (a < 0.0001){
    const z = -Math.floor(Math.log10(a)) - 1;
    const d = Math.round(a * Math.pow(10, z + 4)).toString().slice(0, 4).replace(/0+$/, '') || '0';
    return (x < 0 ? '-' : '') + '0,0' + String(z).split('').map(c => SUB[c]).join('') + d;
  }
  if (a >= 1000) return x.toLocaleString('fr-FR',{maximumFractionDigits:2});
  if (a >= 1) return x.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:4});
  return x.toLocaleString('fr-FR',{maximumSignificantDigits:4});
}
const money = x => (x == null || !isFinite(x)) ? '-' : x.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' $';
const nf2 = (x, d) => x.toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = x => (x == null || !isFinite(x)) ? '-' : (x >= 0 ? '+' : '') + nf2(x, 2) + ' %';
const cls = x => x >= 0 ? 'up' : 'down';
function big(x){
  if (x == null || !isFinite(x)) return '-';
  if (x >= 1e9) return nf2(x/1e9, 2)+' Md $';
  if (x >= 1e6) return nf2(x/1e6, 2)+' M $';
  if (x >= 1e3) return nf2(x/1e3, 1)+' k $';
  return nf2(x, 0)+' $';
}
function age(ts){
  if (!ts) return '';
  const m = (Date.now()-ts)/60000;
  if (m < 60) return Math.floor(m)+' min';
  if (m < 1440) return Math.floor(m/60)+' h';
  return Math.floor(m/1440)+' j';
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 2600);
}
async function j(url){
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
function parse(key){ const i = key.indexOf(':'); return { kind: key.slice(0,i), id: key.slice(i+1) }; }

/* ---------- sauvegarde ---------- */
function fresh(){ return { cash: START, pos: {}, hist: [], start: Date.now(), settings: { prio: 0.001, slip: 10 }, train: { streak: 0, best: 0 } }; }
function load(){

/* ---------- Binance (WebSocket temps réel + secours REST) ---------- */
// Certains réseaux mobiles bloquent le port 9443 : on alterne entre deux
// adresses WebSocket, et si rien n'arrive, on interroge l'API REST chaque seconde.
const BN_WS = ['wss://stream.binance.com:9443', 'wss://data-stream.binance.vision'];
const BN_REST = ['https://api.binance.com', 'https://data-api.binance.vision'];
let ws, wsDelay = 1000, wsHost = 0, bnWsLast = 0, bnRestBusy = false, bnRestLast = 0;
function setBN(sym, d){
  BN[sym] = d;
  pushChart('bn:'+sym, d.last);
  checkTriggers('bn:'+sym);
}
function connectBN(){
  const streams = MAJORS.map(s => s.toLowerCase()+'usdt@ticker').join('/');
  ws = new WebSocket(BN_WS[wsHost % BN_WS.length]+'/stream?streams='+streams);
  ws.onmessage = e => {
    const d = JSON.parse(e.data).data;
    if (!d || !d.s) return;
    if (!bnWsLast){ $('#dot').classList.add('on'); $('#stat').textContent = 'Temps réel'; }
    bnWsLast = Date.now(); wsDelay = 1000;
    setBN(d.s.replace(/USDT$/,''), { last: +d.c, bid: +d.b, ask: +d.a, pct: +d.P, vol: +d.q });
  };
  ws.onclose = () => {
    bnWsLast = 0; wsHost++;
    setTimeout(connectBN, wsDelay); wsDelay = Math.min(wsDelay*2, 30000);
  };
  ws.onerror = () => { try { ws.close(); } catch(e){} };
}
async function bnGet(path){
  for (const h of BN_REST){ try { return await j(h+path); } catch(e){} }
  throw new Error('Binance injoignable');
}
async function pollBN(){
  if (Date.now() - bnWsLast < 3000 || bnRestBusy || document.hidden || Date.now() - bnRestLast < 2000) return;
  bnRestBusy = true; bnRestLast = Date.now();
  try {
    const q = encodeURIComponent(JSON.stringify(MAJORS.map(s => s+'USDT')));
    let t24, book;
    try { [t24, book] = await Promise.all([bnGet('/api/v3/ticker/24hr?symbols='+q), bnGet('/api/v3/ticker/bookTicker?symbols='+q)]); }
    catch(e){
      const want = new Set(MAJORS.map(s => s+'USDT'));
      [t24, book] = await Promise.all([bnGet('/api/v3/ticker/24hr'), bnGet('/api/v3/ticker/bookTicker')]);
      t24 = t24.filter(t => want.has(t.symbol)); book = book.filter(b => want.has(b.symbol));
    }
    const bk = {}; for (const b of book) bk[b.symbol] = b;
    for (const t of t24){
      const b = bk[t.symbol] || {};
      setBN(t.symbol.replace(/USDT$/,''), { last: +t.lastPrice, bid: +(b.bidPrice || t.lastPrice), ask: +(b.askPrice || t.lastPrice), pct: +t.priceChangePercent, vol: +t.quoteVolume });
    }
    if (Date.now() - bnWsLast >= 3000){ $('#dot').classList.add('on'); $('#stat').textContent = 'Temps réel'; }
  } catch(e){
    if (Date.now() - bnWsLast >= 3000){ $('#dot').classList.remove('on'); $('#stat').textContent = 'Binance injoignable'; }
  }
  bnRestBusy = false;
}

/* ---------- DexScreener (memecoins Solana) ---------- */
const liq = p => (p && p.liquidity && p.liquidity.usd) || 0;
/* Choix du pool de référence d'un token.
   Un token peut avoir plusieurs pools, dont de minuscules pools mal pricés
   (ex. 160 $ de liquidité à un prix 50x trop bas). DexScreener ne renvoie pas
   toujours tous les pools d'un token dans une réponse groupée : sans précaution,
   l'app pouvait basculer sur un mauvais pool et afficher un faux prix.
   Règles : on prend le pool le plus liquide (puis le plus actif), et une fois
   choisi on y reste, sauf si un autre pool devient nettement plus liquide. */
let PAIR = {};                   // token -> adresse du pool retenu (gardé entre deux sessions)
try { PAIR = JSON.parse(localStorage.getItem('pairs_v1')) || {}; } catch(e){}
const savePairs = () => { try { localStorage.setItem('pairs_v1', JSON.stringify(PAIR)); } catch(e){} };
const txns1h = p => p && p.txns && p.txns.h1 ? (p.txns.h1.buys || 0) + (p.txns.h1.sells || 0) : 0;
const better = (x, y) => liq(x) !== liq(y) ? liq(x) > liq(y) : txns1h(x) > txns1h(y);
function pickPair(a, cands){
  const best = cands.reduce((m, p) => better(p, m) ? p : m);
  const curAddr = PAIR[a], cur = curAddr && cands.find(p => p.pairAddress === curAddr);
  if (cur) return liq(best) > 3 * liq(cur) + 1000 ? best : cur;
  // le pool retenu manque dans cette réponse : on garde l'ancien plutôt qu'un pool bien moins liquide
  if (curAddr && DEX[a] && liq(best) < liq(DEX[a]) / 2) return null;
  return best;
}
async function fetchTokens(addrs){
  const out = {}, groups = {};
  for (let i = 0; i < addrs.length; i += 15){
    const arr = await j(`${DS}/tokens/v1/solana/${addrs.slice(i,i+15).join(',')}?_=${Date.now()}`);
    for (const p of arr || []){
      if (p.chainId !== 'solana' || !p.baseToken || !p.pairAddress) continue;
      (groups[p.baseToken.address] || (groups[p.baseToken.address] = [])).push(p);
    }
  }
  // Token jamais vu : on demande la liste complète de ses pools avant de choisir
  for (const a in groups){
    if (PAIR[a]) continue;
    try {
      const all = await j(`${DS}/token-pairs/v1/solana/${a}`);
      const ok = (all || []).filter(p => p.chainId === 'solana' && p.pairAddress && p.baseToken && p.baseToken.address === a);
      if (ok.length) groups[a] = ok;
    } catch(e){}
  }
  let changed = false;
  for (const a in groups){
    const p = pickPair(a, groups[a]);
    if (p && PAIR[a] !== p.pairAddress) changed = true;
    if (p){ PAIR[a] = p.pairAddress; out[a] = p; }
    else if (DEX[a]) out[a] = DEX[a];
  }
  if (changed) savePairs();
  const now = Date.now();
  for (const a in out){
    const old = DEX[a], sn = SEEN[a] || (SEEN[a] = { got: now, moved: now });
    sn.got = now;
    if (!PF[a] && (!old || old.priceUsd !== out[a].priceUsd)) sn.moved = now;
    DEX[a] = out[a];
    if (!pfPrice(a) && (!old || old.priceUsd !== out[a].priceUsd)) addTick(a, +out[a].priceUsd, 0);
    checkTriggers('sol:'+a);
  }
  return out;
}
async function loadFeed(kind){
  const url = kind === 'top' ? DS+'/token-boosts/top/v1' : DS+'/token-profiles/latest/v1';
  const arr = await j(url);
  const addrs = [...new Set((arr||[]).filter(x => x.chainId === 'solana').map(x => x.tokenAddress))].slice(0,30);
  const got = await fetchTokens(addrs);
  feed[kind] = addrs.filter(a => got[a]);
}
async function doSearch(q){
  q = q.trim(); if (!q) return;
  memeTab = 'search'; feed.search = []; renderView(); toast('Recherche…');
  try {
    if (/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(q)){
      const got = await fetchTokens([q]);
      feed.search = got[q] ? [q] : [];
    } else {
      const r = await j(DS+'/latest/dex/search?q='+encodeURIComponent(q));
      const best = {};
      for (const p of r.pairs || []){
        if (p.chainId !== 'solana' || !p.baseToken) continue;
        const a = p.baseToken.address;
        if (!best[a] || liq(p) > liq(best[a])) best[a] = p;
      }
      const list = Object.values(best).sort((a,b) => liq(b)-liq(a)).slice(0,30);
      list.forEach(p => { const a = p.baseToken.address; if (!PAIR[a] || liq(p) > liq(DEX[a])){ DEX[a] = p; PAIR[a] = p.pairAddress; } });
      feed.search = list.map(p => p.baseToken.address);
    }
    if (!feed.search.length) toast('Aucun résultat sur Solana');
  } catch(e){ toast('Erreur de recherche'); }
  renderView();
}
let polling = false;
async function pollDex(){
  if (polling || document.hidden) return;
  polling = true;
  const set = new Set();
  for (const k in S.pos){ const {kind,id} = parse(k); if (kind === 'sol') set.add(id); }
  if (sheetKey && sheetKey.startsWith('sol:')) set.add(parse(sheetKey).id);
  if (tab === 'meme') feed[memeTab].forEach(a => set.add(a));
  if (set.size) { try { await fetchTokens([...set]); } catch(e){} }
  polling = false;
}

/* ---------- pump.fun temps réel (RPC Solana, chaque trade) ---------- */
// On s'abonne directement au compte de la bonding curve : chaque trade
// modifie ses réserves et le RPC nous pousse la nouvelle valeur.
const PUMP_PROG = '6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P';
const RPC_HTTP = 'https://api.mainnet-beta.solana.com', RPC_WS = 'wss://api.mainnet-beta.solana.com';
const PF = {}, rpcPending = {}, subToMint = {};
let rws = null, rpcId = 1;
function curveAddr(mint){
  const W = window.solanaWeb3; if (!W) return null;
  try {
    return W.PublicKey.findProgramAddressSync(
      [new TextEncoder().encode('bonding-curve'), new W.PublicKey(mint).toBytes()],
      new W.PublicKey(PUMP_PROG))[0].toBase58();
  } catch(e){ return null; }
}
function decodeCurve(b64){
  const bin = atob(b64); if (bin.length < 49) return null;
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  const dv = new DataView(u.buffer);
  return { vTok: Number(dv.getBigUint64(8, true)), vSol: Number(dv.getBigUint64(16, true)), complete: u[48] === 1 };
}
function applyCurve(mint, value){
  const c = PF[mint]; if (!c || !value || !value.data) return;
  const d = decodeCurve(value.data[0]); if (!d) return;
  const now = Date.now(), changed = d.vSol !== c.vSol || d.vTok !== c.vTok;
  const vol = c.vSol && BN.SOL ? Math.abs(d.vSol - c.vSol)/1e9 * BN.SOL.last : 0;
  Object.assign(c, d, { t: now });
  const sn = SEEN[mint] || (SEEN[mint] = { got: now, moved: now });
  sn.got = now; if (changed) sn.moved = now;
  const pr = pfPrice(mint);
  if (pr){ if (changed) addTick(mint, pr, vol); checkTriggers('sol:'+mint); }
}
function rpcSend(method, params, mint){
  if (!rws || rws.readyState !== 1) return;
  const id = rpcId++; if (mint) rpcPending[id] = { method, mint };
  rws.send(JSON.stringify({ jsonrpc: '2.0', id, method, params }));
}
function rpcSubscribe(mint){
  const c = PF[mint]; if (!c || c.sub != null) return;
  rpcSend('accountSubscribe', [c.curve, { encoding: 'base64', commitment: 'processed' }], mint);
}
function connectRPC(){
  rws = new WebSocket(RPC_WS);
  rws.onopen = () => { for (const k in subToMint) delete subToMint[k]; for (const m in PF){ PF[m].sub = null; rpcSubscribe(m); } };
  rws.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.id != null && rpcPending[d.id]){
      const r = rpcPending[d.id]; delete rpcPending[d.id];
      if (r.method === 'accountSubscribe' && PF[r.mint] && d.result != null){ PF[r.mint].sub = d.result; subToMint[d.result] = r.mint; }
      return;
    }
    if (d.method === 'accountNotification'){
      const m = subToMint[d.params.subscription];
      if (m) applyCurve(m, d.params.result.value);
    }
  };
  rws.onclose = () => setTimeout(connectRPC, 2000);
  rws.onerror = () => { try { rws.close(); } catch(e){} };
}
async function watchCurve(mint){
  if (PF[mint]) return;
  const curve = curveAddr(mint); if (!curve) return;
  PF[mint] = { curve, sub: null };
  rpcSubscribe(mint);
  try {
    const r = await fetch(RPC_HTTP, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'getAccountInfo', params: [curve, { encoding: 'base64', commitment: 'processed' }] }) });
    const jr = await r.json();
    applyCurve(mint, jr.result && jr.result.value);
  } catch(e){}
}
function unwatchCurve(mint){
  const c = PF[mint]; if (!c) return;
  if (c.sub != null){ rpcSend('accountUnsubscribe', [c.sub]); delete subToMint[c.sub]; }
  delete PF[mint];
}
function syncCurves(){
  const want = new Set();
  const add = a => { const p = DEX[a]; if (p && p.dexId === 'pumpfun' && want.size < 30) want.add(a); };
  if (sheetKey && sheetKey.startsWith('sol:')) add(parse(sheetKey).id);
  for (const k in S.pos){ const {kind,id} = parse(k); if (kind === 'sol') add(id); }
  if (tab === 'meme') feed[memeTab].forEach(add);
  for (const m in PF) if (!want.has(m)) unwatchCurve(m);
  want.forEach(m => watchCurve(m));
}
// Prix live depuis la curve (null si pas de données ou token migré)
function pfPrice(mint){
  const c = PF[mint], sol = BN.SOL && BN.SOL.last;
  if (!c || !c.vTok || !c.vSol || c.complete || !sol) return null;
  return (c.vSol/1e9) / (c.vTok/1e6) * sol;
}
const dexPrice = p => pfPrice(p.baseToken.address) ?? +p.priceUsd;

/* ---------- images des memecoins ---------- */
// DexScreener ne donne une image que si l'équipe du token a rempli sa fiche.
// Sinon on lit les métadonnées du token directement sur Solana (Metaplex ou
// Token-2022), qui pointent vers un fichier JSON contenant l'image.
const META_PROG = 'metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s';
let IMG = {};
try { IMG = JSON.parse(localStorage.getItem('memeimg_v1')) || {}; } catch(e){}
const imgBusy = new Set(), imgFail = {};
const b64bytes = b64 => { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
const ipfs = u => String(u || '').trim().replace(/^ipfs:\/\//, 'https://ipfs.io/ipfs/');
function readStr(u, o){
  const n = (u[o] | (u[o+1] << 8) | (u[o+2] << 16) | (u[o+3] << 24)) >>> 0;
  return [new TextDecoder().decode(u.slice(o+4, o+4+n)).replace(/\0/g, '').trim(), o+4+n];
}
async function rpc(method, params){
  const r = await fetch(RPC_HTTP, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }) });
  return (await r.json()).result;
}
async function metaUri(mint){

    if (r && r.value){

      [name, o] = readStr(u, o); [sym, o] = readStr(u, o); [uri] = readStr(u, o);

/* ---------- contrôle de cohérence des prix ----------
   But : repérer un MAUVAIS prix (mauvais pool, donnée aberrante), pas un vrai
   mouvement de marché. On compare donc deux sources au même instant :
   le prix utilisé par l'app et le prix agrégé de GeckoTerminal pour ce token.
   Un vrai rug fait chuter les deux ensemble : pas d'alerte.
   - écart inférieur à 3x : rien ne change ;
   - écart supérieur à 3x : avertissement, il faut appuyer une 2e fois pour valider ;
   - GeckoTerminal ne répond pas : la transaction part normalement.
   Les ventes automatiques (stop loss, take profit) ne sont jamais retardées. */
const SUSPECT_RATIO = 3, CONFIRM_MS = 15000, confirmUntil = {};
async function refPrice(id){
  if (gtBusyFor() > 1500) return null;      // file d'attente chargée : on ne retarde pas le trade
  try {
    const d = await gtFetch(`https://api.geckoterminal.com/api/v2/simple/networks/solana/token_price/${id}`, { tries: 1, timeout: 2500 });
    const tp = d.data.attributes.token_prices || {};
    const vals = Object.values(tp), v = +(tp[id] ?? tp[id.toLowerCase()] ?? (vals.length === 1 ? vals[0] : NaN));
    return v > 0 ? v : null;
  } catch(e){ return null; }
}
// Renvoie true si on peut continuer, false si on attend la confirmation du joueur
async function priceCheck(key, id, p, verb){
  if (confirmUntil[key] > Date.now()){ delete confirmUntil[key]; return true; }
  const ref = await refPrice(id), mine = dexPrice(p);
  if (!ref || !mine) return true;
  const r = mine / ref;
  if (r <= SUSPECT_RATIO && r >= 1/SUSPECT_RATIO) return true;
  confirmUntil[key] = Date.now() + CONFIRM_MS;
  toast(`Prix douteux : ${fp(mine)} ici, ${fp(ref)} sur GeckoTerminal. Appuie à nouveau sur ${verb} dans les 15 s pour confirmer.`);
  return false;
}

/* ---------- simulation d'exécution ---------- */
// Frais de pool : approximation (1 % sur la bonding curve pump.fun, 0,25 % ailleurs)
const poolFee = p => p.dexId === 'pumpfun' ? 0.01 : 0.0025;
const PRIO_MIN = 0.0001;   // pas de priority fee à 0, comme sur les vraies plateformes
const CU_LIMIT = 200000;   // unités de calcul réservées par un swap (limite par défaut de Solana)
// Frais de plateforme fixes sur les memecoins (taux de base d'Axiom), identiques pour tous les joueurs
const PLAT_FEE = 0.01;
const platFee = () => PLAT_FEE;

/* ---------- confirmation des transactions Solana ----------
   Chaque bloc (environ 400 ms), un validateur choisit les transactions qui
   paient le plus. On lit sur le vrai réseau, pour le pool du token, le
   prix minimal payé pour entrer dans chacun des ~150 derniers blocs.
   Ta priority fee dépasse ce minimum dans X % des blocs : c'est ta chance
   d'entrer à chaque bloc. Au bout de 150 blocs sans succès, le blockhash
   expire et la transaction est abandonnée (aucun frais payé). */
const SLOT_MS = 400, MAX_SLOTS = 150, feeCache = {};
async function recentFees(acct){
  const k = acct || '*', c = feeCache[k];
  if (c && Date.now() - c.t < 10000) return c.fees;
  const r = await rpc('getRecentPrioritizationFees', acct ? [[acct]] : []);
  const fees = (r || []).map(x => x.prioritizationFee);
  feeCache[k] = { t: Date.now(), fees };
  return fees;
}
const myMicroLamports = () => Math.max(PRIO_MIN, +S.settings.prio || 0) * 1e9 * 1e6 / CU_LIMIT;
function landChance(fees){
  if (!fees || !fees.length) return 0.9;
  const mine = myMicroLamports();
  return Math.min(0.95, Math.max(0.01, fees.filter(f => mine >= f).length / fees.length));
}
const feeToSol = f => f * CU_LIMIT / 1e6 / 1e9;
function median(a){ if (!a.length) return 0; const b = a.slice().sort((x,y) => x-y); return b[Math.floor(b.length/2)]; }
const poolAcct = p => (PF[p.baseToken.address] && PF[p.baseToken.address].curve) || p.pairAddress;
function etaText(q){ const sec = 0.5 + SLOT_MS/1000/q; return q < 0.05 ? 'risque d\'expiration' : '~' + (sec < 10 ? sec.toFixed(1).replace('.', ',') : Math.round(sec)) + ' s'; }
// Attend vraiment le temps de confirmation simulé. Renvoie false si la transaction expire.
async function waitLanding(p){
  let fees = [];
  try { fees = await recentFees(poolAcct(p)); } catch(e){}
  const q = landChance(fees);
  let slot = 0;
  while (++slot <= MAX_SLOTS){ if (Math.random() < q) break; }
  if (slot > MAX_SLOTS){ await sleep(MAX_SLOTS * SLOT_MS); return false; }
  await sleep(200 + Math.random()*300 + slot * SLOT_MS);
  return true;
}

function netFeeUsd(){ const sol = BN.SOL && BN.SOL.last; return sol ? (SOL_BASE_FEE + Math.max(PRIO_MIN, +S.settings.prio || 0)) * sol : null; }
// Pool modélisé en produit constant (x*y=k).
// Pool classique : chaque côté = moitié de la liquidité affichée par DexScreener.
// Bonding curve pump.fun : DexScreener n'affiche pas de liquidité, on reconstruit
// les réserves virtuelles de la courbe (30 SOL x 1 073 000 000 tokens au départ).
const PF_K = 30 * 1073000000;
function reserveUsd(p){
  const L = liq(p); if (L > 0) return L/2;
  const sol = BN.SOL && BN.SOL.last, P = +p.priceUsd, c = PF[p.baseToken.address];
  if (sol && c && c.vSol && !c.complete) return c.vSol/1e9 * sol;
  if (p.dexId === 'pumpfun' && sol && P) return Math.sqrt(PF_K * P/sol) * sol;
  return 0;
}
function buyQuote(p, usd){
  const P = dexPrice(p), R = reserveUsd(p), net = netFeeUsd();
  if (net == null) return { error: 'Prix du SOL pas encore reçu' };
  if (!P || !R) return { error: 'Liquidité inconnue pour ce token' };
  const fee = usd*(poolFee(p) + platFee());
  const dx = usd - fee - net;
  if (dx <= 0) return { error: 'Montant trop faible pour couvrir les frais' };
  const tokens = (dx/P) * R/(R+dx);
  return { tokens, fee: fee+net, impact: dx/(R+dx), avg: usd/tokens };
}
function sellQuote(p, qty){
  const P = dexPrice(p), R = reserveUsd(p), net = netFeeUsd() || 0;
  if (!P || !R) return { usd: 0, fee: 0, impact: 1 };
  const V = qty*P;
  const gross = R*V/(R+V);
  const fee = gross*(poolFee(p) + platFee());
  return { usd: Math.max(0, gross-fee-net), fee: fee+net, impact: V ? 1-gross/V : 0 };
}
function priceOf(key){
  const {kind,id} = parse(key);
  if (kind === 'bn') return BN[id] ? BN[id].last : undefined;
  return DEX[id] ? dexPrice(DEX[id]) : undefined;
}
function sellValue(pos, key){
  const {kind,id} = parse(key);
  if (kind === 'bn'){ const t = BN[id]; return t ? pos.qty*t.bid*(1-BN_FEE) : null; }
  return DEX[id] ? sellQuote(DEX[id], pos.qty).usd : null;
}
function meta(key){
  const {kind,id} = parse(key);
  if (kind === 'bn') return { sym: id, name: id+' / USDT', img: LOGO[id] || '' };
  const p = DEX[id];
  return p ? { sym: p.baseToken.symbol, name: p.baseToken.name, img: tokenImg(p) } : { sym: id.slice(0,4), name: id, img: '' };
}
function log(e){ S.hist.unshift(Object.assign({ t: Date.now() }, e)); if (S.hist.length > 500) S.hist.pop(); }

async function buy(key, amount){
  amount = +amount;
  if (!(amount > 0)) return toast('Montant invalide');
  if (amount > S.cash + 1e-9) return toast('Solde insuffisant');
  const {kind,id} = parse(key), m = meta(key);
  if (kind === 'bn'){
    const t = BN[id]; if (!t) return toast('Prix pas encore reçu');
    if (amount < BN_MIN) return toast('Minimum 5 $ sur Binance');
    const fee = amount*BN_FEE, qty = (amount-fee)/t.ask;
    addPos(key, m, qty, amount);
    S.cash -= amount;
    log({ side:'Achat', key, sym:m.sym, qty, price:t.ask, usd:amount, fee });
    toast('Acheté '+fp(qty)+' '+m.sym);
  } else {
    if (inflight.has(key)) return toast('Transaction déjà en cours sur ce token');
    const p0 = DEX[id]; if (!p0) return toast('Prix pas encore reçu');
    const q0 = buyQuote(p0, amount);
    if (q0.error) return toast(q0.error);
    inflight.add(key);
    if (!(await priceCheck(key, id, p0, 'Acheter'))){ inflight.delete(key); return; }
    toast('Transaction envoyée, en attente de confirmation…');
    const landed = await waitLanding(p0);
    if (!landed){
      inflight.delete(key);
      log({ side:'Achat expiré', key, sym:m.sym, qty:0, price:dexPrice(p0), usd:0, fee:0 });
      save(); refresh();
      return toast('Transaction expirée : priority fee trop basse. Aucun frais payé.');
    }
    let p = p0; try { const g = await fetchTokens([id]); if (g[id]) p = g[id]; } catch(e){}
    inflight.delete(key);
    const q = buyQuote(p, amount);
    if (amount > S.cash + 1e-9) return toast('Solde insuffisant');
    if (q.error || q.tokens < q0.tokens*(1 - S.settings.slip/100)){
      const nf = netFeeUsd() || 0; S.cash -= nf;
      log({ side:'Échec achat', key, sym:m.sym, qty:0, price:dexPrice(p), usd:0, fee:nf });
      save(); refresh();
      return toast('Échec : slippage dépassé (frais réseau payés)');
    }
    addPos(key, meta(key), q.tokens, amount);
    S.cash -= amount;
    log({ side:'Achat', key, sym:m.sym, qty:q.tokens, price:q.avg, usd:amount, fee:q.fee, impact:q.impact });
    toast('Acheté '+fp(q.tokens)+' '+m.sym);
  }
  save(); refresh();
}
async function sell(key, frac, reason){
  const pos = S.pos[key]; if (!pos) return;
  const {kind,id} = parse(key), m = meta(key);
  const qty = pos.qty*frac;
  if (kind === 'bn'){
    const t = BN[id]; if (!t) return toast('Prix pas encore reçu');
    const gross = qty*t.bid;
    if (gross < BN_MIN && frac < 0.999) return toast('Minimum 5 $ sur Binance, vends tout');
    const fee = gross*BN_FEE;
    close(key, frac, gross-fee, { side: reason || 'Vente', key, sym:m.sym, qty, price:t.bid, fee });
  } else {
    if (inflight.has(key)) return toast('Transaction déjà en cours sur ce token');
    const p0 = DEX[id]; if (!p0) return toast('Prix pas encore reçu');
    if (netFeeUsd() == null) return toast('Prix du SOL pas encore reçu');
    const q0 = sellQuote(p0, qty);
    inflight.add(key);
    if (!reason && !(await priceCheck(key, id, p0, 'Vendre'))){ inflight.delete(key); return; }
    toast('Transaction envoyée, en attente de confirmation…');
    const landed = await waitLanding(p0);
    if (!landed){
      inflight.delete(key);
      log({ side:'Vente expirée', key, sym:m.sym, qty:0, price:dexPrice(p0), usd:0, fee:0 });
      save(); refresh();
      return toast('Transaction expirée : priority fee trop basse. Aucun frais payé.');
    }
    let p = p0; try { const g = await fetchTokens([id]); if (g[id]) p = g[id]; } catch(e){}
    inflight.delete(key);
    if (!S.pos[key]) return;
    const q = sellQuote(p, qty);
    if (q.usd < q0.usd*(1 - S.settings.slip/100)){
      const nf = netFeeUsd() || 0; S.cash -= nf;
      log({ side:'Échec vente', key, sym:m.sym, qty:0, price:dexPrice(p), usd:0, fee:nf });
      save(); refresh();
      return toast('Échec : slippage dépassé (frais réseau payés)');
    }
    close(key, frac, q.usd, { side: reason || 'Vente', key, sym:m.sym, qty, price: qty ? q.usd/qty : 0, fee:q.fee, impact:q.impact });
  }
  save(); refresh();
}
function addPos(key, m, qty, cost){
  const p = S.pos[key] || (S.pos[key] = { sym:m.sym, name:m.name, img:m.img, qty:0, cost:0, sl:null, tp:null });
  p.qty += qty; p.cost += cost;
}
function close(key, frac, usd, e){
  const pos = S.pos[key];
  const costPart = pos.cost*frac;
  S.cash += usd;
  e.usd = usd; e.pnl = usd - costPart;
  log(e);
  if (frac >= 0.999) delete S.pos[key];
  else { pos.qty -= e.qty; pos.cost -= costPart; }
  toast(e.side+' : '+money(usd)+' ('+(e.pnl >= 0 ? '+' : '')+money(e.pnl)+')');
}
function checkTriggers(key){
  const pos = S.pos[key]; if (!pos || pos.pending || Date.now() < (pos.retryAt || 0)) return;
  const pr = priceOf(key); if (!pr) return;
  let reason = null;
  if (pos.sl && pr <= pos.sl) reason = 'Stop loss';
  else if (pos.tp && pr >= pos.tp) reason = 'Take profit';
  if (!reason) return;
  pos.pending = true;
  sell(key, 1, reason).finally(() => { if (S.pos[key]){ S.pos[key].pending = false; S.pos[key].retryAt = Date.now() + 3000; } });
}

/* ---------- historique GeckoTerminal ----------
   L'API gratuite limite le nombre de requêtes par minute : on garde les
   réponses 20 s en cache et on réessaie après une pause si la limite est atteinte.
   Si le pool donné par DexScreener est inconnu de GeckoTerminal, on cherche
   les pools du token chez GeckoTerminal. En dernier recours, on reconstruit
   les bougies à partir des 300 derniers trades. */
const GT = 'https://api.geckoterminal.com/api/v2/networks/solana', gtCache = {}, gtPools = {};
// File d'attente : l'API gratuite tolère environ 30 requêtes par minute et par
// appareil. On espace donc les requêtes de 2,2 s au lieu de les envoyer en rafale,
// et si la limite est atteinte malgré tout, on fait une pause de 20 s.
const GT_GAP = 2200;
let gtNext = 0, gtPause = 0;
async function gtSlot(){
  const now = Date.now(), at = Math.max(now, gtNext, gtPause);
  gtNext = at + GT_GAP;
  if (at > now) await sleep(at - now);
}
const gtBusyFor = () => Math.max(gtNext, gtPause) - Date.now();
async function gtFetch(url, { tries = 3, timeout = 10000 } = {}){
  for (let i = 0; i < tries; i++){
    await gtSlot();
    const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), timeout);
    let r;
    try { r = await fetch(url, { cache: 'no-store', signal: ctl.signal }); }
    catch(e){ clearTimeout(tm); if (i === tries - 1) throw e; continue; }
    clearTimeout(tm);
    if (r.status === 429){                  // limite atteinte : pause, et on laisse l'appelant réessayer plus tard
      gtPause = Date.now() + 20000;
      throw Object.assign(new Error('Limite GeckoTerminal atteinte'), { rate: true });
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }
  throw new Error('GeckoTerminal injoignable');
}
async function gt(path){
  const c = gtCache[path]; if (c && Date.now() - c.t < 20000) return c.d;
  const d = await gtFetch(GT + path);
  gtCache[path] = { t: Date.now(), d };
  return d;
}
function tradesOf(r, id){
  return (r.data || []).map(x => {
    const t = x.attributes;
    return { ts: Date.parse(t.block_timestamp)/1000, price: +(t.to_token_address === id ? t.price_to_in_usd : t.price_from_in_usd), vol: +t.volume_in_usd || 0 };
  }).filter(t => t.ts && t.price).sort((a,b) => a.ts - b.ts);
}
async function histFromPool(pool, plan, id, tf){
  const h = { bars: [], vols: [] };
  if (plan.src === 'trades'){
    const r = await gt(`/pools/${pool}/trades`);
    if (!(r.data || []).length) return null;
    const lim = Date.now()/1000 - (tf === '1m' ? 60 : 600), c = { iv: plan.iv, bars: h.bars, vols: h.vols };
    tradesOf(r, id).filter(t => t.ts >= lim).forEach(t => bucket(c, t.ts, t.price, t.vol));
    return h;
  }
  const r = await gt(`/pools/${pool}/ohlcv/${plan.tfr}?aggregate=${plan.agg}&limit=${plan.lim}&token=${id}`);
  const l = (r.data && r.data.attributes && r.data.attributes.ohlcv_list) || [];
  if (!l.length) return null;
  l.slice().reverse().forEach(x => {
    const t = x[0] + TZ(), up = +x[4] >= +x[1];
    h.bars.push({ time: t, open: +x[1], high: +x[2], low: +x[3], close: +x[4] });
    h.vols.push({ time: t, value: +x[5] || 0, color: up ? 'rgba(46,189,133,.45)' : 'rgba(246,70,93,.45)' });
  });
  return h;
}
async function loadHist(hist, plan, id, p, tf){
  const use = h => { hist.bars.push(...h.bars); hist.vols.push(...h.vols); return true; };
  try { const h = await histFromPool(p.pairAddress, plan, id, tf); if (h) return use(h); } catch(e){ if (e.rate) return false; }
  if (!gtPools[id]){
    try { const r = await gt(`/tokens/${id}/pools?page=1`); gtPools[id] = (r.data || []).map(x => x.attributes.address).filter(a => a && a !== p.pairAddress).slice(0, 2); }
    catch(e){ if (e.rate) return false; }
  }
  for (const pool of gtPools[id] || []){
    try { const h = await histFromPool(pool, plan, id, tf); if (h) return use(h); } catch(e){ if (e.rate) return false; }
  }
  if (plan.src === 'ohlcv'){          // dernier recours : les derniers trades
    for (const pool of [p.pairAddress, ...(gtPools[id] || [])]){
      try {
        const r = await gt(`/pools/${pool}/trades`), tr = tradesOf(r, id);
        if (!tr.length) continue;
        const span = tr[tr.length-1].ts - tr[0].ts, iv = Math.max(1, Math.ceil(span / 60));
        hist.iv = iv;
        tr.forEach(t => bucket(hist, t.ts, t.price, t.vol));
        return true;
      } catch(e){ if (e.rate) return false; }
    }
  }
  return false;
}

/* ---------- graphiques ---------- */
// Cryptos classiques : courbe. Memecoins : bougies + volume, comme sur Axiom.
// Les boutons choisissent la durée affichée, la taille des bougies suit.
const TZ = () => -new Date().getTimezoneOffset()*60;   // heure locale sur l'axe
const UPC = '#2ebd85', DNC = '#f6465d';
// Binance : [intervalle des points, nombre de points, pas en secondes]
// Un point par minute, 1000 minutes d'historique (~16 h). Pas de choix de durée : on zoome.
const BN_TF = { '1h': ['1m', 1000, 60] };
const CD = {};          // bougies des memecoins : { tf, iv, bars, vols }
let chartObj = null, series = null, volSeries = null, chartMode = null;

function pushChart(key, price){   // courbe des cryptos classiques
  const c = CH[key]; if (!c || !isFinite(price) || !price) return;
  const t = Math.floor((Date.now()/1000 + TZ())/c.iv)*c.iv, pts = c.pts, last = pts[pts.length-1];
  let pt;
  if (last && last.time === t){ last.value = price; pt = last; }
  else if (!last || t > last.time){ pt = { time: t, value: price }; pts.push(pt); if (pts.length > 2000) pts.shift(); }
  if (pt && key === sheetKey && chartMode === 'line' && c.tf === curTf){ try { series.update(pt); } catch(e){} }
}
// Ajoute un trade dans la bougie de sa tranche de temps
function bucket(c, ts, price, vol){
  const t = Math.floor((ts + TZ())/c.iv)*c.iv, b = c.bars, last = b[b.length-1];
  let bar, v;
  if (last && last.time === t){
    last.high = Math.max(last.high, price); last.low = Math.min(last.low, price); last.close = price;
    bar = last; v = c.vols[c.vols.length-1]; v.value += vol;
  } else if (!last || t > last.time){
    const o = last ? last.close : price;
    bar = { time: t, open: o, high: Math.max(o, price), low: Math.min(o, price), close: price };
    v = { time: t, value: vol };
    b.push(bar); c.vols.push(v);
    if (b.length > 3000){ b.shift(); c.vols.shift(); }
  } else return null;
  v.color = bar.close >= bar.open ? 'rgba(46,189,133,.45)' : 'rgba(246,70,93,.45)';
  return [bar, v];
}
const lastTick = {};
function addTick(mint, price, vol){
  if (!price || !isFinite(price)) return;
  const lt = lastTick[mint], now = Date.now()/1000;
  if (lt && lt.price === price && now - lt.ts < 1 && !vol) return;
  lastTick[mint] = { price, ts: now };
  const c = CD[mint]; if (!c) return;
  const r = bucket(c, now, price, vol || 0);
  if (r && sheetKey === 'sol:'+mint && chartMode === 'candle' && c.tf === curTf){
    try { series.update(r[0]); volSeries.update(r[1]); } catch(e){}
    showLegend(r[0], r[1]);
  }
}
// Bougies de 1 minute, jusqu'à 1000 (~16 h). Pas de choix de durée : on zoome.
function dexPlan(){ return { src: 'ohlcv', tfr: 'minute', agg: 1, lim: 1000, iv: 60 }; }
function showLegend(bar, vol){
  const el = $('#legend'); if (!el) return;
  if (!bar){ el.innerHTML = ''; return; }
  const col = bar.close >= bar.open ? 'up' : 'down', ch = bar.open ? (bar.close/bar.open - 1)*100 : 0;
  el.innerHTML = `O <span class="${col}">${fp(bar.open)}</span> H <span class="${col}">${fp(bar.high)}</span> L <span class="${col}">${fp(bar.low)}</span> C <span class="${col}">${fp(bar.close)}</span> <span class="${col}">${pct(ch)}</span>`

}
// Pas de prix minimal adapté au token, et les valeurs parasites proches de 0 s'affichent "0"
function priceFmt(ref){
  ref = ref > 0 ? ref : 1;
  const minMove = Math.pow(10, Math.floor(Math.log10(ref)) - 4);
  return { type: 'custom', minMove, formatter: v => Math.abs(v) < ref*1e-3 ? '0' : fp(v) };
}
function fitScale(data, key){
  if (!series || !data.length) return;
  const last = data[data.length-1], ref = last.close ?? last.value;
  series.applyOptions({ priceFormat: priceFmt(ref) });
}
const minSpan = orig => {
  const r = orig(); if (!r || !r.priceRange) return r;
  const lo = r.priceRange.minValue, hi = r.priceRange.maxValue, mid = (lo + hi)/2, span = Math.max(hi - lo, Math.abs(mid)*0.02);
  return { priceRange: { minValue: mid - span/2, maxValue: mid + span/2 }, margins: r.margins };
};
function buildChart(mode){

    rightPriceScale: { borderVisible: false, autoScale: true },

    handleScroll: { mouseWheel: false, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
    handleScale: { mouseWheel: true, pinch: true, axisPressedMouseMove: false, axisDoubleClickReset: false }

    series.priceScale().applyOptions({ scaleMargins: { top: 0.18, bottom: 0.25 } });
    volSeries = chartObj.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: 'vol', lastValueVisible: false, priceLineVisible: false });
    volSeries.priceScale().applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });

// Réessaie de charger l'historique toutes les 15 s (8 fois max) tant que la fiche reste ouverte
function retryChart(key, tf, attempt){
  if (attempt >= 8) return;
  const wait = Math.max(5000, gtBusyFor() + 1000);   // après la pause de GeckoTerminal si elle est en cours
  setTimeout(() => { if (key === sheetKey && tf === curTf) loadChart(key, attempt + 1); }, wait);
}
async function loadChart(key, attempt = 0){
  const {kind,id} = parse(key), tf = curTf, note = t => { const n = $('#chartnote'); if (n) n.textContent = t; };
  note('');
  if (kind === 'bn'){
    buildChart('line');
    const [i, lim, iv] = BN_TF[tf];
    CH[key] = { tf, iv, pts: [] };
    let pts = [];
    try {
      const k = await bnGet(`/api/v3/klines?symbol=${id}USDT&interval=${i}&limit=${lim}`);
      pts = k.map(r => ({ time: r[0]/1000 + TZ(), value: +r[4] }));
    } catch(e){
      note(attempt < 8 ? 'Historique en cours de chargement…' : 'Historique indisponible, la courbe se construit en direct.');
      retryChart(key, tf, attempt);
    }
    if (key !== sheetKey || tf !== curTf) return;
    CH[key] = { tf, iv, pts };
    const pr = priceOf(key); if (pr) pushChart(key, pr);
    if (series){
      const up = pts.length < 2 || pts[pts.length-1].value >= pts[0].value, col = up ? '46,189,133' : '246,70,93';
      series.applyOptions({ lineColor: `rgb(${col})`, topColor: `rgba(${col},.25)`, bottomColor: `rgba(${col},0)` });
      series.setData(CH[key].pts); fitScale(CH[key].pts); defaultView(CH[key].pts.length);
    }
    return;
  }
  // memecoin
  buildChart('candle');
  let p = DEX[id];
  if (!p){                                   // fiche ouverte avant d'avoir reçu les infos du token
    try { await fetchTokens([id]); } catch(e){}
    p = DEX[id];
    if (key !== sheetKey || tf !== curTf) return;
  }
  const plan = dexPlan(tf, p);
  const prev = CD[id] && CD[id].iv === plan.iv ? CD[id] : null;   // on garde les bougies déjà construites en direct
  CD[id] = prev || { tf, iv: plan.iv, bars: [], vols: [] };
  { const pr0 = priceOf(key); if (pr0 && !CD[id].bars.length) bucket(CD[id], Date.now()/1000, pr0, 0); }
  if (series){ series.setData(CD[id].bars); volSeries.setData(CD[id].vols); defaultView(CD[id].bars.length); }
  if (!prev || prev.bars.length < 20) note('Chargement de l\'historique…');
  const hist = { tf, iv: plan.iv, bars: [], vols: [] };
  if (!p || !(await loadHist(hist, plan, id, p, tf))){
    note(attempt < 8 ? 'Historique en cours de chargement…' : 'Historique indisponible pour ce token, les bougies se construisent en direct.');
    retryChart(key, tf, attempt);
  } else note('');
  if (key !== sheetKey || tf !== curTf) return;
  const live = CD[id], lastT = hist.bars.length ? hist.bars[hist.bars.length-1].time : -Infinity;
  live.bars.forEach((b, i) => { if (b.time > lastT){ hist.bars.push(b); hist.vols.push(live.vols[i]); } });
  CD[id] = hist;
  const pr = priceOf(key); if (pr && !hist.bars.length) bucket(hist, Date.now()/1000, pr, 0);
  if (series){
    series.setData(hist.bars); volSeries.setData(hist.vols); fitScale(hist.bars);
    // Avec peu de bougies, on garde une largeur normale au lieu d'étirer une bougie sur tout l'écran
    defaultView(hist.bars.length);
    if (hist.bars.length) showLegend(hist.bars[hist.bars.length-1], hist.vols[hist.vols.length-1]);
  }
  if (hist.bars.length < 2 && !$('#chartnote').textContent) note('Peu de trades pour l\'instant. Les nouvelles bougies apparaîtront en direct.');
}

/* ---------- entraînement ----------
   Exercices à réponse exacte, générés au hasard, calculés avec les mêmes
   formules que la simulation. Chaque exercice a son schéma (SVG), qui se
   complète une fois la réponse donnée. */
const TRAIN_CATS = [['all','Tout'],['impact','Impact'],['slip','Slippage'],['be','Rentabilité'],['size','Taille de position'],['fees','Frais'],['rr','Risque / gain'],['logo','Logos']];
let trainCat = 'all', curEx = null;
const rnd = (a, b) => a + Math.random()*(b - a);
const pickOne = arr => arr[Math.floor(Math.random()*arr.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const k = Math.floor(Math.random()*(i + 1)); [a[i], a[k]] = [a[k], a[i]]; } return a; };
const solPx = () => (BN.SOL && BN.SOL.last) || 150;
const pct1 = x => nf2(x, 1) + ' %';
const solTxt = x => String(x).replace('.', ',');
function makeChoices(correct, traps, fmt){
  const good = fmt(correct), out = [good], seen = new Set(out);
  for (const w of traps){ if (!(w > 0) || !isFinite(w)) continue; const t = fmt(w); if (!seen.has(t)){ seen.add(t); out.push(t); } if (out.length === 4) break; }
  for (let k = 1; out.length < 4 && k < 20; k++){ const t = fmt(correct * (k % 2 ? 1 + 0.4*k : 1/(1 + 0.4*k))); if (!seen.has(t)){ seen.add(t); out.push(t); } }
  return { choices: shuffle(out), answer: good };
}

// Trajet de prix pseudo-aléatoire (stable pour un même exercice)
function walk(n, from, to, wobble, seed){
  let r = seed; const rand = () => (r = (r*9301 + 49297) % 233280) / 233280;
  const out = [];
  for (let i = 0; i < n; i++){ const t = i/(n - 1); out.push(from + (to - from)*t + (rand() - 0.5)*wobble*Math.sin(Math.PI*t)); }
  out[n - 1] = to; return out;
}
const pathOf = (vals, xa, xb, yf) => vals.map((v, i) => `${i ? 'L' : 'M'}${(xa + (xb - xa)*i/(vals.length - 1)).toFixed(1)},${yf(v).toFixed(1)}`).join('');
const line = (d, c, w = 2) => `<path d="${d}" style="fill:none;stroke:${c};stroke-width:${w};stroke-linejoin:round;stroke-linecap:round"/>`;
const dot = (x, y, c, r = 4.5) => `<circle cx="${x}" cy="${y}" r="${r}" style="fill:${c};stroke:var(--surface0);stroke-width:2"/>`;

// Schéma slippage : prix au clic, trajet, et zone tolérée (affichée une fois connue)
function slipViz(buy, movePct, tolPct, seed, tolIsGiven = false, steps2 = null){

/* ---------- cas pratiques : missions ----------
   Une mission = un énoncé (profil de risque, réseau), trois tokens au choix,
   un ticket d'ordre complet, puis le marché se déroule. Les prix futurs sont
   simulés : il y a une vraie part de hasard. La note juge les DÉCISIONS
   (sur 100) ; le résultat en dollars est montré à part. */
const PROFILES = [
  { id: 'prudent', name: 'Prudent', maxLoss: 3, goal: 2, desc: 'Tu protèges ton capital avant tout. Mieux vaut un petit gain sûr qu\'un gros pari.' },
  { id: 'equi', name: 'Équilibré', maxLoss: 8, goal: 5, desc: 'Un risque mesuré pour un gain correct.' },
  { id: 'agressif', name: 'Agressif', maxLoss: 20, goal: 15, desc: 'Tu acceptes une grosse perte possible pour viser un gros gain.' }
];
const CONG = [ { name: 'calme', median: 0.0002 }, { name: 'normal', median: 0.001 }, { name: 'chargé', median: 0.004 } ];
const TTYPES = {
  major: { label: 'Grosse crypto', liq: [2e7, 6e7], vol: 0.0035, slip: [0.5, 2], price: [20, 400], pool: 0.0025 },
  estab: { label: 'Memecoin établi', liq: [1.5e5, 5e5], vol: 0.014, slip: [2, 8], price: [0.002, 0.2], pool: 0.0025 },
  fresh: { label: 'Memecoin récent', liq: [6e3, 2.5e4], vol: 0.035, slip: [8, 20], price: [0.000004, 0.0004], pool: 0.01 }
};
const TNAMES = { major: ['ORBIT', 'NOVA', 'ATLAS', 'VEGA'], estab: ['FROGE', 'KITTY', 'BLOB', 'HONK'], fresh: ['ZORP', 'GIGA', 'WAGMI', 'PLOP', 'YEET', 'MOON'] };
const FIT = { prudent: { major: 25, estab: 17, fresh: 6 }, equi: { major: 17, estab: 25, fresh: 14 }, agressif: { major: 8, estab: 18, fresh: 25 } };
const CAPITAL = 100, CANDLES = 60;
let M = null, cpChart = null, cpSeries = null;
const gauss = () => { let u = 0, w = 0; while (!u) u = Math.random(); while (!w) w = Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*w); };
function gbm(n, p0, vol, drift){
  const out = []; let p = p0;
  for (let i = 0; i < n; i++){
    const o = p, fat = Math.random() < 0.06 ? 3 : 1;
    p = Math.max(o*0.2, o*Math.exp(drift + vol*fat*gauss()));
    const h = Math.max(o, p)*(1 + Math.abs(gauss())*vol*0.45), l = Math.min(o, p)*(1 - Math.abs(gauss())*vol*0.45);
    out.push({ o, h, l, c: p });
  }
  return out;
}
function mkToken(type, flagged, used){
  const T = TTYPES[type], price = Math.exp(rnd(Math.log(T.price[0]), Math.log(T.price[1])));
  const names = TNAMES[type].filter(n => !used.has(n)), name = pickOne(names); used.add(name);
  const vol = T.vol*rnd(0.8, 1.3), drift = (Math.random() - 0.5)*T.vol*0.3;
  // historique qui se termine au prix actuel
  const h0 = gbm(CANDLES, 1, vol, (Math.random() - 0.5)*T.vol*0.3), k = price/h0[h0.length - 1].c;
  const hist = h0.map(c => ({ o: c.o*k, h: c.h*k, l: c.l*k, c: c.c*k }));
  const fut = gbm(CANDLES, price, vol, drift);
  const checks = { mint: true, freeze: true, lp: true };
  let rug = -1, rugKind = null;
  if (flagged){
    rugKind = pickOne(['mint', 'freeze', 'lp']); checks[rugKind] = false;
    if (Math.random() < 0.75){
      rug = Math.floor(rnd(8, 50));
      if (rugKind !== 'freeze') for (let i = rug; i < CANDLES; i++){ const c = fut[i]; const m = 0.07; fut[i] = { o: i === rug ? c.o : c.o*m, h: i === rug ? c.o : c.h*m, l: c.l*m, c: c.c*m }; }
    }
  }
  const R = rnd(T.liq[0], T.liq[1]);
  return { name, type, label: T.label, pool: T.pool, price, R, vol, slip: T.slip, hist, fut, checks, rug, rugKind,
    top10: type === 'major' ? Math.round(rnd(8, 18)) : Math.round(rnd(type === 'fresh' ? 22 : 14, type === 'fresh' ? 55 : 35)),
    mc: type === 'major' ? R*rnd(25, 60) : price*1e9 };
}
function newMission(){
  const used = new Set(), profile = pickOne(PROFILES), cong = pickOne(CONG);
  const flagEstab = Math.random() < 0.25, flagFresh = !flagEstab && Math.random() < 0.6;
  const tokens = shuffle([mkToken('major', false, used), mkToken('estab', flagEstab, used), mkToken('fresh', flagFresh, used)]);
  M = { profile, cong, tokens, sol: Math.round(solPx()), sel: 0, amount: 30, slip: 5, prio: 0.001, sl: 10, tp: 20, running: false, result: null };
}
const missionFees = (t, A) => ({ pct: t.pool + PLAT_FEE, net: (M.prio + SOL_BASE_FEE)*M.sol });
function preview(){
  const t = M.tokens[M.sel], A = +M.amount || 0, f = missionFees(t, A);
  const dx = Math.max(0, A*(1 - f.pct) - f.net), imp = dx/(t.R + dx);
  const sl = +M.sl, tp = +M.tp;
  const exitCost = A*(f.pct) + f.net;
  const risk = sl > 0 ? Math.min(A, A*(sl/100) + 2*(A*f.pct + f.net) + 2*A*imp) : A;
  return { A, f, imp, risk, rr: sl > 0 && tp > 0 ? tp/sl : 0, buyFees: A*f.pct + f.net, exitCost };
}
